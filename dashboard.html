<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:radial-gradient(circle at top, #071a33, #02030f);
      color:#eaf6ff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    header {
      padding:14px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      max-width:1100px;
      margin:0 auto;
      width:100%;
    }
    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:inherit;
    }
    .brand img { height:32px; }
    .brand-title { font-weight:800; font-size:18px; }
    .brand-sub { font-size:11px; color:var(--muted); }
    nav { display:flex; gap:12px; }
    nav a {
      color:var(--muted);
      text-decoration:none;
      padding:6px 10px;
      border-radius:999px;
    }
    nav a.active { background:rgba(0,224,184,0.12); color:#fff; }
    .login-pill {
      border:1px solid rgba(255,255,255,0.15);
      padding:6px 12px;
      border-radius:999px;
      color:#eaf6ff;
    }
    main {
      flex:1;
      display:flex;
      justify-content:center;
      padding:20px;
    }
    .container {
      width:100%;
      max-width:1100px;
      display:grid;
      grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
      gap:18px;
    }
    .panel {
      background:rgba(11,16,32,0.96);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 18px 50px rgba(0,0,0,0.6);
      padding:22px;
    }
    h1 { margin:0 0 10px; font-size:22px; }
    h2 { margin:0 0 10px; font-size:18px; }
    .muted { color:var(--muted); font-size:14px; }
    .btn {
      padding:10px 16px;
      border-radius:999px;
      border:none;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
    }
    .search-box {
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border-radius:10px;
      background:#0b152d;
      border:1px solid rgba(255,255,255,0.1);
      color:#eaf6ff;
    }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th {
      padding:8px;
      color:var(--muted);
      border-bottom:1px solid rgba(255,255,255,0.12);
      text-align:left;
    }
    td {
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    a.tbl { color:#00d4ff; text-decoration:none; }
  </style>
</head>

<body>

<header>
  <a class="brand" href="/dashboard.html">
    <img src="/logo.png" alt="AMI logo">
    <div>
      <div class="brand-title">AMI Health</div>
      <div class="brand-sub">Artificial Medical Intelligence</div>
    </div>
  </a>
  <nav>
    <a href="/dashboard.html" class="active">Dashboard</a>
    <a href="/upload.html">Upload Report</a>
    <a class="login-pill" href="#" id="logoutLink">Logout</a>
  </nav>
</header>

<main>
  <div class="container">

    <section class="panel">
      <h1>AMI Dashboard</h1>
      <p class="muted">Welcome back, <span id="userEmailText">loading…</span>.</p>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <a class="btn" href="/upload.html">Upload new report</a>
        <button class="btn" id="logoutBtn" style="background:#222;color:#fff;">Logout</button>
      </div>
    </section>

    <section class="panel">
      <h2>Your Reports</h2>
      <input class="search-box" id="searchBox" placeholder="Search reports…">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Patient</th>
            <th>Date</th>
            <th>AI</th>
            <th>PDF</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </section>

  </div>
</main>

<script type="module">
import { supabase } from "./lib/supabaseClient.js";

const userEmailText = document.getElementById("userEmailText");
const reportsTable = document.getElementById("reportsTable");
const searchBox = document.getElementById("searchBox");
let fullList = [];

async function loadUser() {
  const { data:{ session } } = await supabase.auth.getSession();
  if (!session) return location.href="/login.html";
  userEmailText.textContent = session.user.email;
  loadReports();
}

async function loadReports() {
  const { data:{ session } } = await supabase.auth.getSession();
  const res = await fetch("/api/get-reports", {
    headers:{ Authorization:`Bearer ${session.access_token}` }
  });
  const data = await res.json();
  fullList = data.reports || [];
  render(fullList);
}

function render(list) {
  if (!list.length) {
    reportsTable.innerHTML=`<tr><td colspan="5">No reports.</td></tr>`;
    return;
  }

  reportsTable.innerHTML = list.map(r => {
    const title =
      r.title ||
      r.ai_results?.metadata?.report_type ||
      "Untitled report";

    const patient =
      r.name ||
      r.ai_results?.patient?.name ||
      "—";

    return `
      <tr>
        <td>${title}</td>
        <td>${patient}</td>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td><a class="tbl" href="/report.html?id=${r.id}">View AI</a></td>
        <td><a class="tbl" href="/api/get-file-url?path=${encodeURIComponent(r.file_path)}" target="_blank">Open PDF</a></td>
      </tr>`;
  }).join("");
}

searchBox.oninput = () => {
  const q = searchBox.value.toLowerCase();
  render(fullList.filter(r =>
    (r.title||"").toLowerCase().includes(q) ||
    (r.ai_results?.patient?.name||"").toLowerCase().includes(q)
  ));
};

document.getElementById("logoutBtn").onclick=logout;
document.getElementById("logoutLink").onclick=logout;
async function logout() {
  await supabase.auth.signOut();
  location.href="/login.html";
}

setInterval(loadReports,6000);
loadUser();
</script>

</body>
</html>
