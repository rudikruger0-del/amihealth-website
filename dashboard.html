<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:radial-gradient(circle at top, #071a33, #02030f);
      color:#eaf6ff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header {
      padding:14px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      max-width:1100px;
      margin:0 auto;
      width:100%;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:inherit;
    }

    .brand img { height:32px; }
    .brand-title { font-weight:800; font-size:18px; }
    .brand-sub { font-size:11px; color:var(--muted); }

    nav { display:flex; gap:12px; }

    nav a {
      color:var(--muted);
      text-decoration:none;
      padding:6px 10px;
      border-radius:999px;
    }

    nav a.active {
      background:rgba(0,224,184,0.12); color:#fff;
    }

    .login-pill {
      border:1px solid rgba(255,255,255,0.15);
      padding:6px 12px;
      border-radius:999px;
      color:#eaf6ff;
    }

    main {
      flex:1;
      display:flex;
      justify-content:center;
      padding:20px;
    }

    .container {
      width:100%;
      max-width:1100px;
      display:grid;
      grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
      gap:18px;
    }

    .panel {
      background:rgba(11,16,32,0.96);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 18px 50px rgba(0,0,0,0.6);
      padding:22px;
    }

    h1 { margin:0 0 10px; font-size:22px; }
    h2 { margin:0 0 10px; font-size:18px; }

    .muted { color:var(--muted); font-size:14px; }

    .btn {
      padding:10px 16px;
      border-radius:999px;
      border:none;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
    }

    /* Reports Table */
    .search-box {
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border-radius:10px;
      background:#0b152d;
      border:1px solid rgba(255,255,255,0.1);
      color:#eaf6ff;
    }

    table {
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }

    th {
      text-align:left;
      padding:8px;
      color:var(--muted);
      font-weight:600;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    td {
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,0.05);
      color:#fff;
    }

    a.tbl {
      color:#00d4ff;
      text-decoration:none;
      font-size:13px;
    }

    /* PDF Viewer Modal */
    #pdfModal {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      backdrop-filter:blur(4px);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:9999;
    }

    #pdfBox {
      background:#0b1020;
      width:90%;
      height:90%;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.15);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    #pdfFrame {
      width:100%;
      height:100%;
      border:none;
      background:#000;
    }

    .modal-header {
      padding:10px;
      display:flex;
      justify-content:space-between;
      background:#020614;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .modal-header button {
      padding:6px 14px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:600;
    }

    .btn-close {
      background:#ff4e6a; color:#fff;
    }

    .btn-print {
      background:#00e0b8; color:#001821;
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="/dashboard.html">
    <img src="/logo.png" alt="AMI Logo" />
    <div>
      <div class="brand-title">AMI Health</div>
      <div class="brand-sub">Artificial Medical Intelligence</div>
    </div>
  </a>

  <nav>
    <a href="/dashboard.html" class="active">Dashboard</a>
    <a href="/upload.html">Upload Report</a>
    <a class="login-pill" href="#" id="logoutLink">Logout</a>
  </nav>
</header>

<main>
  <div class="container">

    <!-- LEFT PANEL -->
    <section class="panel">
      <h1>AMI Dashboard</h1>
      <p class="muted">
        Welcome back, <span id="userEmailText">Loading…</span>.
      </p>

      <div style="margin-top:14px; display:flex; gap:10px;">
        <a class="btn" href="/upload.html">Upload new report</a>
        <button class="btn" id="logoutBtn" style="background:#222;color:#fff;">
          Logout
        </button>
      </div>
    </section>

    <!-- RIGHT PANEL — REPORTS LIST -->
    <section class="panel">
      <h2>Your Reports</h2>
      <input class="search-box" placeholder="Search reports…" id="searchBox" />

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Patient</th>
            <th>Date</th>
            <th>AI</th>
            <th>PDF</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </section>

  </div>
</main>

<!-- PDF MODAL -->
<div id="pdfModal">
  <div id="pdfBox">
    <div class="modal-header">
      <button class="btn-print">Print</button>
      <button class="btn-close">Close</button>
    </div>
    <iframe id="pdfFrame"></iframe>
  </div>
</div>

<!-- LOGIC -->
<script type="module">
  import { supabase } from "./lib/supabaseClient.js";

  const userEmailText = document.getElementById("userEmailText");
  const logoutBtn = document.getElementById("logoutBtn");
  const logoutLink = document.getElementById("logoutLink");
  const reportsTable = document.getElementById("reportsTable");
  const searchBox = document.getElementById("searchBox");

  let fullReportList = [];

  /* AUTH CHECK */
  async function loadUser() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return (window.location.href = "/login.html");
    userEmailText.textContent = session.user.email;
    loadReports(session.user.email);
  }

  /* FETCH REPORTS */
  async function loadReports(email) {
    const res = await fetch(`/api/get-reports?email=${email}`);
    const json = await res.json();

    fullReportList = json.reports || [];
    renderReports(fullReportList);
  }

  /* RENDER REPORT TABLE */
  function renderReports(list) {
    if (!list.length) {
      reportsTable.innerHTML = `<tr><td colspan="5">No reports found.</td></tr>`;
      return;
    }

    reportsTable.innerHTML = list.map(r => `
      <tr>
        <td>${r.title || "-"}</td>
        <td>${r.name || "-"}</td>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td><a class="tbl" href="/api/get-ai-report?id=${r.id}" target="_blank">View AI</a></td>
        <td><a class="tbl pdfOpen" data-path="${r.file_path}" href="#">Open PDF</a></td>
      </tr>
    `).join("");

    // Attach PDF open events
    document.querySelectorAll(".pdfOpen").forEach(el => {
      el.addEventListener("click", e => {
        e.preventDefault();
        openPDF(el.dataset.path);
      });
    });
  }

  /* SEARCH FILTER */
  searchBox.addEventListener("input", () => {
    const q = searchBox.value.toLowerCase();
    const filtered = fullReportList.filter(r =>
      (r.title || "").toLowerCase().includes(q) ||
      (r.name || "").toLowerCase().includes(q)
    );
    renderReports(filtered);
  });

  /* PDF VIEWER */
  const pdfModal = document.getElementById("pdfModal");
  const pdfFrame = document.getElementById("pdfFrame");

  function openPDF(path) {
    pdfFrame.src = `https://tybttsfztuudygbkrbnm.supabase.co/storage/v1/object/public/reports/${path}`;
    pdfModal.style.display = "flex";
  }

  document.querySelector(".btn-close").onclick = () =>
    (pdfModal.style.display = "none");

  document.querySelector(".btn-print").onclick = () =>
    pdfFrame.contentWindow.print();

  /* LOGOUT */
  async function doLogout() {
    await supabase.auth.signOut();
    window.location.href = "/login.html";
  }
  logoutBtn.onclick = doLogout;
  logoutLink.onclick = doLogout;

  loadUser();

  /* AUTO-REFRESH EVERY 8 SECONDS */
  setInterval(() => {
    const email = userEmailText.textContent;
    if (email && email.includes("@")) loadReports(email);
  }, 8000);
</script>

</body>
</html>
