<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AMI Dashboard</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .ai-box {
        white-space: pre-wrap;
        background: #111;
        color: #0f0;
        padding: 20px;
        border-radius: 10px;
        font-family: monospace;
        max-height: 80vh;
        overflow: auto;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .modal {
        background: #fff;
        padding: 25px;
        width: 90%;
        max-width: 700px;
        max-height: 90vh;
        overflow: auto;
        border-radius: 12px;
      }
      .close-btn {
        float: right;
        cursor: pointer;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo-text">AMI Health</span>
        <span class="tagline">Smarter Diagnostics — Better Care</span>
      </div>
      <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/upload.html">Upload Report</a>
      </nav>
    </header>

    <main class="page">
      <section class="panel">
        <p id="userEmail"></p>
        <button id="logoutBtn">Logout</button>
      </section>

      <section class="panel">
        <h1>Your Reports</h1>
        <p>
          View, download, or open AI results for each uploaded report.
        </p>

        <table class="table">
          <thead>
            <tr>
              <th>Created</th>
              <th>Title</th>
              <th>File</th>
              <th>AI Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reportsBody"></tbody>
        </table>
      </section>
    </main>

    <!-- AI RESULT MODAL -->
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2>AI Report</h2>
        <div id="aiContent" class="ai-box"></div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "/lib/supabaseClient.js";

      const email =
        localStorage.getItem("ami_email") ||
        localStorage.getItem("amihealth_email") ||
        "";

      const userEmailEl = document.getElementById("userEmail");
      const tbody = document.getElementById("reportsBody");

      // Show email
      if (email) {
        userEmailEl.textContent = `Signed in as ${email}`;
      } else {
        userEmailEl.textContent = "Not signed in";
      }

      // Logout
      document
        .getElementById("logoutBtn")
        .addEventListener("click", () => {
          localStorage.removeItem("ami_email");
          localStorage.removeItem("amihealth_email");
          window.location.href = "/index.html";
        });

      // Fetch reports from backend
      async function fetchReports() {
        tbody.innerHTML = "<tr><td colspan='5'>Loading…</td></tr>";

        if (!email) {
          tbody.innerHTML =
            "<tr><td colspan='5'>No email — log in again.</td></tr>";
          return;
        }

        try {
          const resp = await fetch(
            `/api/get-reports?email=${encodeURIComponent(email)}`
          );
          const json = await resp.json();

          if (!resp.ok) {
            console.error(json);
            tbody.innerHTML =
              "<tr><td colspan='5'>Failed to load reports.</td></tr>";
            return;
          }

          const reports = json.reports || [];
          if (reports.length === 0) {
            tbody.innerHTML =
              "<tr><td colspan='5'>No reports yet. Upload one.</td></tr>";
            return;
          }

          tbody.innerHTML = "";

          for (const r of reports) {
            const tr = document.createElement("tr");

            const created = new Date(r.created_at).toLocaleString();
            const title = r.title || "Untitled Report";
            const file = r.file_path;

            const status =
              r.ai_status ||
              (r.ai_results && !r.ai_results.error
                ? "completed"
                : r.ai_results?.error
                ? "failed"
                : "processing");

            tr.innerHTML = `
              <td>${created}</td>
              <td>${title}</td>
              <td>${file}</td>
              <td>${status}</td>
              <td>
                <button class="view-btn">View PDF</button>
                <button class="download-btn">Download</button>
                <button class="ai-btn" ${
                  status !== "completed" ? "disabled" : ""
                }>AI Report</button>
              </td>
            `;

            const viewBtn = tr.querySelector(".view-btn");
            const downloadBtn = tr.querySelector(".download-btn");
            const aiBtn = tr.querySelector(".ai-btn");

            viewBtn.addEventListener("click", () =>
              openSignedUrl(file, true)
            );
            downloadBtn.addEventListener("click", () =>
              openSignedUrl(file, false)
            );
            aiBtn.addEventListener("click", () =>
              showAiModal(r.ai_results)
            );

            tbody.appendChild(tr);
          }
        } catch (e) {
          console.error(e);
          tbody.innerHTML =
            "<tr><td colspan='5'>Unexpected error.</td></tr>";
        }
      }

      // Get signed Supabase URL
      async function openSignedUrl(file_path, newTab) {
        const resp = await fetch("/api/get-file-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file_path }),
        });

        const json = await resp.json();
        if (!json.url) {
          alert("Could not get file URL");
          return;
        }

        if (newTab) window.open(json.url, "_blank");
        else window.location.href = json.url;
      }

      // Show AI modal
      const modalBg = document.getElementById("modalBg");
      const closeModal = document.getElementById("closeModal");
      const aiContent = document.getElementById("aiContent");

      closeModal.addEventListener("click", () => {
        modalBg.style.display = "none";
      });

      function showAiModal(data) {
        if (!data || data.error) {
          alert("AI report not ready yet.");
          return;
        }

        aiContent.textContent = JSON.stringify(data, null, 2);
        modalBg.style.display = "flex";
      }

      fetchReports();
    </script>
  </body>
</html>
