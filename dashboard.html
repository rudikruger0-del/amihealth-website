<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AMI Dashboard</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo-text">AMI Health</span>
        <span class="tagline">Smarter Diagnostics — Better Care</span>
      </div>
      <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/upload.html">Upload Report</a>
      </nav>
    </header>

    <main class="page">
      <section class="panel">
        <p id="userEmail"></p>
        <button id="logoutBtn">Logout</button>
      </section>

      <section class="panel">
        <h1>Your Reports</h1>
        <p>
          View, download, or open AI interpretation for each report. PDFs come
          from a <b>private</b> bucket using signed URLs.
        </p>

        <table class="table" id="reportsTable">
          <thead>
            <tr>
              <th>Created</th>
              <th>Title</th>
              <th>File</th>
              <th>AI Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reportsBody"></tbody>
        </table>
      </section>
    </main>

    <script type="module">
      const email =
        localStorage.getItem("ami_email") ||
        localStorage.getItem("amihealth_email") ||
        "";

      const userEmailEl = document.getElementById("userEmail");
      const tbody = document.getElementById("reportsBody");

      if (email) {
        userEmailEl.textContent = `Signed in as ${email}`;
      } else {
        userEmailEl.textContent = "Not signed in";
      }

      document
        .getElementById("logoutBtn")
        .addEventListener("click", () => {
          localStorage.removeItem("ami_email");
          localStorage.removeItem("amihealth_email");
          window.location.href = "/index.html";
        });

      async function fetchReports() {
        tbody.innerHTML = '<tr><td colspan="5">Loading…</td></tr>';

        if (!email) {
          tbody.innerHTML =
            '<tr><td colspan="5">No email, please log in again.</td></tr>';
          return;
        }

        try {
          const resp = await fetch(
            `/api/get-reports?email=${encodeURIComponent(email)}`
          );
          const json = await resp.json();

          if (!resp.ok) {
            console.error(json);
            tbody.innerHTML =
              '<tr><td colspan="5">Failed to load reports.</td></tr>';
            return;
          }

          const reports = json.reports || [];
          if (reports.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5">No reports yet. Upload one from the Upload page.</td></tr>';
            return;
          }

          tbody.innerHTML = "";
          for (const r of reports) {
            const tr = document.createElement("tr");

            const created = new Date(r.created_at).toLocaleString();
            const title = r.title || "Untitled Report";
            const fileName = r.file_path || "";

            const status =
              r.ai_status ||
              (r.ai_results && !r.ai_results.error
                ? "completed"
                : r.ai_results && r.ai_results.error
                ? "failed"
                : "pending");

            tr.innerHTML = `
              <td>${created}</td>
              <td>${title}</td>
              <td>${fileName}</td>
              <td>${status}</td>
              <td>
                <button class="view-btn">View PDF</button>
                <button class="download-btn">Download</button>
                <button class="ai-btn"${
                  status !== "completed" ? " disabled" : ""
                }>AI Report</button>
              </td>
            `;

            const viewBtn = tr.querySelector(".view-btn");
            const downloadBtn = tr.querySelector(".download-btn");
            const aiBtn = tr.querySelector(".ai-btn");

            viewBtn.addEventListener("click", () =>
              openSignedUrl(r.file_path, true)
            );
            downloadBtn.addEventListener("click", () =>
              openSignedUrl(r.file_path, false)
            );
            aiBtn.addEventListener("click", () =>
              showAiReport(r.ai_results || null)
            );

            tbody.appendChild(tr);
          }
        } catch (e) {
          console.error(e);
          tbody.innerHTML =
            '<tr><td colspan="5">Unexpected error loading reports.</td></tr>';
        }
      }

      async function openSignedUrl(filePath, inNewTab) {
        if (!filePath) {
          alert("No file path for this report.");
          return;
        }

        try {
          const resp = await fetch("/api/get-file-url", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file_path: filePath }),
          });
          const json = await resp.json();
          if (!resp.ok || !json.url) {
            console.error(json);
            alert("Could not open file from storage.");
            return;
          }

          if (inNewTab) {
            window.open(json.url, "_blank");
          } else {
            window.location.href = json.url;
          }
        } catch (e) {
          console.error(e);
          alert("Failed to open file.");
        }
      }

      function showAiReport(aiResults) {
        if (!aiResults || aiResults.error) {
          alert("AI analysis not available yet for this report.");
          return;
        }

        const pretty = JSON.stringify(aiResults, null, 2);
        const win = window.open("", "_blank");
        win.document.write("<pre>" + pretty + "</pre>");
        win.document.close();
      }

      fetchReports();
    </script>
  </body>
</html>
