<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Simple status pills */
    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-processing {
      background: #fff3cd;
      color: #8a6d3b;
    }
    .status-completed {
      background: #d4edda;
      color: #155724;
    }
    .status-failed {
      background: #f8d7da;
      color: #721c24;
    }

    /* Modal content for AI */
    .modal-content-scroll {
      max-height: 80vh;
      overflow-y: auto;
    }

    .ai-section-title {
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .ai-chip {
      display: inline-block;
      padding: 3px 7px;
      margin: 2px;
      border-radius: 999px;
      font-size: 11px;
      background: #f1f5f9;
    }

    .ai-marker-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 12px;
    }
    .ai-marker-table th,
    .ai-marker-table td {
      border-bottom: 1px solid #e2e8f0;
      padding: 4px 6px;
      text-align: left;
    }
    .ai-marker-table th {
      background: #f8fafc;
    }

    /* Print: show only modal */
    @media print {
      body * {
        visibility: hidden;
      }
      #modalRoot, #modalRoot * {
        visibility: visible;
      }
      #modalRoot {
        position: static !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="brand">
        <img src="/logo.png" alt="AMI logo">
        <div>
          <h3>AMI Health</h3>
          <p>Smarter Diagnostics — Better Care</p>
        </div>
      </div>

      <nav class="nav" aria-label="Sidebar">
        <a href="/dashboard.html" class="active">Dashboard</a>
        <a href="/upload.html">Upload Report</a>
        <a href="#" id="btnDocs">AI Results</a>
        <a href="#" id="btnSettings">Settings</a>
      </nav>

      <div style="margin-top:auto">
        <div style="font-size:12px;opacity:0.9">Signed in as</div>
        <div id="userEmail" style="font-weight:700;margin-top:6px"></div>
        <div style="height:10px"></div>
        <button id="logout" class="btn" style="width:100%">Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" role="main">
      <div class="topbar">
        <div class="welcome">Your Reports</div>
        <div class="actions">
          <button class="btn" onclick="location.href='/upload.html'">➕ Upload New</button>
        </div>
      </div>

      <!-- Quick stats -->
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Total reports</div>
          <div style="font-size:24px;font-weight:800" id="totalReports">—</div>
        </div>
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Pending analysis</div>
          <div style="font-size:24px;font-weight:800;color:#e67e22" id="pendingCount">—</div>
        </div>
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Completed</div>
          <div style="font-size:24px;font-weight:800;color:#16a085" id="doneCount">—</div>
        </div>
      </div>

      <!-- Grid of report cards -->
      <div style="margin-top:6px">
        <div class="grid" id="reportsGrid">

          <!-- Skeleton placeholders -->
          <div class="card">
            <div class="skeleton thumb"></div>
            <div style="height:8px"></div>
            <div class="skeleton" style="width:70%"></div>
            <div style="height:6px"></div>
            <div class="skeleton" style="width:40%"></div>
          </div>
          <div class="card">
            <div class="skeleton thumb"></div>
            <div style="height:8px"></div>
            <div class="skeleton" style="width:60%"></div>
            <div style="height:6px"></div>
            <div class="skeleton" style="width:50%"></div>
          </div>
          <div class="card">
            <div class="skeleton thumb"></div>
            <div style="height:8px"></div>
            <div class="skeleton" style="width:65%"></div>
            <div style="height:6px"></div>
            <div class="skeleton" style="width:30%"></div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- MODAL (hidden) -->
  <div id="modalRoot" style="display:none"></div>

  <script type="module">
    // Auth
    const userEmail = localStorage.getItem("user_email");
    if (!userEmail) {
      window.location.href = "/login.html";
    }
    document.getElementById("userEmail").innerText = userEmail;

    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("user_email");
      window.location.href = "/login.html";
    };

    // Store reports globally so AI modal can access full object
    let REPORT_CACHE = [];

    // Fetch reports from backend
    async function fetchReports() {
      try {
        const res = await fetch(
          `/api/get-reports?email=${encodeURIComponent(userEmail)}`
        );
        if (!res.ok) {
          console.error("Fetch reports failed:", await res.text());
          return [];
        }
        const json = await res.json();
        return Array.isArray(json) ? json : [];
      } catch (e) {
        console.error("Failed fetching reports", e);
        return [];
      }
    }

    // Escape helper
    function escapeHtml(s) {
      return (s + "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[m]));
    }

    // Render cards
    function renderReports(list) {
      REPORT_CACHE = list;
      const grid = document.getElementById("reportsGrid");
      grid.innerHTML = "";

      if (!list.length) {
        grid.innerHTML =
          '<div class="card"><div class="title">No reports yet</div><div class="date">Upload a report to get started</div></div>';
        document.getElementById("totalReports").innerText = "0";
        document.getElementById("pendingCount").innerText = "0";
        document.getElementById("doneCount").innerText = "0";
        return;
      }

      let pending = 0;
      let done = 0;

      list.forEach((r, idx) => {
        const status = (r.status || "processing").toLowerCase();
        if (status === "processing") pending++;
        if (status === "completed") done++;

        const created = new Date(r.created_at || Date.now()).toLocaleString();
        const file = r.file_path || "unknown";
        const ai = r.ai_results || null;

        let statusClass = "status-processing";
        let statusLabel = "Processing";
        if (status === "completed") {
          statusClass = "status-completed";
          statusLabel = "Completed";
        } else if (status === "failed") {
          statusClass = "status-failed";
          statusLabel = "Failed";
        }

        const aiButtonDisabled = !ai || status !== "completed";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="meta">
            <div>
              <div class="title">${escapeHtml(r.title || "Untitled Report")}</div>
              <div class="date">${created}</div>
            </div>
            <div style="text-align:right">
              <span class="status-pill ${statusClass}">${statusLabel}</span>
            </div>
          </div>

          <div class="file">${escapeHtml(file)}</div>

          <div style="display:flex;gap:8px;margin-top:auto;justify-content:flex-end;flex-wrap:wrap">
            <button class="btn" onclick="viewReport('${encodeURIComponent(file)}')">View PDF</button>
            <button class="btn ghost" onclick="downloadReport('${encodeURIComponent(file)}')">Download</button>
            <button
              class="btn ghost"
              data-index="${idx}"
              ${aiButtonDisabled ? "disabled" : ""}
              onclick="openAiModal(event)"
            >
              ${aiButtonDisabled ? "AI Processing…" : "AI Summary"}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById("totalReports").innerText = list.length;
      document.getElementById("pendingCount").innerText = pending;
      document.getElementById("doneCount").innerText = done;
    }

    // PDF modal
    window.viewReport = function (pathEnc) {
      const path = decodeURIComponent(pathEnc);
      const modal = document.getElementById("modalRoot");
      modal.style.display = "block";
      modal.innerHTML = `
        <div class="modal-backdrop" onclick="closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:700;max-width:70%;word-break:break-all;">
                ${escapeHtml(path)}
              </div>
              <div style="display:flex;gap:8px;">
                <button onclick="window.print()" class="btn ghost">Print / Save PDF</button>
                <button onclick="closeModal()" class="btn ghost">Close</button>
              </div>
            </div>
            <div style="height:12px"></div>
            <div style="width:100%;height:80vh;border-radius:8px;overflow:hidden;">
              <iframe
                src="https://tbyttsfztuudyqbrkonm.supabase.co/storage/v1/object/public/reports/${encodeURIComponent(
                  path
                )}"
                style="width:100%;height:100%;border:0;"
              ></iframe>
            </div>
          </div>
        </div>
      `;
    };

    window.downloadReport = function (pathEnc) {
      const path = decodeURIComponent(pathEnc);
      const url = `https://tbyttsfztuudyqbrkonm.supabase.co/storage/v1/object/public/reports/${encodeURIComponent(
        path
      )}`;
      window.open(url, "_blank");
    };

    // AI modal
    window.openAiModal = function (event) {
      const idx = event.currentTarget.getAttribute("data-index");
      const r = REPORT_CACHE[Number(idx)];
      if (!r || !r.ai_results) {
        alert("AI results not available yet.");
        return;
      }

      const ai = r.ai_results;
      const summary = ai.summary || "No summary available.";
      const flags = Array.isArray(ai.flags) ? ai.flags : [];
      const recs = Array.isArray(ai.recommendations) ? ai.recommendations : [];
      const markers = ai.markers || {};

      let flagsHtml = "";
      if (flags.length) {
        flagsHtml =
          flags.map((f) => `<span class="ai-chip">${escapeHtml(f)}</span>`).join("");
      } else {
        flagsHtml = "<div style='font-size:13px;color:var(--muted)'>No critical flags.</div>";
      }

      let recsHtml = "";
      if (recs.length) {
        recsHtml =
          "<ul style='padding-left:18px;margin:0;'>" +
          recs.map((r) => `<li>${escapeHtml(r)}</li>`).join("") +
          "</ul>";
      } else {
        recsHtml = "<div style='font-size:13px;color:var(--muted)'>No specific recommendations.</div>";
      }

      // markers table
      let markerRows = "";
      Object.keys(markers).forEach((name) => {
        const m = markers[name] || {};
        const val = m.value ?? "";
        const interp = m.interpretation || "";
        const sev = (m.severity || "info").toLowerCase();
        markerRows += `
          <tr>
            <td>${escapeHtml(name)}</td>
            <td>${escapeHtml(String(val))}</td>
            <td>${escapeHtml(interp)}</td>
            <td>${escapeHtml(sev)}</td>
          </tr>
        `;
      });

      if (!markerRows) {
        markerRows = `
          <tr>
            <td colspan="4" style="font-size:13px;color:var(--muted);padding:6px;">
              No markers returned from AI.
            </td>
          </tr>
        `;
      }

      const modal = document.getElementById("modalRoot");
      modal.style.display = "block";
      modal.innerHTML = `
        <div class="modal-backdrop" onclick="closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-weight:700">${escapeHtml(r.title || "AI Report")}</div>
                <div style="font-size:12px;color:var(--muted);">
                  ${escapeHtml(ai.generated_at || "")}
                </div>
              </div>
              <div style="display:flex;gap:8px;">
                <button onclick="window.print()" class="btn ghost">Print / Save PDF</button>
                <button onclick="closeModal()" class="btn ghost">Close</button>
              </div>
            </div>

            <div style="height:12px"></div>
            <div class="modal-content-scroll">
              <div class="ai-section-title">AI Summary</div>
              <div style="font-size:14px;margin-bottom:8px;">
                ${escapeHtml(summary)}
              </div>

              <div class="ai-section-title">Red Flags</div>
              <div>${flagsHtml}</div>

              <div class="ai-section-title">Recommendations</div>
              <div>${recsHtml}</div>

              <div class="ai-section-title">Marker Details</div>
              <table class="ai-marker-table">
                <thead>
                  <tr>
                    <th>Marker</th>
                    <th>Value</th>
                    <th>Interpretation</th>
                    <th>Severity</th>
                  </tr>
                </thead>
                <tbody>
                  ${markerRows}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    };

    // Close modal
    window.closeModal = function () {
      const modal = document.getElementById("modalRoot");
      modal.style.display = "none";
      modal.innerHTML = "";
    };

    // Init
    (async () => {
      const reports = await fetchReports();
      renderReports(reports);
    })();
  </script>
</body>
</html>
