<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="brand">
        <img src="/logo.png" alt="AMI logo">
        <div>
          <h3>AMI Health</h3>
          <p>Smarter Diagnostics — Better Care</p>
        </div>
      </div>

      <nav class="nav" aria-label="Sidebar">
        <a href="/dashboard.html" class="active">Dashboard</a>
        <a href="/upload.html">Upload Report</a>
        <a href="#" id="btnDocs">AI Results</a>
        <a href="#" id="btnSettings">Settings</a>
      </nav>

      <div style="margin-top:auto">
        <div style="font-size:12px;opacity:0.9">Signed in as</div>
        <div id="userEmail" style="font-weight:700;margin-top:6px"></div>
        <div style="height:10px"></div>
        <button id="logout" class="btn" style="width:100%">Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" role="main">
      <div class="topbar">
        <div class="welcome">Your Reports</div>
        <div class="actions">
          <button class="btn" onclick="location.href='/upload.html'">➕ Upload New</button>
        </div>
      </div>

      <!-- Quick stats -->
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Total reports</div>
          <div style="font-size:24px;font-weight:800" id="totalReports">—</div>
        </div>
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Pending analysis</div>
          <div style="font-size:24px;font-weight:800;color:#e67e22" id="pendingCount">—</div>
        </div>
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Completed</div>
          <div style="font-size:24px;font-weight:800;color:#16a085" id="doneCount">—</div>
        </div>
      </div>

      <!-- Grid of report cards -->
      <div style="margin-top:6px">
        <div class="grid" id="reportsGrid">
          <!-- skeletons while loading -->
          <div class="card">
            <div class="skeleton thumb"></div>
            <div style="height:8px"></div>
            <div class="skeleton" style="width:70%"></div>
            <div style="height:6px"></div>
            <div class="skeleton" style="width:40%"></div>
          </div>
          <div class="card">
            <div class="skeleton thumb"></div>
            <div style="height:8px"></div>
            <div class="skeleton" style="width:60%"></div>
            <div style="height:6px"></div>
            <div class="skeleton" style="width:50%"></div>
          </div>
          <div class="card">
            <div class="skeleton thumb"></div>
            <div style="height:8px"></div>
            <div class="skeleton" style="width:65%"></div>
            <div style="height:6px"></div>
            <div class="skeleton" style="width:30%"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL -->
  <div id="modalRoot" style="display:none"></div>

  <script type="module">
    // ---------- Supabase client (anon) for signed URLs ----------
    const SUPA_URL  = "https://tbyttsfztuudyqbrkonm.supabase.co";
    const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRieXR0c2Z6dHV1ZHlxYnJrb25tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0MzA1MzgsImV4cCI6MjA3OTAwNjUzOH0.7T0S4_kkoWosdbmjlwtfSYzBcyipcPg1Fm8kIMa43uo";

    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    const supabase = createClient(SUPA_URL, SUPA_ANON);

    // ---------- auth guard ----------
    const userEmail = localStorage.getItem("user_email");
    if (!userEmail) {
      window.location.href = "/login.html";
    }
    document.getElementById("userEmail").innerText = userEmail;

    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("user_email");
      window.location.href = "/login.html";
    };

    // ---------- helpers ----------
    function escapeHtml(s) {
      return (s + "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[c]));
    }

    async function fetchReports() {
      try {
        const res = await fetch(`/api/get-reports?email=${encodeURIComponent(userEmail)}`);
        if (!res.ok) {
          console.error("get-reports failed:", await res.text());
          return [];
        }
        return await res.json();
      } catch (e) {
        console.error("get-reports error:", e);
        return [];
      }
    }

    async function makeSignedUrl(path) {
      const { data, error } = await supabase
        .storage
        .from("reports")
        .createSignedUrl(path, 60 * 30); // 30 minutes
      if (error || !data?.signedUrl) {
        console.error("signed URL error:", error);
        alert("Could not open file from storage.");
        return null;
      }
      return data.signedUrl;
    }

    // ---------- render ----------
    function renderReports(reports) {
      const grid = document.getElementById("reportsGrid");
      grid.innerHTML = "";

      if (!reports || !reports.length) {
        grid.innerHTML = `
          <div class="card">
            <div class="title">No reports yet</div>
            <div class="date">Upload a report to get started</div>
          </div>`;
        document.getElementById("totalReports").innerText = "0";
        document.getElementById("pendingCount").innerText = "0";
        document.getElementById("doneCount").innerText = "0";
        return;
      }

      let pending = 0;
      let done = 0;

      reports.forEach((r) => {
        const status = r.ai_status || "pending";
        if (status === "processing" || status === "pending") pending++;
        if (status === "completed") done++;

        const created = new Date(r.created_at || Date.now()).toLocaleString();
        const filePath = r.file_path || "unknown";
        const hasAI   = !!r.ai_result && !r.ai_result.error;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="meta">
            <div>
              <div class="title">${escapeHtml(r.title || "Untitled Report")}</div>
              <div class="date">${created}</div>
            </div>
            <div style="text-align:right">
              <div class="status ${status}">${escapeHtml(status)}</div>
            </div>
          </div>

          <div class="file">${escapeHtml(filePath)}</div>

          <div style="display:flex;gap:8px;margin-top:auto;justify-content:flex-end">
            <button class="btn" data-path="${encodeURIComponent(filePath)}" data-id="${r.id}" data-has-ai="${hasAI ? "1" : "0"}">View</button>
            <button class="btn ghost" data-download="${encodeURIComponent(filePath)}">Download</button>
            <button class="btn ghost" data-ai="${r.id}" ${hasAI ? "" : "disabled"}>Print AI report</button>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById("totalReports").innerText  = reports.length;
      document.getElementById("pendingCount").innerText = pending;
      document.getElementById("doneCount").innerText    = done;

      // attach button handlers
      grid.querySelectorAll("button[data-path]").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const path = decodeURIComponent(e.currentTarget.getAttribute("data-path"));
          const url  = await makeSignedUrl(path);
          if (!url) return;
          openModal(url, path);
        });
      });

      grid.querySelectorAll("button[data-download]").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const path = decodeURIComponent(e.currentTarget.getAttribute("data-download"));
          const url  = await makeSignedUrl(path);
          if (!url) return;
          window.open(url, "_blank");
        });
      });

      grid.querySelectorAll("button[data-ai]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const hasAI = e.currentTarget.getAttribute("data-has-ai") === "1";
          const id    = e.currentTarget.getAttribute("data-ai");
          if (!hasAI) {
            alert("AI analysis not available yet for this report.");
            return;
          }
          // open printable AI report page
          window.open(`/ai-report.html?id=${encodeURIComponent(id)}`, "_blank");
        });
      });
    }

    // ---------- modal ----------
    function openModal(fileUrl, label) {
      const modalRoot = document.getElementById("modalRoot");
      modalRoot.style.display = "block";
      modalRoot.innerHTML = `
        <div class="modal-backdrop" onclick="window.closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:700">${escapeHtml(label)}</div>
              <button onclick="window.closeModal()" class="btn ghost">Close</button>
            </div>
            <div style="height:12px"></div>
            <div class="preview">
              <iframe src="${fileUrl}" style="width:100%;height:100%;border:0;border-radius:8px"></iframe>
            </div>
          </div>
        </div>
      `;
    }
    window.closeModal = function() {
      const modalRoot = document.getElementById("modalRoot");
      modalRoot.style.display = "none";
      modalRoot.innerHTML = "";
    };

    // ---------- init ----------
    (async function init() {
      const reports = await fetchReports();
      renderReports(reports);
    })();

  </script>
</body>
</html>
