<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img src="/logo.png" alt="AMI logo" />
      <div>
        <h3>AMI Health</h3>
        <p>Smarter Diagnostics — Better Care</p>
      </div>
    </div>

    <nav class="nav">
      <a href="/dashboard.html" class="active">Dashboard</a>
      <a href="/upload.html">Upload Report</a>
      <a href="#">AI Results</a>
    </nav>

    <div style="margin-top:auto">
      <div style="font-size:12px;opacity:0.6">Signed in as</div>
      <div id="userEmail" style="font-weight:700"></div>
      <button id="logout" class="btn" style="margin-top:10px;width:100%">Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="welcome">Your Reports</div>
      <button class="btn" onclick="location.href='/upload.html'">+ Upload New</button>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <div class="card"><div>Total reports</div><div id="totalReports" class="big">—</div></div>
      <div class="card"><div>Pending</div><div id="pendingCount" class="big orange">—</div></div>
      <div class="card"><div>Completed</div><div id="doneCount" class="big green">—</div></div>
    </div>

    <div id="reportsGrid" class="grid" style="margin-top:20px"></div>
  </main>

</div>

<script type="module">

const user = localStorage.getItem("user_email");
if (!user) window.location = "/login.html";

document.getElementById("userEmail").innerText = user;
document.getElementById("logout").onclick = () => {
  localStorage.removeItem("user_email");
  window.location = "/login.html";
};

async function fetchReports() {
  try {
    const res = await fetch(`/api/get-reports?email=${encodeURIComponent(user)}`);
    return res.ok ? await res.json() : [];
  } catch {
    return [];
  }
}

function escapeHtml(s) {
  return (s+"").replace(/[&<>"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m] || m));
}

function renderReports(reports) {
  const grid = document.getElementById("reportsGrid");
  grid.innerHTML = "";

  if (!reports.length) {
    grid.innerHTML = `<div class="card">No reports uploaded yet.</div>`;
    return;
  }

  let pending = 0;
  let done = 0;

  reports.forEach(r => {
    const status = r.ai_status || "pending";
    if (status === "processing" || status === "pending") pending++;
    if (status === "completed") done++;

    const aiSummary = r.ai_result?.summary ? 
      `<div class="ai-summary">${escapeHtml(r.ai_result.summary)}</div>` :
      `<div class="ai-summary muted">No AI summary yet</div>`;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="title">${escapeHtml(r.title)}</div>
      <div class="date">${new Date(r.created_at).toLocaleString()}</div>
      <div class="file">${escapeHtml(r.file_path)}</div>

      <div class="status-box ${status}">
        Status: ${status}
      </div>

      ${aiSummary}

      <div style="margin-top:10px;text-align:right">
        <button class="btn" onclick="window.open('https://tbyttsfztuudyqbrkonm.supabase.co/storage/v1/object/public/reports/${encodeURIComponent(r.file_path)}')">Download</button>
      </div>
    `;

    grid.appendChild(card);
  });

  document.getElementById("totalReports").innerText = reports.length;
  document.getElementById("pendingCount").innerText = pending;
  document.getElementById("doneCount").innerText = done;
}

(async () => {
  const reports = await fetchReports();
  renderReports(reports);
})();
</script>

</body>
</html>
