<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <img src="/logo.png" alt="AMI logo">
        <div>
          <h3>AMI Health</h3>
          <p>Smarter Diagnostics — Better Care</p>
        </div>
      </div>

      <nav class="nav">
        <a href="/dashboard.html" class="active">Dashboard</a>
        <a href="/upload.html">Upload Report</a>
        <a href="#" id="btnDocs">AI Results</a>
        <a href="#" id="btnSettings">Settings</a>
      </nav>

      <div style="margin-top:auto">
        <div style="font-size:12px;opacity:.9">Signed in as</div>
        <div id="userEmail" style="font-weight:700;margin-top:6px"></div>
        <div style="height:10px"></div>
        <button id="logout" class="btn" style="width:100%">Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="topbar">
        <div class="welcome">Your Reports</div>
        <div class="actions">
          <button class="btn" onclick="location.href='/upload.html'">➕ Upload New</button>
        </div>
      </div>

      <!-- Stats -->
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Total reports</div>
          <div style="font-size:24px;font-weight:800" id="totalReports">—</div>
        </div>
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Pending</div>
          <div style="font-size:24px;font-weight:800;color:#e67e22" id="pendingCount">—</div>
        </div>
        <div class="card" style="min-width:200px;flex:0 0 220px">
          <div style="font-size:13px;color:var(--muted)">Completed</div>
          <div style="font-size:24px;font-weight:800;color:#16a085" id="doneCount">—</div>
        </div>
      </div>

      <!-- Report Cards -->
      <div style="margin-top:6px">
        <div class="grid" id="reportsGrid"></div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modalRoot" style="display:none"></div>

  <!-- LOGIC -->
  <script type="module">

    /* -----------------------
       AUTH
    ------------------------ */
    const userEmail = localStorage.getItem("user_email");
    if (!userEmail) window.location.href = "/login.html";
    document.getElementById("userEmail").innerText = userEmail;

    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("user_email");
      window.location.href = "/login.html";
    };

    /* -----------------------
       FETCH REPORTS
    ------------------------ */
    async function fetchReports() {
      try {
        const res = await fetch(`/api/get-reports?email=${encodeURIComponent(userEmail)}`);
        if (!res.ok) {
          console.error("Error fetching reports:", await res.text());
          return [];
        }
        return await res.json();
      } catch (e) {
        console.error("Network error:", e);
        return [];
      }
    }

    /* -----------------------
       RENDER REPORT CARDS
    ------------------------ */
    function renderReports(list) {
      const grid = document.getElementById("reportsGrid");
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `<div class="card"><div class="title">No reports yet</div></div>`;
        document.getElementById("totalReports").innerText = "0";
        document.getElementById("pendingCount").innerText = "0";
        document.getElementById("doneCount").innerText = "0";
        return;
      }

      let pending = 0;
      let done = 0;

      list.forEach(r => {

        const status = r.status || r.ai_status || "processing";
        if (status === "processing") pending++;
        if (status === "completed") done++;

        const aiSummary =
          r.ai_result && r.ai_result.summary
            ? escapeHtml(r.ai_result.summary)
            : `<span style="opacity:.6">No AI summary yet</span>`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="meta">
            <div>
              <div class="title">${escapeHtml(r.title)}</div>
              <div class="date">${new Date(r.created_at).toLocaleString()}</div>
            </div>
            <div style="text-align:right">
              <div class="status ${status}">${status}</div>
            </div>
          </div>

          <div class="ai-box">
            <strong>AI Summary:</strong>
            <div class="ai-summary">${aiSummary}</div>
          </div>

          <div class="file">${escapeHtml(r.file_path)}</div>

          <div style="display:flex;gap:8px;margin-top:auto;justify-content:flex-end">
            <button class="btn" onclick="viewReport('${encodeURIComponent(r.file_path)}')">View</button>
            <button class="btn ghost" onclick="downloadReport('${encodeURIComponent(r.file_path)}')">Download</button>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById("totalReports").innerText = list.length;
      document.getElementById("pendingCount").innerText = pending;
      document.getElementById("doneCount").innerText = done;
    }

    /* -----------------------
       SAFE HTML
    ------------------------ */
    function escapeHtml(s) {
      return (s+"").replace(/[&<>"']/g, m =>
        ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])
      );
    }

    /* -----------------------
       VIEW MODAL
    ------------------------ */
    window.viewReport = function(pathEnc) {
      const path = decodeURIComponent(pathEnc);
      const modal = document.getElementById("modalRoot");

      modal.style.display = "block";
      modal.innerHTML = `
        <div class="modal-backdrop" onclick="closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:700">${escapeHtml(path)}</div>
              <button onclick="closeModal()" class="btn ghost">Close</button>
            </div>
            <div style="height:12px"></div>
            <iframe 
              src="https://tbyttsfztuudyqbrkonm.supabase.co/storage/v1/object/public/reports/${path}" 
              style="width:100%;height:90vh;border:0;border-radius:8px">
            </iframe>
          </div>
        </div>
      `;
    };

    window.closeModal = function() {
      const m = document.getElementById("modalRoot");
      m.style.display = "none";
      m.innerHTML = "";
    };

    /* -----------------------
       DOWNLOAD
    ------------------------ */
    window.downloadReport = function(pathEnc) {
      const url = "https://tbyttsfztuudyqbrkonm.supabase.co/storage/v1/object/public/reports/" 
                  + decodeURIComponent(pathEnc);
      window.open(url, "_blank");
    };

    /* -----------------------
       INIT
    ------------------------ */
    (async () => {
      const reports = await fetchReports();
      renderReports(reports);
    })();
  </script>

</body>
</html>
