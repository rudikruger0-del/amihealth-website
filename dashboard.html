<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
<header class="topbar">
  <div class="brand">
    <span class="logo-text">AMI Health</span>
    <span class="tagline">Smarter Diagnostics — Better Care</span>
  </div>
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/upload.html">Upload Report</a>
  </nav>
</header>

<main class="page">
  <section class="panel">
    <p id="userEmail"></p>
    <button id="logoutBtn">Logout</button>
  </section>

  <section class="panel">
    <h1>Your Reports</h1>
    <p>Reports are loaded from a private Supabase bucket using short-lived signed URLs.</p>

    <table class="table" id="reportsTable">
      <thead>
      <tr>
        <th>Created</th>
        <th>Title</th>
        <th>File</th>
        <th>AI Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="reportsBody"></tbody>
    </table>
  </section>
</main>

<script type="module">
  const email = localStorage.getItem("ami_user_email");

  const userEmailEl = document.getElementById("userEmail");
  const tbody = document.getElementById("reportsBody");

  if (!email) {
    userEmailEl.innerHTML = "Not signed in.<br />Please log in again.";
    tbody.innerHTML = '<tr><td colspan="5">No email, please log in.</td></tr>';
  } else {
    userEmailEl.textContent = `Signed in as ${email}`;
  }

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("ami_user_email");
    window.location.href = "/index.html";
  };

  async function fetchReports() {
    if (!email) return;

    tbody.innerHTML = '<tr><td colspan="5">Loading…</td></tr>';

    const resp = await fetch(`/api/get-reports?email=${encodeURIComponent(email)}`);
    const json = await resp.json();

    if (!resp.ok) {
      tbody.innerHTML = '<tr><td colspan="5">Failed to load reports.</td></tr>';
      return;
    }

    if (!json.reports || json.reports.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5">No reports uploaded yet.</td></tr>';
      return;
    }

    tbody.innerHTML = "";
    json.reports.forEach(r => {
      const tr = document.createElement("tr");

      const status = r.ai_status;

      tr.innerHTML = `
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.title || "Untitled"}</td>
        <td>${r.file_path}</td>
        <td>${status}</td>
        <td>
          <button onclick="openFile('${r.file_path}')">View</button>
          <button onclick="downloadFile('${r.file_path}')">Download</button>
          <button ${status !== "completed" ? "disabled" : ""} onclick='showAi(${JSON.stringify(r.ai_results)})'>AI</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function openFile(path) {
    const resp = await fetch("/api/get-file-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file_path: path })
    });
    const json = await resp.json();
    window.open(json.url, "_blank");
  }

  async function downloadFile(path) {
    const resp = await fetch("/api/get-file-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file_path: path })
    });
    const json = await resp.json();
    window.location.href = json.url;
  }

  function showAi(json) {
    const w = window.open("", "_blank");
    w.document.write("<pre>" + JSON.stringify(json, null, 2) + "</pre>");
  }

  fetchReports();
</script>
</body>
</html>
