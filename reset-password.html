<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – AMI Health</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 40%),
                  rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      box-shadow: 0 18px 70px rgba(0,0,0,0.65);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 18px;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: rgba(0,224,184,0.7);
      box-shadow: 0 0 0 1px rgba(0,224,184,0.4);
      background: #06091c;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 40px rgba(0,179,255,0.5);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .status.ok { color: #7ef7d3; }
    .status.err { color: #ff8f9b; }
    .status.info { color: #98a0b3; }

    a.back {
      margin-top: 20px;
      display: inline-block;
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
    }

  </style>
</head>

<body>

  <div class="card">
    <h1>Reset Password</h1>
    <p>Create a new password for your AMI Health account.</p>

    <label>New Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <label>Confirm Password</label>
    <input type="password" id="password2" placeholder="••••••••" />

    <button id="resetBtn">Update Password</button>

    <div class="status" id="status"></div>

    <a href="/login.html" class="back">← Back to Login</a>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const statusEl = document.getElementById("status");
    function setStatus(msg, type="info") {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    // Extract token from URL
    const url = new URL(window.location.href);
    const token = url.searchParams.get("access_token");

    if (!token) {
      setStatus("Invalid or missing reset token.", "err");
      document.getElementById("resetBtn").disabled = true;
    }

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const pass1 = document.getElementById("password").value.trim();
      const pass2 = document.getElementById("password2").value.trim();

      if (!pass1 || !pass2) {
        setStatus("Please fill in both password fields.", "err");
        return;
      }

      if (pass1 !== pass2) {
        setStatus("Passwords do not match.", "err");
        return;
      }

      setStatus("Updating password…", "info");

      const { data, error } = await supabase.auth.updateUser({
        password: pass1
      });

      if (error) {
        console.error(error);
        setStatus("Error: " + error.message, "err");
        return;
      }

      setStatus("Password updated! Redirecting…", "ok");

      setTimeout(() => {
        window.location.href = "/login.html";
      }, 1200);
    });

  </script>

</body>
</html>
