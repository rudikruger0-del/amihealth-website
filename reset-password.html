<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – AMI Health</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 40%),
                  rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }

    h1 { margin: 10px 0 4px; font-size: 24px; font-weight: 800; }
    p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    label { display: block; text-align: left; margin-top: 18px; margin-bottom: 4px; color: var(--muted); font-size: 13px; }

    input {
      width: 100%; padding: 12px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff; font-size: 15px;
    }

    button {
      width: 100%; margin-top: 26px; padding: 14px;
      border-radius: 999px; border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319; font-size: 16px; font-weight: 700;
      cursor: pointer;
    }

    .
