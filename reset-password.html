<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – AMI Health</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230, #020214);
      color: #e6eef8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: rgba(6, 10, 30, 0.96);
      padding: 40px 36px;
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 18px 70px rgba(0,0,0,0.5);
    }

    h1 { font-size: 24px; margin-bottom: 6px; }
    p { color: var(--muted); margin-bottom: 20px; }

    label {
      text-align: left;
      display: block;
      font-size: 13px;
      margin: 14px 0 4px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #090d20;
      color: #fff;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
    }

    .ok { color: #78ffcd; }
    .err { color: #ff8f9b; }
    .info { color: #98a0b3; }

    a.back { display: block; margin-top: 18px; color: var(--accent); text-decoration: none; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p>Choose a new password for your AMI Health account.</p>

    <label>New Password</label>
    <input type="password" id="password" />

    <label>Confirm Password</label>
    <input type="password" id="password2" />

    <button id="resetBtn">Update Password</button>

    <div id="status" class="status"></div>

    <a href="/login.html" class="back">← Back to Login</a>
  </div>

<script type="module">
  function setStatus(msg, cls="info") {
    const st = document.getElementById("status");
    st.textContent = msg;
    st.className = "status " + cls;
  }

  // Extract Supabase recovery token from URL hash
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);

  const access_token = params.get("access_token");
  const type = params.get("type");

  if (!access_token || type !== "recovery") {
    setStatus("Invalid or expired reset link.", "err");
    document.getElementById("resetBtn").disabled = true;
  } else {
    // Get UID from backend safely
    fetch(`/api/get-uid-from-token?token=${access_token}`)
      .then(r => r.json())
      .then(data => {
        if (!data.ok) {
          setStatus("Invalid or expired link.", "err");
          document.getElementById("resetBtn").disabled = true;
        } else {
          window._RESET_UID = data.uid;
        }
      });
  }

  document.getElementById("resetBtn").addEventListener("click", async () => {
    const p1 = document.getElementById("password").value.trim();
    const p2 = document.getElementById("password2").value.trim();

    if (!p1 || !p2) return setStatus("Please fill both fields.", "err");
    if (p1 !== p2) return setStatus("Passwords do not match.", "err");

    setStatus("Updating password…", "info");

    const res = await fetch("/api/admin-reset-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        uid: window._RESET_UID,
        new_password: p1
      })
    });

    const json = await res.json();

    if (!json.ok) return setStatus(json.error, "err");

    setStatus("Password updated! Redirecting…", "ok");

    setTimeout(() => {
      window.location.href = "/login.html";
    }, 1200);
  });
</script>

</body>
</html>
