<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Upload Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:Inter,system-ui,sans-serif;
      background:radial-gradient(circle at top,#071a33,#02030f);
      color:#eaf6ff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    header{
      width:100%;
      max-width:900px;
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand{
      display:flex;
      gap:10px;
      text-decoration:none;
      color:inherit;
    }
    .brand img{height:32px;}
    .brand-title{font-weight:800;font-size:18px;}
    .brand-sub{font-size:11px;color:var(--muted);}
    .nav-btn{
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.16);
      padding:6px 12px;
      font-size:13px;
      color:#eaf6ff;
      background:transparent;
      text-decoration:none;
      margin-left:8px;
      cursor:pointer;
    }
    main{
      flex:1;
      width:100%;
      max-width:900px;
      padding:0 20px 40px;
    }
    .card{
      background:rgba(11,16,32,0.96);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 18px 50px rgba(0,0,0,0.6);
      padding:24px 24px 28px;
      max-width:900px;
      margin:0 auto;
    }
    h1{margin:0 0 4px;font-size:22px;}
    .muted{margin:0 0 16px;font-size:14px;color:var(--muted);}
    form{
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    input,select{
      width:100%;
      margin-top:4px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.14);
      background:#050a18;
      color:#eaf6ff;
      font-size:14px;
    }
    input[type="file"]{padding:8px;}
    .row{
      display:flex;
      gap:12px;
    }
    .row > div { flex:1; }
    .btn-primary{
      margin-top:10px;
      width:100%;
      padding:12px 16px;
      border-radius:999px;
      border:none;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 0 18px rgba(0,255,220,0.25);
    }
    .status{
      margin-top:10px;
      min-height:18px;
      font-size:13px;
      color:var(--muted);
      white-space:pre-wrap;
    }
    .status.ok{color:#7dffc5;}
    .status.err{color:#ffb3b3;}
  </style>
</head>
<body>

<header>
  <a class="brand" href="/dashboard.html">
    <img src="/logo.png" />
    <div>
      <div class="brand-title">AMI Health</div>
      <div class="brand-sub">Artificial Medical Intelligence</div>
    </div>
  </a>
  <div>
    <a class="nav-btn" href="/dashboard.html">Back to Dashboard</a>
    <button class="nav-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <div class="card">
    <h1>Upload Report</h1>
    <p class="muted">
      Upload a PDF or image report. AMI will extract CBC values and run AI interpretation.
    </p>
    <div id="signedInText" class="muted"></div>

    <form id="uploadForm" autocomplete="off" enctype="multipart/form-data">

      <label>File
        <input id="fileInput" name="file" type="file" accept=".pdf,image/*" required>
      </label>

      <label>Title
        <input name="title" type="text" placeholder="CBC result" />
      </label>

      <label>Patient Name
        <input name="name" type="text" placeholder="John Doe" />
      </label>

      <div class="row">
        <div>
          <label>Age
            <input name="age" type="number" min="0" max="120">
          </label>
        </div>
        <div>
          <label>Sex
            <select name="sex">
              <option value="Unknown">Unknown</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </label>
        </div>
      </div>

      <button id="submitBtn" class="btn-primary">Upload & Queue AI</button>
      <div id="statusText" class="status"></div>
    </form>
  </div>
</main>

<script type="module">
import { supabase } from "./lib/supabaseClient.js";

const fileInput = document.getElementById("fileInput");
const uploadForm = document.getElementById("uploadForm");
const statusText = document.getElementById("statusText");
const submitBtn = document.getElementById("submitBtn");
const signedInText = document.getElementById("signedInText");
const logoutBtn = document.getElementById("logoutBtn");

let currentEmail = null;

async function loadUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = "/login.html";
  currentEmail = session.user.email;
  signedInText.textContent = "Signed in as: " + currentEmail;
}
loadUser();

logoutBtn.onclick = async () => {
  await supabase.auth.signOut();
  window.location.href = "/login.html";
};

uploadForm.onsubmit = async (e) => {
  e.preventDefault();
  statusText.textContent = "";

  if (!fileInput.files.length) {
    statusText.textContent = "Please select a file.";
    statusText.className = "status err";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Uploading…";

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  formData.append("email", currentEmail);
  formData.append("title", uploadForm.title.value);
  formData.append("name", uploadForm.name.value);
  formData.append("age", uploadForm.age.value);
  formData.append("sex", uploadForm.sex.value);

  try {
    const res = await fetch("/api/upload", { method: "POST", body: formData });
    const json = await res.json();

    if (!json.ok) {
      statusText.textContent = json.error || "Upload failed.";
      statusText.className = "status err";
    } else {
      statusText.textContent = "Uploaded ✓ AI is analysing the report.";
      statusText.className = "status ok";
      uploadForm.reset();
    }
  } catch (err) {
    statusText.textContent = "Unexpected error.";
    statusText.className = "status err";
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Upload & Queue AI";
};
</script>
</body>
</html>
