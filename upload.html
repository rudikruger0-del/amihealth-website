<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Upload Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:radial-gradient(circle at top,#071a33,#02030f);
      color:#eaf6ff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    header{
      width:100%;
      max-width:900px;
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:inherit;
    }
    .brand img{height:32px;}
    .brand-title{font-weight:800;font-size:18px;}
    .brand-sub{font-size:11px;color:var(--muted);}
    .nav-btn{
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.16);
      padding:6px 12px;
      font-size:13px;
      color:#eaf6ff;
      background:transparent;
      text-decoration:none;
      margin-left:8px;
      cursor:pointer;
    }

    main{
      flex:1;
      width:100%;
      max-width:900px;
      padding:0 20px 40px;
    }
    .card{
      background:rgba(11,16,32,0.96);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 18px 50px rgba(0,0,0,0.6);
      padding:24px 24px 28px;
      max-width:900px;
      margin:0 auto;
    }
    h1{margin:0 0 4px;font-size:22px;}
    .muted{margin:0 0 16px;font-size:14px;color:var(--muted);}
    form{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
    label{font-size:13px;color:#c5d0f5;}
    input,select{
      width:100%;
      margin-top:4px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.14);
      background:#050a18;
      color:#eaf6ff;
      font-size:14px;
    }
    input[type="file"]{
      padding:8px;
      background:#050a18;
    }
    .row{
      display:flex;
      gap:12px;
    }
    .row>div{flex:1;}
    .btn-primary{
      margin-top:10px;
      width:100%;
      padding:12px 16px;
      border-radius:999px;
      border:none;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 0 18px rgba(0,255,220,0.25);
    }
    .btn-primary[disabled]{
      opacity:0.6;
      cursor:default;
      box-shadow:none;
    }
    .status{
      margin-top:10px;
      min-height:20px;
      font-size:13px;
      color:var(--muted);
      white-space:pre-wrap;
    }
    .status.ok{color:#7dffc5;}
    .status.err{color:#ffb3b3;}
    .signed-in{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }
  </style>
</head>
<body>

<header>
  <a class="brand" href="/dashboard.html">
    <img src="/logo.png" alt="AMI logo">
    <div>
      <div class="brand-title">AMI Health</div>
      <div class="brand-sub">Artificial Medical Intelligence</div>
    </div>
  </a>
  <div>
    <a class="nav-btn" href="/dashboard.html">Back to Dashboard</a>
    <button class="nav-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <div class="card">
    <h1>Upload Report</h1>
    <p class="muted">
      Upload a PDF or image report. AMI will extract CBC values and run AI interpretation in the background.
    </p>
    <div class="signed-in" id="signedInText">Signed in as: …</div>

    <form id="uploadForm">
      <div>
        <label>
          File
          <input type="file" name="file" id="fileInput" accept=".pdf,image/*" required>
        </label>
      </div>

      <div>
        <label>
          Title
          <input type="text" name="title" placeholder="e.g. CBC — Z. Taljaard">
        </label>
      </div>

      <div>
        <label>
          Patient Name
          <input type="text" name="name" placeholder="Patient name (optional)">
        </label>
      </div>

      <div class="row">
        <div>
          <label>
            Age
            <input type="number" name="age" min="0" max="120" placeholder="e.g. 42">
          </label>
        </div>
        <div>
          <label>
            Sex
            <select name="sex">
              <option value="Unknown">Unknown</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </label>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Upload & Queue AI
      </button>

      <div class="status" id="statusText"></div>
    </form>
  </div>
</main>

<script type="module">
  import { supabase } from "./lib/supabaseClient.js";

  const uploadForm = document.getElementById("uploadForm");
  const statusText = document.getElementById("statusText");
  const submitBtn = document.getElementById("submitBtn");
  const fileInput = document.getElementById("fileInput");
  const signedInText = document.getElementById("signedInText");
  const logoutBtn = document.getElementById("logoutBtn");

  let currentEmail = null;

  async function loadUser() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "/login.html";
      return;
    }
    currentEmail = session.user.email;
    signedInText.textContent = "Signed in as: " + currentEmail;
  }

  loadUser();

  logoutBtn.addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "/login.html";
  });

  uploadForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusText.textContent = "";
    statusText.className = "status";

    if (!fileInput.files || fileInput.files.length === 0) {
      statusText.textContent = "Please select a file.";
      statusText.classList.add("err");
      return;
    }
    if (!currentEmail) {
      statusText.textContent = "No user session. Please log in again.";
      statusText.classList.add("err");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading…";

    try {
      const formData = new FormData(uploadForm);
      formData.append("email", currentEmail);

      const res = await fetch("/api/upload", {
        method: "POST",
        body: formData,
      });

      const json = await res.json();

      if (!res.ok || !json.ok) {
        console.error("Upload error:", json);
        statusText.textContent =
          json.error || "Upload failed. Please try again.";
        statusText.classList.add("err");
      } else {
        statusText.textContent =
          "Upload complete ✓\nAI is analysing this report in the background.\n" +
          "Open the Dashboard and refresh after a few seconds to see the AI result.";
        statusText.classList.add("ok");

        // Optional: small nudge to refresh dashboard list
        localStorage.setItem("reports_updated", "1");
        uploadForm.reset();
      }
    } catch (err) {
      console.error("UPLOAD JS ERROR:", err);
      statusText.textContent =
        "Unexpected error while uploading. Please try again.";
      statusText.classList.add("err");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload & Queue AI";
    }
  });
</script>

</body>
</html>
