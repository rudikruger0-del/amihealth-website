<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload Report — AMI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    body {
      margin:0;
      background:#020214;
      font-family:Inter,system-ui;
      color:white;
      padding:20px;
    }
    .card {
      max-width:650px;
      margin:auto;
      background:#0b1020cc;
      padding:30px;
      border-radius:12px;
    }
    input, select {
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#111829;
      color:white;
    }
    button {
      width:100%;
      padding:14px;
      margin-top:22px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,#00e0b8,#00b3ff);
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      color:#001319;
    }
    #status {
      margin-top:16px;
      color:#ff6b6b;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Upload Report</h2>

  <div>Signed in as: <span id="userEmail">...</span></div>

  <input type="file" id="fileInput">

  <input type="text" id="title" placeholder="Title (optional)">
  <input type="text" id="patientName" placeholder="Patient name (optional)">
  <input type="number" id="age" placeholder="Age">
  <select id="sex">
    <option>Unknown</option>
    <option>Male</option>
    <option>Female</option>
  </select>

  <button id="uploadBtn">Upload & Queue AI</button>
  <div id="status"></div>
</div>

<script type="module">
  import { supabase } from "./lib/supabaseClient.js";

  // Load logged-in user
  async function loadUser() {
    const { data } = await supabase.auth.getUser();
    if (!data.user) {
      document.getElementById("status").innerText = "❌ Not logged in.";
      return;
    }
    document.getElementById("userEmail").innerText = data.user.email;
  }
  loadUser();

  document.getElementById("uploadBtn").onclick = async () => {
    const file = document.getElementById("fileInput").files[0];
    if (!file) {
      alert("Select PDF or image");
      return;
    }

    const { data: user } = await supabase.auth.getUser();
    if (!user.user) {
      alert("Not logged in");
      return;
    }

    const fd = new FormData();
    fd.append("file", file);
    fd.append("email", user.user.email);
    fd.append("title", document.getElementById("title").value);
    fd.append("name", document.getElementById("patientName").value);
    fd.append("age", document.getElementById("age").value);
    fd.append("sex", document.getElementById("sex").value);

    const res = await fetch("/api/upload", {
      method: "POST",
      body: fd
    });

    const out = await res.json();
    if (!res.ok) {
      document.getElementById("status").innerText = JSON.stringify(out, null, 2);
      return;
    }

    document.getElementById("status").innerText = "✅ Uploaded!";
  };
</script>

</body>
</html>
