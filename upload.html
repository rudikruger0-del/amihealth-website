<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Report — AMI Health</title>

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
      --radius:12px;
    }

    body {
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto;
      background:linear-gradient(180deg,#020214 0%, #07102a 100%);
      color:#e6eef8;
      -webkit-font-smoothing:antialiased;
      padding:40px 16px;
    }

    .wrap {
      max-width:700px;
      margin:0 auto;
    }

    .card {
      background:rgba(255,255,255,0.03);
      padding:28px;
      border-radius:var(--radius);
      box-shadow:0 6px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin:0 0 18px;
      font-size:28px;
      color:#fff;
      font-weight:800;
      text-align:center;
    }

    label {
      display:block;
      margin-top:18px;
      font-size:14px;
      color:var(--muted);
      font-weight:600;
    }

    input, select {
      width:100%;
      margin-top:6px;
      padding:10px;
      border-radius:8px;
      border:none;
      background:#0f1529;
      color:#fff;
      font-size:15px;
    }

    input[type="file"] { padding:0; }

    button {
      margin-top:22px;
      width:100%;
      padding:14px;
      background:linear-gradient(90deg,var(--accent),#00b3ff);
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      color:#001319;
    }

    .user-bar {
      font-size:14px;
      color:var(--muted);
      margin-bottom:18px;
      text-align:center;
    }

    .user-bar a {
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
      margin-left:8px;
    }

    .status {
      margin-top:16px;
      font-size:14px;
      white-space:pre-wrap;
      line-height:1.5;
    }
  </style>
</head>
<body>

  <div class="wrap">

    <div class="user-bar">
      Signed in as: <strong id="userEmail"></strong>
      <a href="#" id="logoutBtn">Logout</a>
    </div>

    <div class="card">
      <h1>Upload Report</h1>

      <label>File</label>
      <input type="file" id="fileInput">

      <label>Title</label>
      <input type="text" id="reportTitle" placeholder="Optional">

      <label>Patient name</label>
      <input type="text" id="patientName" placeholder="Optional">

      <label>Age</label>
      <input type="number" id="ageInput" placeholder="Optional">

      <label>Sex</label>
      <select id="sexInput">
        <option value="Unknown">Unknown</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <button id="uploadBtn">Upload & Queue AI</button>

      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- SUPABASE CLIENT -->
  <script src="./lib/supabaseClient.js"></script>

  <!-- WORKING UPLOAD SCRIPT -->
  <script>
    // Load logged-in user
    const user = supabase.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.href = "/login";
        return;
      }
      const email = data.session.user.email;
      document.getElementById("userEmail").textContent = email;
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "/login";
    });

    // Upload Handler
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("status");

      if (!fileInput.files.length) {
        status.textContent = "Please select a file.";
        return;
      }

      status.textContent = "Uploading...";

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("email", document.getElementById("userEmail").textContent);
      formData.append("title", document.getElementById("reportTitle").value);
      formData.append("name", document.getElementById("patientName").value);
      formData.append("age", document.getElementById("ageInput").value);
      formData.append("sex", document.getElementById("sexInput").value);

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          status.textContent = "Server error:\n" + JSON.stringify(result, null, 2);
          return;
        }

        status.textContent = "Upload successful! Report ID: " + result.id;

      } catch (err) {
        status.textContent = "Upload failed: " + err.message;
      }
    });
  </script>

</body>
</html>
