<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Report — AMI Health</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #0a1234 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      padding: 28px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .topbar span strong {
      color: #ffffff;
    }

    .topbar button {
      background: transparent;
      border-radius: 999px;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.14);
      color: #e6eef8;
      font-size: 13px;
      cursor: pointer;
    }

    .topbar button:hover {
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.03);
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 45%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 45%),
                  rgba(6, 10, 30, 0.96);
      padding: 28px 26px 22px;
      border-radius: var(--radius);
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      max-width: 520px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px 0;
      font-size: 14px;
      color: #dce7ff;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 11px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(7, 11, 30, 0.96);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input:focus,
    select:focus {
      border-color: rgba(0,224,184,0.75);
      box-shadow: 0 0 0 1px rgba(0,224,184,0.5);
      background: #06091c;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    button#uploadBtn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #001319;
      box-shadow: 0 14px 40px rgba(0, 179, 255, 0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.12s ease;
    }

    button#uploadBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 18px 55px rgba(0, 179, 255, 0.5);
    }

    button#uploadBtn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 8px 24px rgba(0, 179, 255, 0.5);
      opacity: 0.96;
    }

    button#uploadBtn:disabled {
      opacity: 0.55;
      cursor: default;
      box-shadow: none;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.45;
      min-height: 20px;
    }

    .status.ok {
      color: #7ef7d3;
    }

    .status.err {
      color: #ff8f9b;
    }

    @media (max-width: 640px) {
      .card { padding: 22px 18px 20px; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="wrap">

    <div class="topbar">
      <span>Signed in as: <strong id="userEmail">Checking…</strong></span>
      <button id="logoutBtn" type="button">Logout</button>
    </div>

    <div class="card">
      <h1>Upload Report</h1>
      <div class="subtitle">
        Upload a PDF or image report. AMI will queue it, extract CBC values, and apply AI rules for interpretation.
      </div>

      <label for="fileInput">File</label>
      <input type="file" id="fileInput" accept=".pdf,image/*" />

      <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">
        PDF / image. Stored securely in the private <code>reports</code> bucket.
      </div>

      <label for="reportTitle">Title (optional)</label>
      <input type="text" id="reportTitle" placeholder="e.g. CBC — Z. Taljaard" />

      <label for="patientName">Patient name (optional)</label>
      <input type="text" id="patientName" placeholder="Optional" />

      <div class="row">
        <div>
          <label for="ageInput">Age (optional)</label>
          <input type="number" id="ageInput" placeholder="Years" min="0" max="130" />
        </div>
        <div>
          <label for="sexInput">Sex (optional)</label>
          <select id="sexInput">
            <option value="Unknown" selected>Unknown</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
        </div>
      </div>

      <button id="uploadBtn" type="button">Upload & Queue AI</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const userEmailEl = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");

    const fileInput = document.getElementById("fileInput");
    const titleInput = document.getElementById("reportTitle");
    const nameInput = document.getElementById("patientName");
    const ageInput = document.getElementById("ageInput");
    const sexInput = document.getElementById("sexInput");

    let currentEmail = null;

    function setStatus(msg, type = "info") {
      statusEl.textContent = msg || "";
      statusEl.classList.remove("ok", "err");
      if (type === "ok") statusEl.classList.add("ok");
      if (type === "err") statusEl.classList.add("err");
    }

    async function loadUser() {
      try {
        const { data, error } = await supabase.auth.getUser();

        if (error || !data?.user) {
          userEmailEl.textContent = "Not logged in";
          setStatus("Not logged in. Please log in again.", "err");
          uploadBtn.disabled = true;
          return;
        }

        currentEmail = data.user.email;
        userEmailEl.textContent = currentEmail || "Unknown";
        uploadBtn.disabled = false;
        setStatus("");
      } catch (err) {
        console.error("loadUser error:", err);
        userEmailEl.textContent = "Error";
        setStatus("Cannot read session. Please log in again.", "err");
        uploadBtn.disabled = true;
      }
    }

    async function doLogout() {
      try {
        await supabase.auth.signOut();
      } catch (err) {
        console.error("Logout error:", err);
      }
      window.location.href = "/login.html";
    }

    logoutBtn.addEventListener("click", doLogout);

    async function doUpload() {
      if (!currentEmail) {
        setStatus("You are not logged in. Please log in again.", "err");
        return;
      }

      const file = fileInput.files[0];
      if (!file) {
        setStatus("Please select a file to upload.", "err");
        return;
      }

      const form = new FormData();
      form.append("file", file);
      form.append("email", currentEmail);
      form.append("title", titleInput.value.trim());
      form.append("name", nameInput.value.trim());
      form.append("age", ageInput.value ? ageInput.value : "");
      form.append("sex", sexInput.value);

      uploadBtn.disabled = true;
      setStatus("Uploading to server and queuing AI…");

      try {
        const resp = await fetch("/api/upload", {
          method: "POST",
          body: form,
        });

        const text = await resp.text();
        let parsed;

        try {
          parsed = JSON.parse(text);
        } catch {
          parsed = null;
        }

        if (!resp.ok) {
          const msg = parsed?.error || text || `HTTP ${resp.status}`;
          setStatus("Server error: " + msg, "err");
          uploadBtn.disabled = false;
          return;
        }

        const reportId = parsed?.id || parsed?.reportId || "(unknown ID)";
        setStatus("✅ Upload complete. AI queued for report ID: " + reportId, "ok");

        // Optional: clear form
        fileInput.value = "";
        titleInput.value = "";
        nameInput.value = "";
        ageInput.value = "";
        sexInput.value = "Unknown";
      } catch (err) {
        console.error("Upload crash:", err);
        setStatus("Network error: " + String(err.message || err), "err");
        uploadBtn.disabled = false;
      }
    }

    uploadBtn.addEventListener("click", doUpload);

    // Initial load
    await loadUser();
  </script>
</body>
</html>
