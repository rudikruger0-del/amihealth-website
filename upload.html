<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Report — AMI Health</title>

  <style>
    body { font-family: Inter, sans-serif; background:#020314; color:white; padding:40px; }
    .card { max-width:600px; margin:auto; background:#0b1020; padding:30px; border-radius:12px; }
    label { display:block; margin-top:18px; opacity:.7; font-size:14px; }
    input, select { width:100%; padding:10px; margin-top:6px; border-radius:8px; border:none; background:#0f1529; color:white; }
    button { width:100%; margin-top:25px; padding:14px; border:none; border-radius:10px; background:#00e0b8; font-weight:700; }
    #status { margin-top:20px; white-space:pre-wrap; }
  </style>
</head>
<body>

<div class="card">
  <h1>Upload Report</h1>

  <label>File</label>
  <input type="file" id="fileInput">

  <label>Title</label>
  <input type="text" id="title">

  <label>Patient name</label>
  <input type="text" id="name">

  <label>Age</label>
  <input type="number" id="age">

  <label>Sex</label>
  <select id="sex">
    <option value="Unknown">Unknown</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>

  <button id="uploadBtn">Upload & Queue AI</button>

  <div id="status"></div>
</div>


<script src="./lib/supabaseClient.js"></script>

<script>
document.getElementById("uploadBtn").onclick = async () => {
  const status = document.getElementById("status");
  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    status.textContent = "No file selected.";
    return;
  }

  status.textContent = "Reading file...";

  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.split(",")[1];

    const payload = {
      email: localStorage.getItem("email"),
      title: document.getElementById("title").value || "Untitled",
      name: document.getElementById("name").value || null,
      age: document.getElementById("age").value || null,
      sex: document.getElementById("sex").value,
      fileName: file.name,
      fileContent: base64
    };

    status.textContent = "Uploading to server...";

    const resp = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const json = await resp.json();

    status.textContent = JSON.stringify(json, null, 2);
  };

  reader.readAsDataURL(file);
};
</script>

</body>
</html>
