<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Report — AMI Health</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <script src="lib/supabaseClient.js"></script>

    <div class="container">
      <div id="userStatus" class="user-status">Checking login...</div>

      <div class="card">
        <h2>Upload Report</h2>

        <form id="uploadForm">
          <label>File</label>
          <input type="file" id="fileInput" name="file" required />

          <label>Title (optional)</label>
          <input type="text" id="title" name="title" placeholder="e.g. CBC — Z. Taljaard" />

          <label>Patient name (optional)</label>
          <input type="text" id="name" name="name" placeholder="Optional" />

          <label>Age (optional)</label>
          <input type="number" id="age" name="age" placeholder="Years" />

          <label>Sex (optional)</label>
          <select id="sex" name="sex">
            <option value="unknown">Unknown</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>

          <button type="submit" id="uploadBtn">Upload & Queue AI</button>
        </form>

        <div id="statusMessage" class="status"></div>
      </div>
    </div>

    <script>
      // =====================================================
      // LOAD USER
      // =====================================================
      async function loadUser() {
        const { data } = await supabase.auth.getUser();
        const userStatus = document.getElementById("userStatus");

        if (!data.user) {
          userStatus.innerHTML =
            `<span class="error">❌ Not logged in.</span>`;
          return null;
        }

        userStatus.innerHTML = `Signed in as: <strong>${data.user.email}</strong> 
                                <a id="logoutBtn" href="#" style="margin-left:10px;">Logout</a>`;

        document.getElementById("logoutBtn").onclick = async () => {
          await supabase.auth.signOut();
          window.location.href = "/login.html";
        };

        return data.user;
      }

      let currentUser = null;

      loadUser().then(u => { currentUser = u; });

      // =====================================================
      // UPLOAD HANDLER
      // =====================================================
      document.getElementById("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const status = document.getElementById("statusMessage");

        if (!currentUser) {
          status.innerHTML = `<span class="error">❌ You must be logged in.</span>`;
          return;
        }

        const fileInput = document.getElementById("fileInput");
        if (!fileInput.files.length) {
          status.innerHTML = `<span class="error">Please select a file.</span>`;
          return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("email", currentUser.email);
        formData.append("title", document.getElementById("title").value || "");
        formData.append("name", document.getElementById("name").value || "");
        formData.append("age", document.getElementById("age").value || "");
        formData.append("sex", document.getElementById("sex").value || "");

        status.innerHTML = `Uploading...`;

        try {
          const response = await fetch("/api/upload", {
            method: "POST",
            body: formData,
          });

          const result = await response.json().catch(() => null);

          if (!response.ok) {
            status.innerHTML = `<span class="error">❌ Upload failed: ${result?.error || "Server error"}</span>`;
            return;
          }

          status.innerHTML = `<span class="success">✅ Upload complete. AI queued.</span>`;
        } catch (err) {
          status.innerHTML = `<span class="error">❌ Upload crashed: ${err}</span>`;
        }
      });
    </script>
  </body>
</html>
