<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Report — AMI Health</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui;
      background: #020214;
      color: white;
      padding: 30px;
    }
    .wrap { max-width: 650px; margin: auto; }
    .card {
      background: rgba(255,255,255,0.05);
      padding: 28px;
      border-radius: 12px;
      margin-top: 20px;
    }
    input, select {
      width: 100%; padding: 12px;
      margin-top: 8px; border-radius: 8px;
      background: #0f1529; border: none; color: white;
    }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border-radius: 10px; border: none;
      background: linear-gradient(90deg,#00e0b8,#00b3ff);
      color: black; font-weight: 700; font-size: 16px;
      cursor: pointer;
    }
    #status { margin-top: 14px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="wrap">

    <div style="text-align:center; margin-bottom:10px;">
      Signed in as: <strong id="userEmail"></strong>
      <a href="#" id="logoutBtn" style="color:#00e0b8; margin-left:6px;">Logout</a>
    </div>

    <div class="card">
      <h2 style="text-align:center;">Upload Report</h2>

      <label>File</label>
      <input type="file" id="fileInput" />

      <label>Title</label>
      <input type="text" id="title" placeholder="Optional" />

      <label>Patient name</label>
      <input type="text" id="pname" placeholder="Optional" />

      <label>Age</label>
      <input type="number" id="age" placeholder="Optional" />

      <label>Sex</label>
      <select id="sex">
        <option value="Unknown">Unknown</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <button id="uploadBtn">Upload & Queue AI</button>

      <pre id="status"></pre>
    </div>
  </div>

  <!-- 🔥 Load Supabase Client Correctly -->
  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const emailBox = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusBox = document.getElementById("status");

    // ✅ Load session
    const session = await supabase.auth.getSession();
    if (!session.data.session) {
      window.location.href = "/login.html";
    } else {
      emailBox.textContent = session.data.session.user.email;
    }

    // ✅ Logout works
    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      window.location.href = "/login.html";
    };

    // ✅ Upload handler
    uploadBtn.onclick = async () => {
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        statusBox.textContent = "❌ No file selected.";
        return;
      }

      statusBox.textContent = "Uploading...";

      const form = new FormData();
      form.append("file", file);
      form.append("title", document.getElementById("title").value || "");
      form.append("name", document.getElementById("pname").value || "");
      form.append("age", document.getElementById("age").value || "");
      form.append("sex", document.getElementById("sex").value || "");
      form.append("email", session.data.session.user.email);

      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          body: form
        });

        const json = await res.json();
        statusBox.textContent = JSON.stringify(json, null, 2);

      } catch (err) {
        statusBox.textContent = "❌ Upload crashed:\n" + err;
      }
    };
  </script>

</body>
</html>
