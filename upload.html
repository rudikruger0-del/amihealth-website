<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Report</title>
  <link rel="stylesheet" href="ami.css">
</head>

<body>

<script src="/lib/supabaseClient.js"></script>

<div id="container" style="max-width: 600px; margin: 40px auto; padding: 20px; color: white;">
  <h2>Upload Report</h2>
  <div id="userDisplay">Checking login...</div>

  <form id="uploadForm">
    <label>File</label><br/>
    <input type="file" id="fileInput" name="file" accept="application/pdf,image/*" required /><br/><br/>

    <label>Title (optional)</label>
    <input type="text" id="title" placeholder="e.g. CBC — Z. Taljaard" />

    <label>Patient name (optional)</label>
    <input type="text" id="patientName" placeholder="Optional" />

    <label>Age (optional)</label>
    <input type="number" id="age" placeholder="Years" />

    <label>Sex (optional)</label>
    <select id="sex">
      <option value="Unknown">Unknown</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <br/><br/>
    <button type="submit" style="width:100%; padding:15px; background:#00ddff; border-radius:8px; font-size:16px; border:none; cursor:pointer;">
      Upload & Queue AI
    </button>
  </form>

  <p id="status" style="margin-top:20px; color:#ff5a5a;"></p>
</div>


<script>
let currentUser = null;

// -------------------------
// LOAD USER SESSION
// -------------------------
async function loadUser() {
  await new Promise(resolve => setTimeout(resolve, 600)); // wait for supabase to load

  if (!window.supabase) {
    document.getElementById("userDisplay").innerText = "❌ Supabase failed to load.";
    return;
  }

  const { data: { user } } = await supabase.auth.getUser();

  if (!user) {
    document.getElementById("userDisplay").innerHTML = "Not logged in.";
    currentUser = null;
    return;
  }

  currentUser = user;
  document.getElementById("userDisplay").innerHTML = `
      Signed in as: ${user.email} 
      <a href="#" id="logoutBtn" style="color:#00ddff;">Logout</a>
  `;

  document.getElementById("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    location.reload();
  };
}

loadUser();


// -------------------------
// HANDLE UPLOAD
// -------------------------
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!currentUser) {
    document.getElementById("status").innerText = "❌ Not logged in.";
    return;
  }

  const file = document.getElementById("fileInput").files[0];
  if (!file) {
    document.getElementById("status").innerText = "❌ Please select a file.";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("email", currentUser.email);
  formData.append("title", document.getElementById("title").value);
  formData.append("name", document.getElementById("patientName").value);
  formData.append("age", document.getElementById("age").value);
  formData.append("sex", document.getElementById("sex").value);

  document.getElementById("status").innerText = "Uploading...";

  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      body: formData,
    });

    const data = await res.json().catch(() => null);

    if (!res.ok) {
      throw new Error(data?.error || "Server error");
    }

    document.getElementById("status").style.color = "#00ff8a";
    document.getElementById("status").innerText = "✅ Upload successful! AI queued.";

  } catch (err) {
    document.getElementById("status").style.color = "#ff5a5a";
    document.getElementById("status").innerText = "❌ Upload failed: " + err.message;
  }
});
</script>

</body>
</html>
