<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Upload Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#96a0b8;
      --accent:#00e0b8;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:radial-gradient(circle at top, #071a33, #02030f);
      color:#eaf6ff;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    header {
      padding:14px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      max-width:1100px;
      margin:0 auto;
      width:100%;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      color:inherit;
      text-decoration:none;
    }
    .brand img { height:34px; }
    .brand-title { font-size:18px; font-weight:800; }
    .brand-sub { color:var(--muted); font-size:11px; }

    nav { display:flex; gap:12px; }
    nav a {
      color:var(--muted);
      text-decoration:none;
      padding:6px 12px;
      border-radius:999px;
    }
    nav a.active { background:rgba(0,224,184,0.12); color:#fff; }
    nav a.login-pill {
      border:1px solid rgba(255,255,255,0.2);
    }

    main {
      flex:1;
      display:flex;
      justify-content:center;
      padding:20px;
    }

    .panel {
      background:var(--card);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      max-width:600px;
      width:100%;
      padding:26px;
      box-shadow:0 18px 50px rgba(0,0,0,0.5);
    }

    h1 { margin:0 0 16px; font-size:22px; }
    .muted { color:var(--muted); margin-bottom:20px; }

    input, select {
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.1);
      background:#0b152d;
      color:#fff;
      margin-bottom:16px;
      font-size:15px;
    }

    .btn {
      width:100%;
      padding:12px;
      border-radius:999px;
      border:none;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      font-weight:700;
      cursor:pointer;
      color:#001821;
      font-size:16px;
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="/dashboard.html">
    <img src="/logo.png" />
    <div>
      <div class="brand-title">AMI Health</div>
      <div class="brand-sub">Artificial Medical Intelligence</div>
    </div>
  </a>

  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/upload.html" class="active">Upload</a>
    <a href="#" id="logoutLink" class="login-pill">Logout</a>
  </nav>
</header>

<main>
  <div class="panel">
    <h1>Upload Lab Report</h1>
    <p class="muted">Upload a PDF CBC or blood report to generate an AI interpretation.</p>

    <label>Patient Name</label>
    <input type="text" id="patientName" placeholder="John Doe" />

    <label>Age</label>
    <input type="number" id="patientAge" placeholder="Age" />

    <label>Sex</label>
    <select id="patientSex">
      <option value="">Select sex</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label>PDF Report</label>
    <input type="file" id="pdfFile" accept="application/pdf" />

    <button class="btn" id="uploadBtn">Upload</button>

    <p id="statusText" style="margin-top:15px;color:var(--muted);font-size:14px;"></p>
  </div>
</main>

<script type="module">
import { supabase } from "./lib/supabaseClient.js";

/*************
 * AUTH GUARD
 *************/
async function requireAuth() {
  const { data: { session }, error } = await supabase.auth.getSession();

  if (error) {
    console.error("Auth error:", error);
    return window.location.href = "/login.html";
  }

  if (!session) {
    return window.location.href = "/login.html";
  }

  return session;
}

/********************
 * PAGE PROTECTION
 ********************/
const session = await requireAuth();
if (!session) return;


/***********
 * LOGOUT
 ***********/
document.getElementById("logoutLink").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.href = "/login.html";
});


/*******************
 * UPLOAD HANDLER
 *******************/
const uploadBtn = document.getElementById("uploadBtn");
const statusText = document.getElementById("statusText");

uploadBtn.onclick = async () => {
  const name = document.getElementById("patientName").value.trim();
  const age = document.getElementById("patientAge").value.trim();
  const sex = document.getElementById("patientSex").value.trim();
  const file = document.getElementById("pdfFile").files[0];

  if (!name || !age || !sex || !file) {
    statusText.style.color = "#ff8080";
    statusText.textContent = "All fields are required.";
    return;
  }

  statusText.style.color = "#96a0b8";
  statusText.textContent = "Uploading… Please wait.";

  const formData = new FormData();
  formData.append("name", name);
  formData.append("age", age);
  formData.append("sex", sex);
  formData.append("email", session.user.email);
  formData.append("file", file);

  const res = await fetch("/api/upload-report", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if (!data.ok) {
    statusText.style.color = "#ff8080";
    statusText.textContent = "Upload failed: " + data.error;
    return;
  }

  statusText.style.color = "#00e0b8";
  statusText.textContent = "Upload successful! Redirecting…";
  
  localStorage.setItem("reports_updated", "1");
  setTimeout(() => {
    window.location.href = "/dashboard.html";
  }, 800);
};
</script>

</body>
</html>
