<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Report — AMI Health</title>

  <style>
    body {
      background: #020314;
      color: #e6eef8;
      font-family: Inter, system-ui, sans-serif;
      padding: 40px 16px;
    }
    .wrap { max-width: 700px; margin: 0 auto; }
    .card {
      background: rgba(255,255,255,0.05);
      padding: 28px;
      border-radius: 12px;
    }
    h1 { text-align: center; font-size: 28px; margin-bottom: 20px; }
    label { margin-top: 18px; display: block; color:#98a0b3; }
    input, select {
      width: 100%; padding: 10px; border-radius: 8px;
      background: #0f1529; border: none; color: #fff;
      margin-top: 6px; font-size: 15px;
    }
    button {
      margin-top: 22px; width: 100%; padding: 14px;
      background: linear-gradient(90deg, #00e0b8, #00b3ff);
      border: none; border-radius: 10px;
      color: #001319; font-weight: 700; cursor: pointer;
    }
    #status { margin-top: 16px; white-space: pre-wrap; }
    .user-bar { text-align: center; margin-bottom: 20px; color:#98a0b3; }
    .user-bar a { color:#00e0b8; font-weight: 600; }
  </style>
</head>

<body>

<div class="wrap">

  <div class="user-bar">
    Signed in as: <strong id="userEmail"></strong>
    <a href="#" id="logoutBtn">Logout</a>
  </div>

  <div class="card">
    <h1>Upload Report</h1>

    <label>File</label>
    <input type="file" id="fileInput" />

    <label>Title</label>
    <input type="text" id="reportTitle" placeholder="Optional" />

    <label>Patient name</label>
    <input type="text" id="patientName" placeholder="Optional" />

    <label>Age</label>
    <input type="number" id="ageInput" placeholder="Optional" />

    <label>Sex</label>
    <select id="sexInput">
      <option value="Unknown">Unknown</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <button id="uploadBtn">Upload & Queue AI</button>
    <div id="status"></div>
  </div>

</div>

<!-- These MUST be modules -->
<script type="module" src="./lib/supabaseClient.js"></script>
<script type="module" src="./api/upload.js"></script>

</body>
</html>
