<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Report — AMI Health</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #040414;
      color: #e6eef8;
      font-family: Inter, system-ui, sans-serif;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: #0b1020;
      padding: 28px;
      border-radius: 14px;
    }

    input, select, button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #11182d;
      color: white;
      font-size: 15px;
    }

    button {
      background: linear-gradient(90deg, #00e0b8, #00b3ff);
      color: #001319;
      font-weight: bold;
      cursor: pointer;
    }

    label {
      margin-top: 14px;
      display: block;
      color: #9ba8c7;
      font-size: 14px;
    }

    .error {
      margin-top: 20px;
      color: #ff4b4b;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Upload Report</h2>

    <div style="margin-bottom: 10px;">
      Signed in as: <strong id="userEmail">…</strong>
      <a href="#" id="logout" style="margin-left:10px;color:#00e0b8;">Logout</a>
    </div>

    <label>File</label>
    <input type="file" id="fileInput" />

    <label>Title (optional)</label>
    <input type="text" id="titleInput" placeholder="e.g. CBC — Z. Taljaard" />

    <label>Patient name (optional)</label>
    <input type="text" id="patientInput" />

    <label>Age (optional)</label>
    <input type="number" id="ageInput" />

    <label>Sex (optional)</label>
    <select id="sexInput">
      <option value="Unknown">Unknown</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <button id="uploadBtn">Upload & Queue AI</button>

    <div id="errorBox" class="error"></div>
  </div>

  <script src="./lib/supabaseClient.js"></script>

  <script>
    // ------------------------------
    // 1️⃣ Load Supabase session
    // ------------------------------
    const userEmailBox = document.getElementById("userEmail");
    const errorBox = document.getElementById("errorBox");
    const logoutBtn = document.getElementById("logout");

    let session = null;

    async function loadUser() {
      const { data } = await supabase.auth.getSession();
      session = data.session;

      if (!session) {
        userEmailBox.textContent = "Not logged in";
        return;
      }

      userEmailBox.textContent = session.user.email;
    }

    loadUser();

    // logout
    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      location.href = "/login";
    };

    // ------------------------------
    // 2️⃣ Upload Handler
    // ------------------------------
    document.getElementById("uploadBtn").onclick = async () => {
      errorBox.textContent = "";

      if (!session) {
        errorBox.textContent = "❌ Not logged in.";
        return;
      }

      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        errorBox.textContent = "❌ Please select a file.";
        return;
      }

      const form = new FormData();
      form.append("file", file);
      form.append("email", session.user.email);
      form.append("title", document.getElementById("titleInput").value);
      form.append("name", document.getElementById("patientInput").value);
      form.append("age", document.getElementById("ageInput").value);
      form.append("sex", document.getElementById("sexInput").value);

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: form,
        });

        const text = await response.text();

        // check if valid JSON
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          errorBox.textContent =
            "❌ Server returned non-JSON:\n" + text.substring(0, 200);
          return;
        }

        if (!response.ok) {
          errorBox.textContent = "❌ Server error:\n" + JSON.stringify(json, null, 2);
          return;
        }

        // success
        errorBox.style.color = "#00e0b8";
        errorBox.textContent = "✅ Uploaded! Report ID: " + json.id;
      } catch (err) {
        errorBox.textContent = "❌ Error:\n" + err.message;
      }
    };
  </script>
</body>
</html>
