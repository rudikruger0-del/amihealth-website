<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Upload Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="logo-text">AMI Health</span>
      <span class="tagline">Upload reports</span>
    </div>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/upload.html">Upload Report</a>
    </nav>
  </header>

  <main class="page">
    <section class="panel">
      <p id="userEmail"></p>
      <button id="logoutBtn">Logout</button>
    </section>

    <section class="panel">
      <h1>Upload Scan or Lab Report</h1>

      <div class="form-row">
        <input type="file" id="fileInput" accept=".pdf,image/*" multiple />
      </div>

      <div class="form-row">
        <input type="text" id="titleInput" placeholder="Report title (optional)" />
      </div>

      <div class="form-row">
        <button id="uploadBtn">Upload & Queue</button>
      </div>

      <div id="statusArea"></div>
    </section>
  </main>

<script type="module">
import { supabase } from "/lib/supabaseClient.js";   // MUST LOAD

const email =
  localStorage.getItem("ami_email") ||
  localStorage.getItem("amihealth_email") ||
  "";

document.getElementById("userEmail").textContent =
  email ? email : "Not signed in";

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("ami_email");
  localStorage.removeItem("amihealth_email");
  window.location.href = "/index.html";
});

const statusArea = document.getElementById("statusArea");
function log(msg) {
  const p = document.createElement("p");
  p.textContent = msg;
  p.style.color = "#fff";
  p.style.background = "#333";
  p.style.padding = "6px";
  p.style.borderRadius = "6px";
  statusArea.appendChild(p);
}

document.getElementById("uploadBtn").addEventListener("click", async () => {
  statusArea.innerHTML = "";

  if (!email) return alert("No email, please sign in again.");

  const files = document.getElementById("fileInput").files;
  const title = document.getElementById("titleInput").value.trim();

  if (!files.length) return alert("Choose a file.");

  log("⏳ Uploading file(s)...");

  const uploadedPaths = [];

  try {
    for (const file of files) {
      const safeName = `${Date.now()}_${file.name.replace(/\s+/g, "_")}`;

      const { data, error } = await supabase.storage
        .from("reports")
        .upload(safeName, file);

      if (error) {
        console.error(error);
        log("❌ Upload error: " + error.message);
        return;
      }

      log("✅ Uploaded: " + safeName);
      uploadedPaths.push(data.path);
    }

    // Send to backend to generate AI report
    log("⏳ Sending to AI engine...");

    const resp = await fetch("/api/create-report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email,
        title,
        files: uploadedPaths,
      }),
    });

    const json = await resp.json();

    if (!resp.ok || !json.success) {
      console.error(json);
      log("❌ AI request failed");
    } else {
      log("🎉 AI queued — Report ID: " + json.id);
    }

  } catch (err) {
    console.error(err);
    log("❌ Fatal error: " + err);
  }
});
</script>

</body>
</html>
