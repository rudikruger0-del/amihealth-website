<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Upload Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module" src="/lib/supabaseClient.js"></script>
</head>

<body style="background:#0d0f23; color:white; font-family:Inter; padding:20px;">
  <h2>Upload Report</h2>

  <div id="userEmail">Checking login...</div>

  <div>
    <label>File</label>
    <input type="file" id="fileInput" />
  </div>

  <div>
    <label>Title (optional)</label>
    <input id="titleInput" />
  </div>

  <div>
    <label>Patient name (optional)</label>
    <input id="nameInput" />
  </div>

  <div>
    <label>Age (optional)</label>
    <input id="ageInput" type="number" />
  </div>

  <div>
    <label>Sex (optional)</label>
    <select id="sexInput">
      <option value="Unknown">Unknown</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>

  <button id="uploadBtn">Upload & Queue AI</button>

  <pre id="status" style="white-space:pre-wrap; margin-top:20px; color:#ff5555;"></pre>

  <script type="module">
    import { supabase } from "/lib/supabaseClient.js";

    async function loadUser() {
      const { data } = await supabase.auth.getUser();
      const box = document.getElementById("userEmail");

      if (!data.user) {
        box.innerHTML = "❌ Not logged in.";
        window.loggedInUser = null;
      } else {
        box.innerHTML = "Signed in as: " + data.user.email;
        window.loggedInUser = data.user.email;
      }
    }

    loadUser();

    document.getElementById("uploadBtn").onclick = async () => {
      const status = document.getElementById("status");
      status.textContent = "";

      if (!window.loggedInUser) {
        status.textContent = "❌ Not logged in.";
        return;
      }

      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        status.textContent = "❌ No file selected.";
        return;
      }

      const form = new FormData();
      form.append("file", file);
      form.append("email", window.loggedInUser);
      form.append("title", document.getElementById("titleInput").value);
      form.append("name", document.getElementById("nameInput").value);
      form.append("age", document.getElementById("ageInput").value);
      form.append("sex", document.getElementById("sexInput").value);

      status.textContent = "Uploading...";

      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          body: form
        });

        const json = await res.json();

        status.textContent = JSON.stringify(json, null, 2);
      } catch (e) {
        status.textContent = "❌ Upload crashed:\n" + e;
      }
    };
  </script>
</body>
</html>
