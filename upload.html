<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Upload Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
<header class="topbar">
  <div class="brand">
    <span class="logo-text">AMI Health</span>
    <span class="tagline">Upload Reports</span>
  </div>
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/upload.html">Upload Report</a>
  </nav>
</header>

<main class="page">
  <section class="panel">
    <p id="userEmail"></p>
    <button id="logoutBtn">Logout</button>
  </section>

  <section class="panel">
    <h1>Upload Scan or Lab Report</h1>
    <p>Select a PDF or image. Files are stored privately and securely.</p>

    <input type="file" id="fileInput" accept=".pdf,image/*" />
    <input type="text" id="titleInput" placeholder="Report title (optional)" />
    <button id="uploadBtn">Upload & Queue</button>

    <div id="statusArea"></div>
  </section>
</main>

<script type="module">
  import { supabase } from "/lib/supabaseClient.js";

  const email = localStorage.getItem("ami_user_email");

  if (!email) {
    document.getElementById("userEmail").innerHTML =
      "Not signed in.<br>Please return to login page.";
    document.getElementById("uploadBtn").disabled = true;
  } else {
    document.getElementById("userEmail").textContent = email;
  }

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("ami_user_email");
    window.location.href = "/index.html";
  };

  const statusArea = document.getElementById("statusArea");

  function log(msg) {
    const p = document.createElement("p");
    p.textContent = msg;
    statusArea.appendChild(p);
  }

  document.getElementById("uploadBtn").onclick = async () => {
    statusArea.innerHTML = "";

    if (!email) {
      alert("Not signed in. Please log in again.");
      return;
    }

    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Choose a file.");

    const title = document.getElementById("titleInput").value.trim();
    const fileName = `${Date.now()}_${file.name.replace(/\s+/g, "_")}`;

    log("Uploading…");

    const { data, error } = await supabase.storage
      .from("reports")
      .upload(fileName, file);

    if (error) {
      log("Upload failed.");
      return;
    }

    const path = data.path;
    log("Upload complete. Queuing AI…");

    const resp = await fetch("/api/create-report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email,
        title,
        files: [path],
        name: "",
        age: 0,
        sex: "Unknown"
      })
    });

    const json = await resp.json();

    if (!resp.ok) {
      log("Failed to queue AI.");
    } else {
      log("AI queued successfully. Report ID: " + json.id);
    }
  };
</script>
</body>
</html>
