<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Report — AMI Health</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #020314;
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 14px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    input, select {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      background: #0d1425;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: linear-gradient(90deg,#00e0b8,#00b3ff);
      border: none;
      color: black;
      font-size: 17px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      font-size: 14px;
    }

    #logout {
      color:#00e0b8;
      cursor:pointer;
      float:right;
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div id="logout">Logout</div>
  <h2>Signed in as: <span id="userEmail">-</span></h2>

  <div class="card">
    <h1>Upload Report</h1>

    <label>File</label>
    <input type="file" id="file">

    <label>Title</label>
    <input type="text" id="title" placeholder="Optional">

    <label>Patient name</label>
    <input type="text" id="pname" placeholder="Optional">

    <label>Age</label>
    <input type="number" id="age" placeholder="Optional">

    <label>Sex</label>
    <select id="sex">
      <option value="Unknown">Unknown</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <button id="uploadBtn">Upload & Queue AI</button>

    <div id="status"></div>
  </div>
</div>

<script>
/* -------------------------------
    SESSION HANDLING
--------------------------------*/
document.getElementById("userEmail").innerText =
  localStorage.getItem("ami_user_email") || "Unknown";

document.getElementById("logout").onclick = () => {
  localStorage.removeItem("ami_user_email");
  window.location.href = "/login";
};

/* -------------------------------
    UPLOAD HANDLER
--------------------------------*/
document.getElementById("uploadBtn").addEventListener("click", async () => {
  const status = document.getElementById("status");
  status.innerText = "";

  const fileInput = document.getElementById("file");
  const file = fileInput.files[0];

  if (!file) {
    status.innerText = "❌ Please choose a file.";
    return;
  }

  const email = localStorage.getItem("ami_user_email");
  if (!email) {
    status.innerText = "❌ Not logged in.";
    return;
  }

  const form = new FormData();
  form.append("file", file);
  form.append("email", email);
  form.append("title", document.getElementById("title").value);
  form.append("name", document.getElementById("pname").value);
  form.append("age", document.getElementById("age").value);
  form.append("sex", document.getElementById("sex").value);

  status.innerText = "⏳ Uploading to server...";

  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      body: form
    });

    const text = await res.text();
    let json = null;

    try { json = JSON.parse(text); }
    catch {
      status.innerText = "❌ Server returned non-JSON:\n" + text;
      return;
    }

    if (!res.ok) {
      status.innerText = "❌ Error:\n" + JSON.stringify(json, null, 2);
      return;
    }

    status.innerText =
      "✅ Uploaded!\nReport ID: " + json.id +
      "\nAI is now processing the report.";

  } catch (err) {
    status.innerText = "❌ Upload crashed:\n" + err;
  }
});
</script>

</body>
</html>
