<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Report — AMI Health</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #0a1234 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      padding: 28px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .topbar span strong { color: #ffffff; }

    .topbar button {
      background: transparent;
      border-radius: 999px;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.14);
      color: #e6eef8;
      font-size: 13px;
      cursor: pointer;
    }

    .topbar button:hover {
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.03);
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 45%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 45%),
                  rgba(6, 10, 30, 0.96);
      padding: 28px 26px 22px;
      border-radius: var(--radius);
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      max-width: 520px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px 0;
      font-size: 14px;
      color: #dce7ff;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 11px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(7, 11, 30, 0.96);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    button#uploadBtn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #001319;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .status.ok { color: #7ef7d3; }
    .status.err { color: #ff8f9b; }

    @media (max-width: 640px) {
      .card { padding: 22px 18px; }
      .row { flex-direction: column; }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="topbar">
      <span>Signed in as: <strong id="userEmail">Checking…</strong></span>
      
      <div style="display:flex; gap:10px;">
        <button id="backBtn" type="button">← Back to Dashboard</button>
        <button id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div class="card">
      <h1>Upload Report</h1>
      <div class="subtitle">
        Upload a PDF or image report. AMI will extract CBC values and run AI interpretation.
      </div>

      <label>File</label>
      <input type="file" id="fileInput" accept=".pdf,image/*" />

      <label>Title</label>
      <input id="reportTitle" type="text" placeholder="e.g. CBC — Z. Taljaard" />

      <label>Patient Name</label>
      <input id="patientName" type="text" />

      <div class="row">
        <div>
          <label>Age</label>
          <input id="ageInput" type="number" />
        </div>
        <div>
          <label>Sex</label>
          <select id="sexInput">
            <option value="Unknown" selected>Unknown</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
        </div>
      </div>

      <button id="uploadBtn">Upload & Queue AI</button>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const userEmailEl = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const backBtn = document.getElementById("backBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");

    const fileInput = document.getElementById("fileInput");
    const titleInput = document.getElementById("reportTitle");
    const nameInput = document.getElementById("patientName");
    const ageInput = document.getElementById("ageInput");
    const sexInput = document.getElementById("sexInput");

    let currentEmail = null;

    function setStatus(msg, type="") {
      statusEl.textContent = msg;
      statusEl.className = "status " + (type || "");
    }

    async function loadUser() {
      const { data,error } = await supabase.auth.getUser();
      if (!data?.user) {
        userEmailEl.textContent = "Not logged in";
        uploadBtn.disabled = true;
        return;
      }
      currentEmail = data.user.email;
      userEmailEl.textContent = currentEmail;
    }

    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      window.location.href="/login.html";
    };

    backBtn.onclick = () => window.location.href="/dashboard.html";

    uploadBtn.onclick = async () => {
      if (!fileInput.files[0]) return setStatus("Select a file.", "err");
      if (!currentEmail) return setStatus("Not logged in.", "err");

      const form = new FormData();
      form.append("file", fileInput.files[0]);
      form.append("email", currentEmail);
      form.append("title", titleInput.value);
      form.append("name", nameInput.value);
      form.append("age", ageInput.value);
      form.append("sex", sexInput.value);

      uploadBtn.disabled = true;
      setStatus("Uploading…");

      const resp = await fetch("/api/upload", { method:"POST", body:form });
      const txt = await resp.text();

      try {
        const data = JSON.parse(txt);
        if (data.ok || data.id) setStatus("Upload complete ✓","ok");
        else setStatus(data.error || txt,"err");
      } catch {
        setStatus(txt,"err");
      }

      uploadBtn.disabled = false;
    };

    loadUser();
  </script>

</body>
</html>
