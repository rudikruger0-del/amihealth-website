<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Report Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root {
    --bg: #030414;
    --card: #0b1020;
    --card2: #0f162d;
    --muted: #98a0b3;
    --accent: #00e0b8;
    --accent2: #00b7ff;
    --text: #eaf6ff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ------------------------------
      HEADER (new improved header)
  ------------------------------ */
  .topHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    background: #050919;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topHeaderLeft {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .headerLogo {
    width: 48px;
    height: auto;
  }

  .headerTitle {
    font-size: 18px;
    font-weight: 700;
  }

  .topHeader a {
    color: #00d4ff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .downloadBtn {
    padding: 10px 20px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    color: #001821;
    font-size: 14px;
  }

  /* ------------------------------
      Layout
  ------------------------------ */
  .wrapper {
    display: flex;
    height: calc(100vh - 70px);
    overflow: hidden;
  }

  .left {
    flex: 1;
    background: #000;
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  #pdfFrame {
    width: 100%;
    height: 100%;
    border: none;
  }

  .right {
    width: 45%;
    overflow-y: auto;
    padding: 26px;
    background: var(--card);
  }

  .logoSide {
    width: 110px;
    opacity: 0.9;
    margin-bottom: 14px;
  }

  /* ------------------------------
      Sections
  ------------------------------ */
  .section {
    background: var(--card2);
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  table {
    width: 100%;
    font-size: 14px;
    border-collapse: collapse;
  }

  th, td {
    padding: 6px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .badge-risk {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 10px;
  }

  .risk-low { background: #00e0b833; color: #00e0b8; }
  .risk-medium { background: #ffbf0033; color: #ffbf00; }
  .risk-high { background: #ff4b4b33; color: #ff4b4b; }

  .ai-text {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.45;
  }

  .footer {
    font-size: 12px;
    color: var(--muted);
    margin-top: 30px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: center;
  }

  /* ------------------------------
      PRINT WATERMARK
  ------------------------------ */
  @media print {

    /* Hide UI elements */
    .topHeader, .left {
      display: none !important;
    }

    .right {
      width: 100%;
      background: #ffffff;
      color: #000;
      padding: 30px;
      position: relative;
    }

    /* watermark */
    .right::before {
      content: "";
      position: fixed;
      top: 25%;
      left: 50%;
      width: 400px;
      height: 400px;
      background: url('/logo.png') no-repeat center center;
      background-size: 350px;
      opacity: 0.07;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .section {
      background: #fff;
      color: #000;
      border: none;
      page-break-inside: avoid;
    }

    table, th, td {
      color: #000;
      border-color: #ccc;
    }
  }

</style>
</head>

<body>

<!-- HEADER -->
<div class="topHeader">
  <div class="topHeaderLeft">
    <a href="/dashboard.html">← Back</a>
    <img src="/logo.png" class="headerLogo" alt="AMI Logo">
    <span class="headerTitle">AMI Laboratory Report</span>
  </div>

  <button class="downloadBtn" onclick="downloadPDF()">Print / Download PDF</button>
</div>

<div class="wrapper">

  <div class="left">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div class="right">

    <img src="/logo.png" class="logoSide">

    <div class="section">
      <h2>Patient Info</h2>
      <div id="patientInfo">Loading…</div>
    </div>

    <div class="section">
      <h3>CBC Results</h3>
      <table id="cbcTable"></table>
    </div>

    <div class="section">
      <h3>AI Interpretation</h3>
      <div id="aiRisk"></div>
      <div id="aiText" class="ai-text">Loading…</div>
    </div>

    <div class="footer">
      <strong>Disclaimer:</strong>  
      This AI interpretation is an assistive tool and is not a medical diagnosis.  
      Always consult a licensed medical professional for clinical decisions.
    </div>

  </div>
</div>

<script>
let REPORT_DATA = null;

async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const data = await res.json();

  if (!data || !data.results) {
    document.querySelector("#aiText").textContent = "Report not found.";
    return;
  }

  REPORT_DATA = data;

  // Signed URL for PDF
  const pdfRes = await fetch("/api/get-file-url", {
    method: "POST",
    body: JSON.stringify({ file_path: data.pdf_path }),
  });

  const pdfJson = await pdfRes.json();
  document.querySelector("#pdfFrame").src = pdfJson.url;

  // Patient info
  const rpt = data.results;
  document.querySelector("#patientInfo").innerHTML = `
    <b>Name:</b> ${rpt.name || "-"}<br>
    <b>Age:</b> ${rpt.age || "-"}<br>
    <b>Sex:</b> ${rpt.sex || "-"}<br>
    <b>Date:</b> ${new Date(rpt.created_at).toLocaleString()}
  `;

  // CBC
  const cbc = rpt.cbc_json || {};
  let rows = `<tr><th>Test</th><th>Value</th></tr>`;
  for (const key in cbc) {
    rows += `<tr><td>${key}</td><td>${cbc[key]}</td></tr>`;
  }
  document.querySelector("#cbcTable").innerHTML = rows;

  // AI interpretation
  const ai = rpt.ai_results?.json || {};
  let risk = ai?.risk_assessment?.overall_risk || "unknown";

  let riskClass =
    risk === "high" ? "risk-high" :
    risk === "moderate" ? "risk-medium" :
    "risk-low";

  document.querySelector("#aiRisk").innerHTML = `
    <span class="badge-risk ${riskClass}">
      ${risk.toUpperCase()}
    </span>
  `;

  let text = rpt.ai_results?.doctor_report || "No AI output.";
  document.querySelector("#aiText").textContent = text;
}

async function downloadPDF() {
  if (!REPORT_DATA) return alert("Report not loaded yet.");

  const res = await fetch("/api/export-pdf", {
    method: "POST",
    body: JSON.stringify(REPORT_DATA),
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "AMI_Report.pdf";
  a.click();
}

loadReport();
</script>

</body>
</html>
