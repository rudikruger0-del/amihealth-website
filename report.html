<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
/* =========================
   SCREEN (NEW UI)
========================= */
:root {
  --card:#0b1020;
  --white:#eaf6ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}

body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#02040e;
  color:var(--white);
}

header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}

.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}

.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}

.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}

iframe { width:100%; height:100%; border:none; }

.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}

h2 { margin:0 0 10px; font-size:20px; }
.row { margin:6px 0; font-size:14px; }

.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.06);
}

.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }

.severity-badge {
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
}

.severity-low { background:var(--low); }
.severity-moderate { background:var(--moderate); }
.severity-high { background:var(--high); }
.severity-critical { background:var(--critical); }

/* =========================
   PRINT (OLD MEDICAL FORMAT)
========================= */
@media print {

  header,
  .container {
    display:none !important;
  }

  body {
    background:#fff;
    color:#111;
  }

  #print-root {
    display:block;
    padding:40px;
    font-family:system-ui,sans-serif;
    font-size:13px;
  }

  table {
    width:100%;
    border-collapse:collapse;
  }

  th, td {
    border:1px solid #ccc;
    padding:4px 6px;
  }

  th {
    background:#f3f4f6;
  }
}

/* hidden on screen */
#print-root {
  display:none;
}
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button class="primary" onclick="window.print()">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer"><iframe id="pdfFrame"></iframe></div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<!-- =========================
     PRINT ROOT (OLD FORMAT)
========================= -->
<div id="print-root">
  <img src="/logo.png" height="36" />
  <h2>AMI Health — AI Clinical Report</h2>

  <p>
    Name: <b id="p-name"></b> |
    Age: <b id="p-age"></b> |
    Sex: <b id="p-sex"></b>
  </p>

  <h3>Laboratory Summary</h3>
  <table id="p-labs"></table>

  <h3>AI Summary</h3>
  <div id="p-summary"></div>

  <p style="font-size:11px;margin-top:20px;">
    This AI-generated interpretation supports clinical judgement and does not replace diagnosis.
  </p>

  <img id="p-qr" height="90" />
</div>

<script type="module">
async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();

  const rpt = json.report || {};
  const ai = rpt.ai_results || {};

  document.getElementById("name").textContent = rpt.name || "—";
  document.getElementById("age").textContent = rpt.age ?? "—";
  document.getElementById("sex").textContent = rpt.sex || "—";
  document.getElementById("date").textContent = new Date(rpt.created_at).toLocaleString();

  // PRINT
  document.getElementById("p-name").textContent = rpt.name || "—";
  document.getElementById("p-age").textContent = rpt.age ?? "—";
  document.getElementById("p-sex").textContent = rpt.sex || "—";
  document.getElementById("p-summary").textContent =
    ai.summary?.impression || "—";

  const verifyUrl = `https://amihealth.co.za/verify?id=${rpt.id}`;
  document.getElementById("p-qr").src =
    `https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(verifyUrl)}`;
}

loadReport();
</script>

</body>
</html>
