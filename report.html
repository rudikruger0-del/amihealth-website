<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Clinical Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#96a0b8;
      --accent:#00e0b8;
      --white:#eaf6ff;

      --low:#10b981;
      --moderate:#f59e0b;
      --high:#f97316;
      --critical:#dc2626;
    }

    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:#02040e;
      color:var(--white);
    }

    header {
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#050a16;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    button {
      padding:10px 18px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }

    .primary {
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
    }

    .secondary {
      background:transparent;
      border:1px solid rgba(255,255,255,0.3);
      color:#fff;
    }

    .container {
      max-width:1200px;
      margin:20px auto;
      padding:0 20px 30px;
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:20px;
    }

    @media (max-width:900px){
      .container { grid-template-columns:1fr; }
      .left-viewer { height:60vh; }
    }

    .left-viewer {
      background:#000;
      border-radius:12px;
      overflow:hidden;
      height:85vh;
      border:1px solid rgba(255,255,255,0.08);
    }

    iframe { width:100%; height:100%; border:none; }

    .panel {
      background:var(--card);
      padding:20px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.07);
      margin-bottom:18px;
    }

    h2 {
      margin:0 0 10px;
      font-size:20px;
    }

    .row {
      margin:6px 0;
      font-size:14px;
      line-height:1.5;
    }

    .cbc-row {
      display:flex;
      justify-content:space-between;
      padding:4px 0;
      border-bottom:1px dashed rgba(255,255,255,0.06);
    }

    .flag-high { color:var(--high); font-weight:700; }
    .flag-low { color:var(--moderate); font-weight:600; }
    .flag-normal { color:var(--white); }

    .severity-badge {
      display:inline-flex;
      padding:6px 14px;
      border-radius:999px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .severity-low { background:var(--low); }
    .severity-moderate { background:var(--moderate); }
    .severity-high { background:var(--high); }
    .severity-critical { background:var(--critical); }

    .section-title {
      margin-top:14px;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      opacity:0.85;
    }

    ul {
      margin:6px 0 0 18px;
      padding:0;
      font-size:14px;
    }
  </style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <div>
    <button id="printBtn" class="primary">Print / Save AI Report</button>
    <a id="downloadBtn" class="secondary" target="_blank">Download Original PDF</a>
  </div>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name"></span></div>
      <div class="row"><b>Age:</b> <span id="age"></span></div>
      <div class="row"><b>Sex:</b> <span id="sex"></span></div>
      <div class="row"><b>Date:</b> <span id="date"></span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Interpretation</h2>
      <div id="aiBox"></div>
    </div>

  </div>
</div>

<script type="module">

async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();
  const rpt = json.report || {};
  const ai = rpt.ai_results || {};

  document.getElementById("name").textContent = rpt.name ?? "—";
  document.getElementById("age").textContent = rpt.age ?? "—";
  document.getElementById("sex").textContent = rpt.sex ?? "—";
  document.getElementById("date").textContent =
    rpt.created_at ? new Date(rpt.created_at).toLocaleString() : "—";

  if (rpt.file_path){
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj = await f.json();
    if (fj.url){
      document.getElementById("pdfFrame").src = fj.url;
      document.getElementById("downloadBtn").href = fj.url;
    }
  }

  renderLabs(ai);
  renderAI(ai);
}

/* =========================
   LAB RENDERING
   ========================= */
function renderLabs(ai){
  const box = document.getElementById("cbcBox");
  const labs = ai._canonical_cbc || {};
  const keys = Object.keys(labs);

  if (!keys.length){
    box.innerHTML = "<div class='row'>No structured laboratory values available</div>";
    return;
  }

  const hasCBC = ["Hb", "WBC", "Platelets"].some(k => labs[k]);
  const scopeNote = hasCBC
    ? "CBC and chemistry values detected"
    : "CBC not available — interpretation based on chemistry only";

  let html = `<div class="row" style="opacity:0.8;font-size:13px">${scopeNote}</div>`;

  keys.forEach(key => {
    const d = labs[key] || {};
    const value = d.value ?? "—";
    const units = d.units ?? "";
    let cls = "flag-normal";

    if (d.flag === "H" || d.flag === "high") cls = "flag-high";
    if (d.flag === "L" || d.flag === "low") cls = "flag-low";

    html += `
      <div class="cbc-row ${cls}">
        <span><b>${key}</b></span>
        <span>${value} ${units}</span>
      </div>
    `;
  });

  box.innerHTML = html;
}

/* =========================
   AI INTERPRETATION
   ========================= */
function renderAI(ai){
  const box = document.getElementById("aiBox");
  const severity = ai._severity?.severity || "low";
  const summary = ai._overall_status || ai.summary?.impression || "—";
  const flags = ai._severity?.urgency_flags || [];

  const context = ai._chemistry_context || [];
  const nextSteps = ai._chemistry_next_steps || [];

  box.innerHTML = `
    <div class="severity-badge severity-${severity}">
      ${severity.toUpperCase()}
    </div>

    <div class="section-title">Clinical Summary</div>
    <div class="row">${summary}</div>

    ${flags.length ? `
      <div class="section-title">Urgency Flags</div>
      ${flags.map(f => `<div class="row">⚠ ${f.reason}</div>`).join("")}
    ` : ""}

    ${context.length ? `
      <div class="section-title">Clinical Context Considerations</div>
      <ul>${context.map(c => `<li>${c}</li>`).join("")}</ul>
    ` : ""}

    ${nextSteps.length ? `
      <div class="section-title">Suggested Next Steps (Conservative)</div>
      <ul>${nextSteps.map(s => `<li>${s}</li>`).join("")}</ul>
    ` : ""}
  `;
}

document.getElementById("printBtn").onclick = () => window.print();
loadReport();

</script>
</body>
</html>
