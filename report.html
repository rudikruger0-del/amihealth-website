<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Clinical Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#96a0b8;
      --accent:#00e0b8;
      --white:#eaf6ff;

      --low:#10b981;
      --moderate:#f59e0b;
      --high:#f97316;
      --critical:#dc2626;
    }

    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:#02040e;
      color:var(--white);
    }

    header {
      padding:18px 24px;
      display:flex;
      justify-content:space-between;
      background:#050a16;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    button {
      padding:10px 18px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }

    .primary {
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
    }

    .secondary {
      background:transparent;
      border:1px solid rgba(255,255,255,0.3);
      color:#fff;
    }

    .container {
      max-width:1200px;
      margin:20px auto;
      padding:0 20px 30px;
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:20px;
    }

    .left-viewer {
      background:#000;
      border-radius:12px;
      overflow:hidden;
      height:85vh;
      border:1px solid rgba(255,255,255,0.08);
    }

    iframe { width:100%; height:100%; border:none; }

    .panel {
      background:var(--card);
      padding:20px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.07);
      margin-bottom:18px;
    }

    h2 { margin:0 0 10px; font-size:20px; }

    .row { margin:6px 0; font-size:14px; }

    .cbc-row {
      display:flex;
      justify-content:space-between;
      padding:6px 0;
      border-bottom:1px dashed rgba(255,255,255,0.06);
      font-size:14px;
    }

    .flag-high { color:var(--high); font-weight:700; }
    .flag-low { color:var(--moderate); font-weight:700; }

    .severity-badge {
      display:inline-flex;
      padding:6px 14px;
      border-radius:999px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .severity-low { background:var(--low); }
    .severity-moderate { background:var(--moderate); }
    .severity-high { background:var(--high); }
    .severity-critical { background:var(--critical); }

    .section-title {
      margin-top:14px;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      opacity:0.85;
    }

    .route-block {
      margin-top:10px;
      padding:10px 12px;
      border-radius:10px;
      background:#050a18;
      border-left:4px solid #444;
    }

    .route-primary { border-left-color:#dc2626; }
    .route-secondary { border-left-color:#f59e0b; }
    .route-contextual { border-left-color:#60a5fa; }

    ul { margin:6px 0 0 18px; padding:0; }
    li { margin:4px 0; font-size:14px; }
  </style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button class="primary" onclick="window.print()">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script type="module">
async function loadReport() {
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();

  const rpt = json.report || {};
  const ai = rpt.ai_results || {};
  const patient = ai.patient || rpt.patient || {};

  // ---- PATIENT DEMOGRAPHICS (FIXED) ----
  document.getElementById("name").textContent =
    patient.name ?? rpt.name ?? "—";

  document.getElementById("age").textContent =
    patient.age !== undefined && patient.age !== null
      ? patient.age
      : rpt.age ?? "—";

  document.getElementById("sex").textContent =
    patient.sex ?? patient.gender ?? rpt.sex ?? "Unknown";

  document.getElementById("date").textContent =
    rpt.created_at ? new Date(rpt.created_at).toLocaleString() : "—";

  // ---- PDF ----
  if (rpt.file_path) {
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj = await f.json();
    if (fj.url) document.getElementById("pdfFrame").src = fj.url;
  }

  renderCBC(ai);
  renderAI(ai);
}

function renderCBC(ai) {
  const box = document.getElementById("cbcBox");
  const labs = ai._canonical_cbc || {};
  const keys = Object.keys(labs).filter(k => !k.startsWith("_"));

  if (!keys.length) {
    box.innerHTML = "<div class='row'>No structured laboratory values available</div>";
    return;
  }

  box.innerHTML = keys.map(k => {
    const d = labs[k] || {};
    const val = Number(d.value);
    const lo = Number(d.reference_low);
    const hi = Number(d.reference_high);

    let cls = "";
    let arrow = "";

    if (!isNaN(val)) {
      if (!isNaN(hi) && val > hi) { cls = "flag-high"; arrow = " ↑"; }
      else if (!isNaN(lo) && val < lo) { cls = "flag-low"; arrow = " ↓"; }
    }

    return `
      <div class="cbc-row ${cls}">
        <span><b>${k}</b></span>
        <span>${d.value ?? "—"} ${d.units ?? ""}${arrow}</span>
      </div>`;
  }).join("");
}

function renderAI(ai) {
  const box = document.getElementById("aiBox");
  const severity = ai._severity?.severity || "low";
  const summary = ai.summary?.impression || "—";
  const routes = ai._routes || [];

  box.innerHTML = `
    <div class="severity-badge severity-${severity}">
      ${severity.toUpperCase()}
    </div>

    <div class="section-title">Summary</div>
    <div class="row">${summary}</div>

    ${routes.length ? `
      <div class="section-title">Clinical Reasoning & Routes</div>
      ${routes.map(r => `
        <div class="route-block route-${r.priority || "secondary"}">
          <b>${r.pattern}</b><br/>
          ${r.route}
          ${r.next_steps?.length ? `<ul>${r.next_steps.map(s => `<li>${s}</li>`).join("")}</ul>` : ""}
        </div>
      `).join("")}
    ` : ""}
  `;
}

loadReport();
</script>

</body>
</html>
