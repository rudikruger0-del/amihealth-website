<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --card:#0b1020;
  --white:#eaf6ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}

body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#02040e;
  color:var(--white);
}

header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}

.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}

.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}

.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}

iframe { width:100%; height:100%; border:none; }

.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}

h2 { margin:0 0 10px; font-size:20px; }
.row { margin:6px 0; font-size:14px; }

.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.06);
}

.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }

.severity-badge {
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
}

.severity-low { background:var(--low); }
.severity-moderate { background:var(--moderate); }
.severity-high { background:var(--high); }
.severity-critical { background:var(--critical); }

.section-title {
  margin-top:14px;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
}

.route-block {
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#050a18;
  border-left:4px solid #444;
}

.route-primary { border-left-color:#dc2626; }
.route-secondary { border-left-color:#f59e0b; }

ul { margin:6px 0 0 18px; padding:0; }
li { margin:4px 0; font-size:14px; }

/* ==========================
   PRINT OUTPUT — SAFE FIX
   ========================== */

@media print {

  /* Global print reset */
  html, body {
    background:#ffffff !important;
    color:#000000 !important;
  }

  /* Remove dark UI chrome */
  header,
  .left-viewer {
    display:none !important;
  }

  /* Panels become clean paper cards */
  .panel {
    background:#ffffff !important;
    color:#000000 !important;
    border:1px solid #ddd !important;
    box-shadow:none !important;
    page-break-inside: avoid;
  }

  /* Text hierarchy */
  h2 {
    color:#000 !important;
    font-weight:700;
  }

  .row,
  li {
    color:#000 !important;
  }

  .cbc-row {
    border-bottom:1px solid #ddd !important;
  }

  .flag-high,
  .flag-low {
    color:#000 !important;
    font-weight:700;
  }

  /* Severity prints clearly but neutrally */
  .severity-badge {
    background:#ffffff !important;
    color:#000000 !important;
    border:2px solid #000000 !important;
    font-size:14pt;
    margin-bottom:10pt;
  }

  /* Route blocks stay readable */
  .route-block {
    background:#ffffff !important;
    color:#000000 !important;
    border:1px solid #ddd !important;
    border-left-width:4px;
    page-break-inside: avoid;
  }

  /* IMPORTANT:
     DO NOT hide images.
     Logos and QR codes will print normally.
  */
  img {
    max-width:100%;
    page-break-inside: avoid;
  }
}
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button class="primary" onclick="window.print()">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script type="module">
/* YOUR EXISTING JS — UNCHANGED */
</script>

</body>
</html>
