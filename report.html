<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Clinical Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#96a0b8;
      --accent:#00e0b8;
      --white:#eaf6ff;

      --low:#f59e0b;
      --high:#dc2626;
      --critical:#991b1b;
      --normal:#ffffff;
    }

    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:#02040e;
      color:var(--white);
    }

    header {
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#050a16;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .container {
      max-width:1200px;
      margin:20px auto;
      padding:0 20px 30px;
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:20px;
    }

    @media (max-width:900px){
      .container { grid-template-columns:1fr; }
      .left-viewer { height:60vh; }
    }

    .left-viewer {
      background:#000;
      border-radius:12px;
      overflow:hidden;
      height:85vh;
      border:1px solid rgba(255,255,255,0.08);
    }

    iframe { width:100%; height:100%; border:none; }

    .panel {
      background:var(--card);
      padding:20px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.07);
      margin-bottom:18px;
    }

    h2 { margin:0 0 10px; font-size:20px; }

    .row { margin:6px 0; font-size:14px; }

    .cbc-row {
      display:flex;
      justify-content:space-between;
      padding:4px 0;
      border-bottom:1px dashed rgba(255,255,255,0.06);
    }

    .flag-high { color:var(--high); font-weight:700; }
    .flag-low { color:var(--low); font-weight:600; }
    .flag-normal { color:var(--normal); }

    .severity-badge {
      display:inline-flex;
      padding:6px 14px;
      border-radius:999px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .severity-critical { background:var(--critical); }
    .severity-high { background:var(--high); }
    .severity-moderate { background:var(--low); }
    .severity-low { background:#10b981; }

    .section-title {
      margin-top:14px;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      opacity:0.85;
    }

    button {
      padding:10px 18px;
      border-radius:999px;
      border:none;
      font-weight:600;
      cursor:pointer;
    }

    .primary { background:linear-gradient(90deg,#00e0b8,#00b7ff); }
    .secondary { background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff; }
  </style>
</head>

<body>

<header>
  <div>
    <button class="secondary" onclick="history.back()">← Back</button>
  </div>
  <div>
    <button id="printBtn" class="primary">Print / Save AI Report</button>
    <a id="downloadBtn" class="secondary" target="_blank">Download Original PDF</a>
  </div>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name"></span></div>
      <div class="row"><b>Age:</b> <span id="age"></span></div>
      <div class="row"><b>Sex:</b> <span id="sex"></span></div>
      <div class="row"><b>Date:</b> <span id="date"></span></div>
    </div>

    <div class="panel">
      <h2>CBC & Chemistry</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Interpretation</h2>
      <div id="aiBox"></div>
    </div>

  </div>
</div>

<script type="module">

async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();
  const rpt = json.report || {};
  const ai = rpt.ai_results || {};

  document.getElementById("name").textContent = rpt.name ?? "—";
  document.getElementById("age").textContent = rpt.age ?? "—";
  document.getElementById("sex").textContent = rpt.sex ?? "—";
  document.getElementById("date").textContent =
    rpt.created_at ? new Date(rpt.created_at).toLocaleString() : "—";

  if (rpt.file_path){
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj = await f.json();
    if (fj.url){
      document.getElementById("pdfFrame").src = fj.url;
      document.getElementById("downloadBtn").href = fj.url;
    }
  }

  renderCBC(ai);
  renderAI(ai);
}

function renderCBC(ai){
  const box = document.getElementById("cbcBox");
  const cbc = ai._canonical_cbc || {};
  const keys = Object.keys(cbc).filter(k => !k.startsWith("_"));

  if (!keys.length){
    box.innerHTML = "<div class='row'>⚠ CBC not available</div>";
    return;
  }

  box.innerHTML = keys.map(k => {
    const d = cbc[k];
    const v = d.value ?? "—";
    const u = d.units ?? "";
    let cls = "flag-normal";

    if (d.flag === "H") cls = "flag-high";
    if (d.flag === "L") cls = "flag-low";

    return `
      <div class="cbc-row ${cls}">
        <span><b>${k}</b></span>
        <span>${v} ${u}</span>
      </div>
    `;
  }).join("");
}

function renderAI(ai){
  const box = document.getElementById("aiBox");
  const sev = ai._severity?.severity || "low";
  const summary = ai.summary?.impression || "—";
  const flags = ai._severity?.urgency_flags || [];

  box.innerHTML = `
    <div class="severity-badge severity-${sev}">
      ${sev.toUpperCase()}
    </div>

    <div class="section-title">Summary</div>
    <div class="row">${summary}</div>

    ${flags.length ? `
      <div class="section-title">Urgency Flags</div>
      ${flags.map(f => `<div class="row">⚠ ${f.reason}</div>`).join("")}
    ` : ""}
  `;
}

document.getElementById("printBtn").onclick = () => window.print();
loadReport();

</script>
</body>
</html>
