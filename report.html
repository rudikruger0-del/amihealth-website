<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --card:#0b1020;
  --white:#eaf6ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}
body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#02040e;
  color:var(--white);
}
header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}
.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}
iframe { width:100%; height:100%; border:none; }
.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}
h2 { margin:0 0 10px; font-size:20px; }
.row { margin:6px 0; font-size:14px; }
.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.06);
}
.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }
.severity-badge {
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
}
.severity-low { background:var(--low); }
.severity-moderate { background:var(--moderate); }
.severity-high { background:var(--high); }
.severity-critical { background:var(--critical); }
.section-title {
  margin-top:14px;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
}
.route-block {
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#050a18;
  border-left:4px solid #444;
}
.route-primary { border-left-color:#dc2626; }
.route-secondary { border-left-color:#f59e0b; }
ul { margin:6px 0 0 18px; padding:0; }
li { margin:4px 0; font-size:14px; }
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button class="primary" onclick="printAiReport()">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer"><iframe id="pdfFrame"></iframe></div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script>
let REPORT = null;

async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${encodeURIComponent(id)}`);
  const json = await res.json();

  REPORT = json.report;
  const ai = REPORT.ai_results || {};

  document.getElementById("name").textContent = REPORT.name || "Unknown";
  document.getElementById("age").textContent = REPORT.age ?? "—";
  document.getElementById("sex").textContent = REPORT.sex || "—";
  document.getElementById("date").textContent =
    REPORT.created_at ? new Date(REPORT.created_at).toLocaleString() : "—";

  if (REPORT.file_path){
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(REPORT.file_path)}`);
    const fj = await f.json();
    if (fj.url) document.getElementById("pdfFrame").src = fj.url;
  }

  renderCBC(ai);
  renderAI(ai);
}

function renderCBC(ai){
  const box = document.getElementById("cbcBox");
  const labs = ai._canonical_cbc || {};
  const keys = Object.keys(labs).filter(k => !k.startsWith("_"));

  box.innerHTML = keys.map(k=>{
    const d = labs[k];
    const v = Number(d.value);
    let cls = "";
    if (v > d.reference_high) cls="flag-high";
    if (v < d.reference_low) cls="flag-low";
    return `
      <div class="cbc-row ${cls}">
        <span><b>${k}</b></span>
        <span>${d.value} ${d.units || ""}</span>
      </div>`;
  }).join("");
}

function renderAI(ai){
  const box = document.getElementById("aiBox");
  const sev = ai._severity?.severity || "low";
  box.innerHTML = `
    <div class="severity-badge severity-${sev}">${sev.toUpperCase()}</div>
    <div class="section-title">Summary</div>
    <div class="row">${ai.summary?.impression || "—"}</div>
  `;
}

async function printAiReport(){
  if (!REPORT) return alert("Report not loaded");

  const ai = REPORT.ai_results || {};
  const labs = ai._canonical_cbc || {};

  const rows = Object.entries(labs).map(([k,v],i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${k}</td>
      <td>${v.value}</td>
      <td>${v.units||""}</td>
      <td>${v.reference_low||""}–${v.reference_high||""}</td>
      <td>${v.flag||"normal"}</td>
    </tr>`).join("");

  const verify = `https://amihealth.co.za/verify?id=${REPORT.id}`;
  const qr = `https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(verify)}`;

  const win = window.open("", "_blank");
  win.document.write(`
<!doctype html>
<html><head><meta charset="utf-8"/>
<title>AMI Health — AI Report</title>
<style>
body{font-family:system-ui;margin:40px;color:#111;font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:4px}
th{background:#f3f4f6}
.footer{margin-top:20px;font-size:10px;color:#666;display:flex;justify-content:space-between}
</style>
</head>
<body>
<h2>AMI Health — AI Interpretation Report</h2>
<b>${REPORT.name}</b> • Age ${REPORT.age} • ${REPORT.sex}<br/><br/>
<table><thead>
<tr><th>#</th><th>Analyte</th><th>Result</th><th>Units</th><th>Reference</th><th>Flag</th></tr>
</thead><tbody>${rows}</tbody></table>

<h3>AI Summary</h3>
${ai.summary?.impression || ""}

<div class="footer">
<div>This AI report supports clinical judgement.</div>
<div><img src="${qr}"/></div>
</div>
</body></html>
  `);
  win.document.close();
  win.focus();
  win.print();
}

loadReport();
</script>

</body>
</html>
