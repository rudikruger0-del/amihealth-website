<script>
async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.querySelector("#aiText").textContent = "Missing report ID.";
    return;
  }

  // 1️⃣ Fetch report data
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const data = await res.json();

  if (!data || !data.report) {
    document.querySelector("#aiText").textContent = "Unable to load report.";
    return;
  }

  const rpt = data.report;

  // 2️⃣ Get signed PDF URL
  const pdfRes = await fetch("/api/get-file-url", {
    method: "POST",
    body: JSON.stringify({ file_path: rpt.file_path }),
    headers: { "Content-Type": "application/json" }
  });

  const pdfJson = await pdfRes.json();

  if (pdfJson.url) {
    document.querySelector("#pdfFrame").src = pdfJson.url;
  } else {
    alert("Failed to load PDF.");
  }

  // 3️⃣ Patient Info
  document.querySelector("#patientInfo").innerHTML = `
    <b>Name:</b> ${rpt.name || "-"}<br>
    <b>Age:</b> ${rpt.age || "-"}<br>
    <b>Sex:</b> ${rpt.sex || "-"}<br>
    <b>Date:</b> ${new Date(rpt.created_at).toLocaleString()}
  `;

  // 4️⃣ CBC Table (optional)
  const cbc = rpt.cbc_json || {};
  let rows = `<tr><th>Test</th><th>Value</th></tr>`;
  for (const key in cbc) {
    rows += `<tr><td>${key}</td><td>${cbc[key]}</td></tr>`;
  }
  document.querySelector("#cbcTable").innerHTML = rows;

  // 5️⃣ AI Output
  document.querySelector("#aiText").textContent =
    rpt.ai_results ? JSON.stringify(rpt.ai_results, null, 2) : "No AI output.";
}

loadReport();
</script>
