<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --card:#0b1020;
  --white:#eaf6ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}
body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#02040e;
  color:var(--white);
}
header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}
.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}
iframe { width:100%; height:100%; border:none; }
.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}
h2 { margin:0 0 10px; font-size:20px; }
.row { margin:6px 0; font-size:14px; }
.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.06);
}
.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }
.severity-badge {
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
}
.severity-low { background:var(--low); }
.severity-moderate { background:var(--moderate); }
.severity-high { background:var(--high); }
.severity-critical { background:var(--critical); }
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <!-- 🔑 INLINE CLICK — REQUIRED -->
  <button class="primary" onclick="printAiReport()">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer"><iframe id="pdfFrame"></iframe></div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script>
/* ========= GLOBAL STATE ========= */
let REPORT_DATA = null;

/* ========= LOAD REPORT ========= */
async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();

  const rpt = json.report || {};
  REPORT_DATA = rpt;
  const ai = rpt.ai_results || {};

  document.getElementById("name").textContent = rpt.name || "—";
  document.getElementById("age").textContent = rpt.age ?? "—";
  document.getElementById("sex").textContent = rpt.sex || "—";
  document.getElementById("date").textContent =
    rpt.created_at ? new Date(rpt.created_at).toLocaleString() : "—";

  if (rpt.file_path){
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj = await f.json();
    if (fj.url) document.getElementById("pdfFrame").src = fj.url;
  }

  renderCBC(ai);
  renderAI(ai);
}

/* ========= PRINT (SYNC + SAFE) ========= */
function printAiReport(){
  if(!REPORT_DATA){
    alert("Report not loaded yet");
    return;
  }

  const ai = REPORT_DATA.ai_results || {};
  const labs = ai._canonical_cbc || {};

  const rows = Object.entries(labs).map(([k,v],i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${k}</td>
      <td>${v.value ?? ""}</td>
      <td>${v.units ?? ""}</td>
      <td>${v.reference_low ?? ""}–${v.reference_high ?? ""}</td>
      <td>${v.flag ?? "normal"}</td>
    </tr>`).join("");

  const verifyUrl = `https://amihealth.co.za/verify?id=${REPORT_DATA.id}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(verifyUrl)}`;

  const w = window.open("", "_blank");
  w.document.write(`
<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>AMI Health — AI Interpretation</title>
<style>
body{font-family:system-ui;margin:40px;color:#111}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #ccc;padding:4px}
th{background:#eee}
</style>
</head>
<body>
<img src="/logo.png" height="32"/>
<h2>AI Interpretation Report</h2>

<table>
<tr><th>#</th><th>Analyte</th><th>Value</th><th>Units</th><th>Reference</th><th>Flag</th></tr>
${rows}
</table>

<br/>
<img src="${qrUrl}"/><br/>
<small>${verifyUrl}</small>
</body></html>
`);
  w.document.close();
  w.focus();
  w.print();
}

/* ========= UI ========= */
function renderCBC(ai){
  const box=document.getElementById("cbcBox");
  const labs=ai._canonical_cbc||{};
  box.innerHTML=Object.keys(labs).map(k=>`
    <div class="cbc-row">
      <b>${k}</b>
      <span>${labs[k].value ?? "—"} ${labs[k].units ?? ""}</span>
    </div>`).join("");
}

function renderAI(ai){
  document.getElementById("aiBox").innerHTML =
    ai.summary?.impression || "—";
}

loadReport();
</script>

</body>
</html>
