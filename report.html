<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --card:#0b1020;
  --white:#eaf6ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}

body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#02040e;
  color:var(--white);
}

header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}

.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}

.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}

.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}

iframe {
  width:100%;
  height:100%;
  border:none;
}

.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}

h2 { margin:0 0 10px; font-size:20px; }
.row { margin:6px 0; font-size:14px; }

.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.06);
}

.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }

.severity-badge {
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
}

.severity-normal { background:var(--low); }
.severity-mild { background:var(--moderate); }
.severity-moderate { background:var(--high); }
.severity-severe { background:var(--critical); }

.section-title {
  margin-top:14px;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
}
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button class="primary" id="printBtn">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script type="module">
let REPORT_DATA = null;

async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${encodeURIComponent(id)}`);
  const json = await res.json();
  REPORT_DATA = json.report;

  const ai = typeof REPORT_DATA.ai_results === "string"
    ? JSON.parse(REPORT_DATA.ai_results)
    : REPORT_DATA.ai_results;

  document.getElementById("name").textContent = REPORT_DATA.name;
  document.getElementById("age").textContent = REPORT_DATA.age;
  document.getElementById("sex").textContent = REPORT_DATA.sex;
  document.getElementById("date").textContent =
    new Date(REPORT_DATA.created_at).toLocaleString();

  const pdf = await fetch(`/api/get-file-url?path=${encodeURIComponent(REPORT_DATA.file_path)}`);
  const pj = await pdf.json();
  document.getElementById("pdfFrame").src = pj.url;

  renderLabs(ai);
  renderAI(ai);
}

function renderLabs(ai){
  const box = document.getElementById("cbcBox");
  const labs = [...(ai.cbc||[]), ...(ai.chemistry||[])];

  box.innerHTML = labs.map(l => `
    <div class="cbc-row ${l.flag === "high" ? "flag-high" : l.flag === "low" ? "flag-low" : ""}">
      <span><b>${l.analyte}</b></span>
      <span>${l.value} ${l.units} (ref ${l.reference_low}–${l.reference_high})</span>
    </div>
  `).join("");
}

function renderAI(ai){
  document.getElementById("aiBox").innerHTML = `
    <div class="severity-badge severity-${ai.severity_text}">
      ${ai.severity_text.toUpperCase()}
    </div>
    <div class="section-title">Summary</div>
    <div class="row">${ai.summary?.impression || "—"}</div>
  `;
}

/* ===============================
   PRINT — EXACT ORIGINAL FORMAT
   =============================== */
function printAiReport(){
  const ai = typeof REPORT_DATA.ai_results === "string"
    ? JSON.parse(REPORT_DATA.ai_results)
    : REPORT_DATA.ai_results;

  const labs = [...(ai.cbc||[]), ...(ai.chemistry||[])];
  const s = ai.summary || {};

  const rows = labs.map((l,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${l.analyte}</td>
      <td>${l.value}</td>
      <td>${l.units}</td>
      <td>${l.reference_low}–${l.reference_high}</td>
      <td>${l.flag || "normal"}</td>
    </tr>
  `).join("");

  const verifyUrl = `https://amihealth.co.za/verify?id=${REPORT_DATA.id}`;

  const w = window.open("", "_blank");
  w.document.write(`
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AMI Health — AI Interpretation Report</title>
<style>
body{font-family:system-ui;margin:40px;font-size:13px;color:#111}
.header{display:flex;justify-content:space-between}
.title{text-align:center;font-weight:700}
hr{border:none;border-top:2px solid #0ea5e9;margin:8px 0 18px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #bbb;padding:5px}
th{background:#f3f4f6}
.footer{margin-top:18px;font-size:10px;color:#555}
</style>
</head>
<body>

<div class="header">
  <div>${new Date(REPORT_DATA.created_at).toLocaleString()}</div>
  <div class="title">
    AMI Health — AI Interpretation Report<br/>
    <span style="font-weight:400">Artificial Medical Intelligence (Pty) Ltd</span>
  </div>
  <div></div>
</div>

<hr/>

<p><b>Patient:</b> ${REPORT_DATA.name} | <b>Age:</b> ${REPORT_DATA.age} | <b>Sex:</b> ${REPORT_DATA.sex}</p>

<h3>Laboratory Overview</h3>
<table>
<tr><th>#</th><th>Analyte</th><th>Value</th><th>Units</th><th>Reference</th><th>Flag</th></tr>
${rows}
</table>

<h3>AI Summary</h3>
<p>${s.impression}</p>

<h3>Suggested Follow-up</h3>
<p>${s.suggested_follow_up}</p>

<div class="footer">
This AI-generated interpretation supports clinical judgement and does not replace a diagnosis.<br/>
${verifyUrl}
</div>

</body>
</html>
`);
  w.document.close();
  w.print();
}

document.getElementById("printBtn").addEventListener("click", printAiReport);
loadReport();
</script>

</body>
</html>
