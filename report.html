<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AMI Health — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
:root{
  --bg:#02040e;
  --card:#0b1020;
  --ink:#eaf6ff;
  --muted:#94a3b8;
  --accent:#00b7ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header{
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{font-weight:800}
button{
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary{
  background:transparent;
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
}
.container{
  max-width:1300px;
  margin:20px auto;
  padding:0 20px 40px;
  display:grid;
  grid-template-columns:1.25fr 1fr;
  gap:22px;
}
.left-viewer{
  background:#000;
  border-radius:14px;
  overflow:hidden;
  height:86vh;
  border:1px solid rgba(255,255,255,.08);
}
iframe{width:100%;height:100%;border:none}
.panel{
  background:var(--card);
  padding:22px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}
h2{margin:0 0 12px;font-size:20px}
.row{font-size:14px;margin:6px 0}
.muted{color:var(--muted)}
.severity-badge{
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
  margin-bottom:10px;
}
.severity-low{background:var(--low)}
.severity-moderate{background:var(--moderate)}
.severity-high{background:var(--high)}
.severity-critical{background:var(--critical)}
.section-title{
  margin-top:14px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.route-block{
  margin-top:10px;
  padding:12px 14px;
  border-radius:10px;
  background:#050a18;
  border-left:4px solid #334155;
}
.route-primary{border-left-color:#dc2626}
.route-secondary{border-left-color:#f59e0b}
.route-contextual{border-left-color:#64748b}
.cbc-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px dashed rgba(255,255,255,.06);
  font-size:14px;
}
.flag-high{color:var(--high);font-weight:700}
.flag-low{color:var(--moderate);font-weight:700}
textarea{
  width:100%;
  background:#050a18;
  color:var(--ink);
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  padding:10px 12px;
  font-family:inherit;
}
ul{margin:6px 0 0 18px;padding:0}
li{margin:4px 0;font-size:14px}
</style>
</head>

<body>

<header>
  <div class="brand">AMI Health — Artificial Medical Intelligence</div>
  <div>
    <button class="secondary" onclick="history.back()">← Back</button>
    <button class="primary" onclick="printAiOnly()">Print / Referral PDF</button>
  </div>
</header>

<div class="container">

  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Information</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Report Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>

    <div class="panel">
      <h2>Clinician Notes <span class="muted">(optional)</span></h2>
      <textarea id="clinicianNotes" rows="5"
        placeholder="Additional clinical context or referral notes..."></textarea>
      <div style="margin-top:10px;display:flex;gap:10px">
        <button class="secondary" id="dictateBtn">🎙 Dictate</button>
        <button class="primary" id="saveNotesBtn">Save Notes</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px">
        Notes are entered by the clinician and are not AI-generated.
      </div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

  </div>
</div>

<script type="module">
let SYSTEM_CLINICIAN_NAME = "";

/* =========================
   LOAD REPORT
   ========================= */
async function loadReport(){
  const id=new URLSearchParams(location.search).get("id");
  const res=await fetch(`/api/get-ai-report?id=${id}`);
  const json=await res.json();

  const rpt=json.report||{};
  const ai=rpt.ai_results||{};
  const patient=ai.patient||{};

  document.getElementById("name").textContent=patient.name||rpt.name||"—";
  document.getElementById("age").textContent=patient.age??rpt.age??"—";
  document.getElementById("sex").textContent=(()=>{
    const v=(patient.sex||rpt.sex||"").toLowerCase();
    if(v.startsWith("m"))return"Male";
    if(v.startsWith("f"))return"Female";
    return"—";
  })();
  document.getElementById("date").textContent=rpt.created_at
    ? new Date(rpt.created_at).toLocaleString()
    : "—";

  SYSTEM_CLINICIAN_NAME=json.user?.full_name||"";

  if(rpt.file_path){
    const f=await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj=await f.json();
    if(fj.url)document.getElementById("pdfFrame").src=fj.url;
  }

  renderAI(ai);
  renderCBC(ai);
}

/* =========================
   RENDER AI
   ========================= */
function renderAI(ai){
  const sev=ai._severity?.severity||"low";
  const summary=ai.primary_physiology_summary||"";
  const routes=ai._routes||[];
  const driver=ai._dominant_driver?.driver;

  document.getElementById("aiBox").innerHTML=`
    <div class="severity-badge severity-${sev}">${sev.toUpperCase()}</div>

    ${driver?`
      <div class="section-title">Primary Physiological Driver</div>
      <div class="row"><b>${driver}</b></div>`:""}

    ${summary?`
      <div class="section-title">Clinical Summary</div>
      <div class="row">${summary}</div>`:""}

    ${routes.length?`
      <div class="section-title">Clinical Routes</div>
      ${routes.map(r=>`
        <div class="route-block route-${r.priority||"secondary"}">
          <b>${r.pattern}</b><br/>
          ${r.route}
          ${r.next_steps?.length
            ? `<ul>${r.next_steps.map(s=>`<li>${s}</li>`).join("")}</ul>`
            : ""}
        </div>`).join("")}`:""}
  `;
}

/* =========================
   RENDER CBC
   ========================= */
function renderCBC(ai){
  const box=document.getElementById("cbcBox");
  if(!ai._canonical_cbc){box.innerHTML="";return;}
  const labs=ai._canonical_cbc;
  const keys=Object.keys(labs).filter(k=>!k.startsWith("_"));
  box.innerHTML=keys.map(k=>{
    const d=labs[k]||{};
    const v=+d.value,lo=+d.reference_low,hi=+d.reference_high;
    let cls="",arrow="";
    if(!isNaN(v)){
      if(!isNaN(hi)&&v>hi){cls="flag-high";arrow=" ↑";}
      else if(!isNaN(lo)&&v<lo){cls="flag-low";arrow=" ↓";}
    }
    return `<div class="cbc-row ${cls}">
      <span><b>${k}</b></span>
      <span>${d.value??""} ${d.units??""}${arrow}</span>
    </div>`;
  }).join("");
}

/* =========================
   VOICE DICTATION
   ========================= */
let recognition;
if("webkitSpeechRecognition"in window){
  recognition=new webkitSpeechRecognition();
  recognition.continuous=true;
  recognition.lang="en-ZA";
  recognition.onresult=e=>{
    let t="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      t+=e.results[i][0].transcript;
    }
    document.getElementById("clinicianNotes").value+=t+" ";
  };
}
document.getElementById("dictateBtn").onclick=()=>{
  if(!recognition){alert("Voice dictation not supported.");return;}
  recognition.start();
};

/* =========================
   SAVE NOTES
   ========================= */
document.getElementById("saveNotesBtn").onclick=async()=>{
  const id=new URLSearchParams(location.search).get("id");
  await fetch("/api/save-gp-notes",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,gp_notes:clinicianNotes.value})
  });
  alert("Clinician notes saved.");
};

/* =========================
   PRINT — REFERRAL GRADE
   ========================= */
window.printAiOnly=function(){
  const ai=document.getElementById("aiBox").innerHTML;
  const labs=document.getElementById("cbcBox").innerHTML;
  const notes=document.getElementById("clinicianNotes").value;
  const date=document.getElementById("date").textContent;
  const id=new URLSearchParams(location.search).get("id")||"";
  const qr=`https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=https://www.amihealth.co.za/verify?id=${id}`;

  const w=window.open("","_blank");
  w.document.write(`
<!doctype html><html><head><meta charset="utf-8"/>
<style>
body{font-family:Inter,system-ui;margin:40px;color:#111}
.header{display:flex;justify-content:space-between;border-bottom:2px solid #00a2ff;padding-bottom:10px}
.section{margin-top:20px}
.sig{margin-top:40px}
.sig-line{margin-top:30px;border-top:1px solid #333;width:260px}
.footer{margin-top:30px;font-size:10px;color:#555;display:flex;justify-content:space-between}
</style></head><body>

<div class="header">
  <div>
    <b>AMI Health — Artificial Medical Intelligence</b><br/>
    Clinical Prioritisation Report<br/>
    <span style="font-size:11px">www.amihealth.co.za</span>
  </div>
  <div>${date}</div>
</div>

<div class="section"><h3>AI Clinical Interpretation</h3>${ai}</div>
<div class="section"><h3>Laboratory Findings</h3>${labs}</div>

${notes.trim()?`<div class="section"><h3>Clinician Notes</h3>${notes.replace(/\n/g,"<br/>")}</div>`:""}

<div class="sig">
  <div><b>Clinician:</b> ${SYSTEM_CLINICIAN_NAME||"________________________"}</div>
  <div class="sig-line"></div>
  <div style="font-size:12px">Signature</div>
</div>

<div class="footer">
  <div>
    This report provides AI-assisted clinical prioritisation.<br/>
    It does not constitute a diagnosis and supports clinician judgement.
  </div>
  <div><img src="${qr}"/><br/>Verify report</div>
</div>

</body></html>`);
  w.document.close();w.print();
};

loadReport();
</script>

</body>
</html>
