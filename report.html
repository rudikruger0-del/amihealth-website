<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AMI Health — Clinical Referral</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
:root{
  --blue:#0ea5e9;
  --dark:#0f172a;
  --muted:#475569;
}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}
header{
  padding:18px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#02040e;
  color:#eaf6ff;
}
button{
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  height:85vh;
  border:1px solid #e5e7eb;
}
iframe{width:100%;height:100%;border:none;}
.panel{
  background:#fff;
  padding:18px 20px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-bottom:16px;
}
h2{
  margin:0 0 8px;
  font-size:17px;
  color:#02040e;
}
.row{font-size:14px;margin:3px 0;}
textarea{
  width:100%;
  min-height:90px;
  border:1px solid #cbd5f5;
  border-radius:8px;
  padding:10px;
  font-family:inherit;
  font-size:14px;
}
.small{font-size:12px;color:#64748b}

/* ================= PRINT ================= */
@media print{
  body{
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
    background:#fff;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <b>AMI Health</b><br/>
    <span class="small">Artificial Medical Intelligence</span>
  </div>
  <button class="primary" onclick="printReferral()">Print / Referral PDF</button>
</header>

<div class="container">

  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Information</h2>
      <div class="row"><b>Name:</b> <span id="pName">—</span></div>
      <div class="row"><b>Age:</b> <span id="pAge">—</span></div>
      <div class="row"><b>Sex:</b> <span id="pSex">—</span></div>
      <div class="row"><b>Report Date:</b> <span id="pDate">—</span></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>

    <div class="panel">
      <h2>Clinician Notes (optional)</h2>
      <textarea id="clinicianNotes"
        placeholder="Additional clinical context or referral notes…"></textarea>
      <div style="margin-top:10px;display:flex;gap:10px">
        <button onclick="startDictation()">🎙 Dictate</button>
        <button class="primary" onclick="saveNotes()">Save Notes</button>
      </div>
      <div class="small" style="margin-top:6px">
        Notes are clinician-entered and not AI-generated.
      </div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

  </div>
</div>

<script>
let REPORT={}, CLINICIAN={};

async function loadReport(){
  const id=new URLSearchParams(location.search).get("id");
  const res=await fetch(`/api/get-ai-report?id=${id}`);
  const json=await res.json();

  REPORT=json.report||{};
  const ai=REPORT.ai_results||{};
  const patient=ai.patient||{};
  CLINICIAN=REPORT.clinician||{};

  pName.textContent=patient.name||"—";
  pAge.textContent=patient.age??"—";
  pSex.textContent=patient.sex||"—";
  pDate.textContent=REPORT.created_at?new Date(REPORT.created_at).toLocaleString():"—";

  if(REPORT.file_path){
    const f=await fetch(`/api/get-file-url?path=${encodeURIComponent(REPORT.file_path)}`);
    const fj=await f.json();
    if(fj.url) pdfFrame.src=fj.url;
  }

  renderAI(ai);
  renderCBC(ai);
}
loadReport();

function renderAI(ai){
  aiBox.innerHTML=`
    <div class="row"><b style="color:#0ea5e9">${ai._severity?.severity?.toUpperCase()}</b></div><br/>
    <div class="row"><b>Primary Physiological Driver</b></div>
    <div class="row">${ai._dominant_driver?.driver}</div><br/>
    <div class="row"><b>Clinical Summary</b></div>
    <div class="row">${ai.summary?.impression}</div>
  `;
}

function renderCBC(ai){
  const labs=ai._canonical_cbc||{};
  cbcBox.innerHTML=Object.entries(labs)
    .filter(([k])=>!k.startsWith("_"))
    .map(([k,v])=>`<div class="row"><b>${k}</b>: ${v.value} ${v.units||""}</div>`)
    .join("");
}

/* ===== VOICE ===== */
let recognition;
function startDictation(){
  if(!("webkitSpeechRecognition"in window))return alert("Voice not supported");
  if(!recognition){
    recognition=new webkitSpeechRecognition();
    recognition.continuous=true;
    recognition.lang="en-ZA";
    recognition.onresult=e=>{
      let t="";
      for(let i=e.resultIndex;i<e.results.length;i++)
        t+=e.results[i][0].transcript;
      clinicianNotes.value+=t+" ";
    };
  }
  recognition.start();
}

/* ===== SAVE NOTES ===== */
async function saveNotes(){
  const id=new URLSearchParams(location.search).get("id");
  await fetch("/api/save-gp-notes",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,notes:clinicianNotes.value})
  });
  alert("Clinician notes saved");
}

/* ===== PRINT ===== */
function printReferral(){
  const id=new URLSearchParams(location.search).get("id");
  const qr=`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=https://amihealth.co.za/verify?id=${id}`;

  const w=window.open("","_blank");
  w.document.write(`
<html><head><style>
body{font-family:Inter;margin:40px;color:#111}
.header{border-bottom:3px solid #0ea5e9;padding-bottom:10px}
.small{font-size:11px;color:#555}
.section{margin-top:16px}
</style></head><body>

<div class="header">
<b>AMI Health — Artificial Medical Intelligence</b><br/>
<span class="small">Clinical Prioritisation Referral • www.amihealth.co.za</span>
</div>

<div class="section">
<b>Patient:</b> ${pName.textContent} | ${pAge.textContent} | ${pSex.textContent}<br/>
<b>Report Date:</b> ${pDate.textContent}
</div>

<div class="section">
<b>Referring Clinician:</b> ${CLINICIAN.name||"—"}<br/>
<b>Practice No:</b> ${CLINICIAN.practice_number||"—"}
</div>

<hr/>

${aiBox.innerHTML}

<div class="section"><b>Laboratory Findings</b><br/>${cbcBox.innerHTML}</div>

${clinicianNotes.value.trim()?`
<div class="section"><b>Clinician Notes</b><br/>${clinicianNotes.value}</div>`:""}

<div class="section">
<br/><br/>
<b>Signature:</b><br/>
_____________________________<br/>
<span class="small">${CLINICIAN.name||""}</span>
</div>

<div class="section">
<img src="${qr}"/><br/>
<span class="small">Verify report</span>
</div>

<div class="section small">
This report provides AI-assisted clinical prioritisation.  
It does not constitute a diagnosis and supports clinician judgement.
</div>

</body></html>`);
  w.print();
}
</script>

</body>
</html>
