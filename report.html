<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --bg:#02040e;
  --card:#0b1020;
  --muted:#96a0b8;
  --white:#eaf6ff;

  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}

body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--white);
}

header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,.08);
}

button {
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  border:none;
}

.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}

.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
}

.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}

.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,.08);
}

iframe { width:100%; height:100%; border:none; }

.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}

h2 { margin:0 0 10px; }

.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,.06);
}

.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }
.flag-normal { color:var(--white); }

.severity-badge {
  display:inline-block;
  padding:8px 16px;
  border-radius:999px;
  font-weight:900;
  margin-bottom:10px;
}

.severity-low { background:var(--low); }
.severity-moderate { background:var(--moderate); }
.severity-high { background:var(--high); }
.severity-critical { background:var(--critical); }

.section-title {
  margin-top:14px;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  opacity:.85;
}

.route-block {
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#050a18;
  border-left:5px solid #444;
}

.route-primary { border-left-color:var(--critical); }
.route-secondary { border-left-color:var(--moderate); }
.route-contextual { border-left-color:#60a5fa; }

.urgent {
  color:#fca5a5;
  font-weight:700;
}

ul { margin:6px 0 0 18px; padding:0; }
li { margin:4px 0; }
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button id="printBtn" class="primary">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div><b>Name:</b> <span id="name"></span></div>
      <div><b>Age:</b> <span id="age"></span></div>
      <div><b>Sex:</b> <span id="sex"></span></div>
      <div><b>Date:</b> <span id="date"></span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script type="module">
async function loadReport(){
  const id=new URLSearchParams(location.search).get("id");
  const res=await fetch(`/api/get-ai-report?id=${id}`);
  const json=await res.json();
  const rpt=json.report||{};
  const ai=rpt.ai_results||{};

  name.textContent=rpt.name??"—";
  age.textContent=rpt.age??"—";
  sex.textContent=rpt.sex??"—";
  date.textContent=rpt.created_at?new Date(rpt.created_at).toLocaleString():"—";

  if(rpt.file_path){
    const f=await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj=await f.json();
    if(fj.url) pdfFrame.src=fj.url;
  }

  renderCBC(ai);
  renderAI(ai);
}

function renderCBC(ai){
  const box=cbcBox;
  const labs=ai._canonical_cbc||{};
  const keys=Object.keys(labs).filter(k=>!k.startsWith("_"));

  if(!keys.length){
    box.innerHTML="No structured laboratory values available";
    return;
  }

  box.innerHTML=keys.map(k=>{
    const d=labs[k]||{};
    const v=Number(d.value), lo=Number(d.reference_low), hi=Number(d.reference_high);
    let cls="flag-normal", flag="";
    if(!isNaN(v)){
      if(!isNaN(hi)&&v>hi){cls="flag-high";flag=" ↑";}
      else if(!isNaN(lo)&&v<lo){cls="flag-low";flag=" ↓";}
    }
    return `<div class="cbc-row ${cls}">
      <b>${k}</b><span>${d.value??"—"} ${d.units??""}${flag}</span>
    </div>`;
  }).join("");
}

function renderAI(ai){
  const s=ai._severity||{};
  const routes=ai._routes||[];
  const diffs=ai._differential_trees||{};
  const flags=s.urgency_flags||[];

  aiBox.innerHTML=`
    <div class="severity-badge severity-${s.severity||"low"}">${(s.severity||"low").toUpperCase()}</div>

    ${flags.length?`
      <div class="section-title">Urgency Flags</div>
      <ul>${flags.map(f=>`<li class="urgent">${f.reason}</li>`).join("")}</ul>
    `:""}

    <div class="section-title">Clinical Reasoning & Routes</div>
    ${routes.map(r=>`
      <div class="route-block route-${r.priority}">
        <b>${r.pattern}</b><br>${r.route}
        ${r.next_steps?.length?`<ul>${r.next_steps.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}
      </div>
    `).join("")}

    ${Object.keys(diffs).length?`
      <div class="section-title">Differential Considerations</div>
      ${Object.entries(diffs).map(([k,v])=>`
        <b>${k}</b><ul>${v.map(x=>`<li>${x}</li>`).join("")}</ul>
      `).join("")}
    `:""}
  `;
}

printBtn.onclick=()=>window.print();
loadReport();
</script>
</body>
</html>
