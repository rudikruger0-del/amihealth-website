<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI Health — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --bg:#02040e;
  --card:#0b1020;
  --text:#eaf6ff;
  --muted:#94a3b8;
  --accent:#00b7ff;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}
header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}
.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}
iframe { width:100%; height:100%; border:none; }

.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}
h2 { margin:0 0 10px; font-size:18px; }
.row { font-size:14px; margin:4px 0; }

textarea {
  width:100%;
  min-height:90px;
  background:#050a18;
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:14px;
}
.small {
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<header>
  <div>
    <b>AMI Health — Artificial Medical Intelligence</b><br/>
    <span class="small">Clinical Prioritisation Report</span>
  </div>
  <button class="primary" onclick="printReferral()">Print / Referral PDF</button>
</header>

<div class="container">

  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Information</h2>
      <div class="row"><b>Name:</b> <span id="pName">—</span></div>
      <div class="row"><b>Age:</b> <span id="pAge">—</span></div>
      <div class="row"><b>Sex:</b> <span id="pSex">—</span></div>
      <div class="row"><b>Report Date:</b> <span id="pDate">—</span></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>

    <div class="panel">
      <h2>Clinician Notes (optional)</h2>
      <textarea id="clinicianNotes"
        placeholder="Additional clinical context or referral notes…"></textarea>

      <div style="margin-top:10px;display:flex;gap:10px">
        <button class="secondary" id="dictateBtn">🎙 Dictate</button>
        <button class="primary" onclick="saveNotes()">Save Notes</button>
      </div>

      <div class="small" style="margin-top:6px">
        Notes are entered by the clinician and are not AI-generated.
      </div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

  </div>
</div>

<script type="module">
let REPORT = {};
let CLINICIAN = {};

/* ================= LOAD REPORT ================= */
async function loadReport() {
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();

  REPORT = json.report || {};
  const ai = REPORT.ai_results || {};
  const patient = ai.patient || {};
  CLINICIAN = REPORT.clinician || {};

  document.getElementById("pName").textContent = patient.name || "—";
  document.getElementById("pAge").textContent = patient.age ?? "—";
  document.getElementById("pSex").textContent = patient.sex || "—";
  document.getElementById("pDate").textContent =
    REPORT.created_at ? new Date(REPORT.created_at).toLocaleString() : "—";

  if (REPORT.file_path) {
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(REPORT.file_path)}`);
    const fj = await f.json();
    if (fj.url) document.getElementById("pdfFrame").src = fj.url;
  }

  renderAI(ai);
  renderCBC(ai);
}
loadReport();

/* ================= RENDER AI ================= */
function renderAI(ai) {
  document.getElementById("aiBox").innerHTML = `
    <b>${ai._severity?.severity?.toUpperCase() || ""}</b><br/><br/>
    <b>Primary Physiological Driver</b><br/>
    ${ai._dominant_driver?.driver || "—"}<br/><br/>
    <b>Clinical Summary</b><br/>
    ${ai.summary?.impression || "—"}
  `;
}

/* ================= RENDER CBC ================= */
function renderCBC(ai) {
  const box = document.getElementById("cbcBox");
  const labs = ai._canonical_cbc || {};

  box.innerHTML = Object.entries(labs)
    .filter(([k]) => !k.startsWith("_"))
    .map(([k, v]) =>
      `<div class="row"><b>${k}</b>: ${v.value ?? "—"} ${v.units ?? ""}</div>`
    ).join("");
}

/* ================= VOICE DICTATION ================= */
(function () {
  if (!("webkitSpeechRecognition" in window)) return;

  const rec = new webkitSpeechRecognition();
  rec.continuous = true;
  rec.lang = "en-ZA";

  const box = document.getElementById("clinicianNotes");
  document.getElementById("dictateBtn").onclick = () => {
    try { rec.start(); } catch {}
  };

  rec.onresult = (e) => {
    let t = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      t += e.results[i][0].transcript;
    }
    box.value += t + " ";
  };
})();

/* ================= SAVE NOTES ================= */
async function saveNotes() {
  const id = new URLSearchParams(location.search).get("id");
  await fetch("/api/save-gp-notes", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, notes: clinicianNotes.value })
  });
  alert("Clinician notes saved.");
}

/* ================= PRINT ================= */
function printReferral() {
  const id = new URLSearchParams(location.search).get("id");
  const qr = `https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=https://amihealth.co.za/verify?id=${id}`;

  const w = window.open("", "_blank");
  w.document.write(`
<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>AMI Referral Report</title>
<style>
body{font-family:Inter,system-ui;margin:40px;font-size:13px;color:#111}
.header{border-bottom:2px solid #00b7ff;padding-bottom:10px;margin-bottom:14px}
.section{margin-top:16px}
.small{font-size:11px;color:#555}
</style>
</head>
<body>

<div class="header">
  <b>AMI Health — Artificial Medical Intelligence</b><br/>
  <span class="small">Clinical Prioritisation Report</span><br/>
  <span class="small">www.amihealth.co.za</span>
</div>

<div class="section">
  <b>Patient:</b> ${pName.textContent} |
  ${pAge.textContent} |
  ${pSex.textContent}<br/>
  <b>Report Date:</b> ${pDate.textContent}
</div>

<div class="section">
  <b>Clinician:</b> ${CLINICIAN.name || "—"}<br/>
  <b>Practice No:</b> ${CLINICIAN.practice_number || "—"}<br/>
  <b>Facility / Hospital:</b> ${CLINICIAN.facility_number || "—"}
</div>

<hr/>

<div class="section">
${document.getElementById("aiBox").innerHTML}
</div>

<div class="section">
<b>Laboratory Findings</b><br/>
${document.getElementById("cbcBox").innerHTML}
</div>

${clinicianNotes.value.trim() ? `
<div class="section">
<b>Clinician Notes</b><br/>
${clinicianNotes.value.replace(/\n/g,"<br/>")}
</div>` : ""}

<div class="section">
<img src="${qr}"/><br/>
<span class="small">Verify report</span>
</div>

<div class="section small">
This report provides AI-assisted clinical prioritisation.
It does not constitute a diagnosis and supports clinician judgement.
</div>

</body>
</html>
`);
  w.document.close();
  w.focus();
  w.print();
}
</script>

</body>
</html>
