<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI Health — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root{
  --bg:#02040e;
  --card:#0b1020;
  --white:#eaf6ff;
  --muted:#94a3b8;
  --accent:#00b7ff;
  --moderate:#f59e0b;
}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--white);
}
header{
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,.08);
}
button{
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
.primary{
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer{
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,.08);
}
iframe{width:100%;height:100%;border:none}
.panel{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}
h2{margin:0 0 10px;font-size:18px}
.row{margin:6px 0;font-size:14px}
.severity{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  background:var(--moderate);
  margin-bottom:10px;
}
.ai-route{
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed rgba(255,255,255,.15);
}
.ai-route-title{
  font-weight:700;
  margin-bottom:6px;
}
.ai-route-steps{
  padding-left:18px;
  margin:0;
}
.cbc-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,.06);
}
.flag-high{color:#fb923c;font-weight:700}
.flag-low{color:#fbbf24;font-weight:700}
textarea{
  width:100%;
  min-height:90px;
  background:#050a18;
  color:var(--white);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:12px;
}
.sig-pad{
  background:#fff;
  border-radius:6px;
  cursor:crosshair;
}
.sig-actions{
  margin-top:8px;
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<header>
  <div><b>AMI Health</b> — Artificial Medical Intelligence</div>
  <div>
    <button class="secondary" onclick="history.back()">← Back</button>
    <button class="primary" onclick="printReport()">Print / Save Report</button>
  </div>
</header>

<div class="container">

  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Information</h2>
      <div class="row"><b>Name:</b> <span id="pName">—</span></div>
      <div class="row"><b>Age:</b> <span id="pAge">—</span></div>
      <div class="row"><b>Sex:</b> <span id="pSex">—</span></div>
      <div class="row"><b>Report Date:</b> <span id="pDate">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>

    <!-- ✅ ADDED ACTION PANEL (ONLY ADDITION) -->
    <div class="panel" style="text-align:center">
      <button
        id="prepareRxBtn"
        class="primary"
        style="width:100%;font-size:16px;padding:14px 22px"
        onclick="preparePrescription(this)"
      >
        Prepare Prescription
      </button>
      <div style="margin-top:8px;font-size:12px;color:#f59e0b">
        ⚠️ Critical result — prompt clinical action recommended
      </div>
    </div>

    <div class="panel">
      <h2>Clinician Notes (optional)</h2>
      <textarea id="clinNotes" placeholder="Additional clinical context..."></textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="secondary" id="dictateBtn">🎙 Dictate</button>
      </div>
    </div>

    <div class="panel">
      <h2>Clinician Signature</h2>
      <canvas id="sigCanvas" class="sig-pad" width="420" height="140"></canvas>
      <div class="sig-actions">
        <button class="secondary" onclick="clearSignature()">Clear</button>
      </div>
      <div class="row" style="margin-top:10px">
        <b>Clinician:</b> <span id="clinicianName"></span><br/>
        <b>Practice No:</b> <span id="practiceNo"></span>
      </div>
    </div>

  </div>
</div>

<script>
// ================= CLINICIAN META =================
async function loadClinicianMeta(){
  try{
    const authKey = Object.keys(localStorage)
      .find(k => k.startsWith("sb-") && k.endsWith("-auth-token"));
    if(!authKey) return;

    const token = JSON.parse(localStorage.getItem(authKey))?.access_token;
    if(!token) return;

    const res = await fetch("/api/me",{
      headers:{ Authorization:"Bearer "+token }
    });
    if(!res.ok) return;

    const meta = await res.json();
    clinicianName.textContent = meta.clinician_name || "";
    practiceNo.textContent   = meta.practice_number || "";
  }catch(e){}
}
loadClinicianMeta();

// ================= LOAD REPORT =================
async function loadReport(){
  const id=new URLSearchParams(location.search).get("id");
  const res=await fetch(`/api/get-ai-report?id=${id}`);
  const json=await res.json();
  const rpt=json.report||{};
  const ai=rpt.ai_results||{};
  const p=ai.patient||{};

  pName.textContent=p.name||rpt.name||"—";
  pAge.textContent=p.age??rpt.age??"—";
  pSex.textContent=p.sex||rpt.sex||"—";
  pDate.textContent=rpt.created_at?new Date(rpt.created_at).toLocaleString():"—";

  if(rpt.file_path){
    const f=await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj=await f.json();
    if(fj.url) pdfFrame.src=fj.url;
  }

  renderCBC(ai);
  renderAI(ai);
}
loadReport();

// ================= AI =================
function renderAI(ai){
  const sev=ai._severity?.severity||"MODERATE";
  const routes=Array.isArray(ai._routes)?ai._routes:[];

  let html=`
    <div class="severity">${sev}</div>
    <div class="row"><b>${ai._dominant_driver?.driver||""}</b></div>
    <div class="row">${ai.summary?.impression||""}</div>
  `;

  routes.forEach(r=>{
    html+=`
      <div class="ai-route">
        <div class="ai-route-title">${r.route}</div>
        <ul class="ai-route-steps">
          ${r.next_steps.map(s=>`<li>${s}</li>`).join("")}
        </ul>
      </div>
    `;
  });

  aiBox.innerHTML=html;
}

// ================= CBC =================
function renderCBC(ai){
  const labs=ai._canonical_cbc||{};
  cbcBox.innerHTML=Object.keys(labs)
    .filter(k=>!k.startsWith("_"))
    .map(k=>{
      const d=labs[k];
      let cls="";
      if(d.value>d.reference_high)cls="flag-high";
      if(d.value<d.reference_low)cls="flag-low";
      return`
        <div class="cbc-row ${cls}">
          <span><b>${k}</b></span>
          <span>${d.value} ${d.units||""}</span>
        </div>
      `;
    }).join("");
}

// ================= VOICE =================
let recogniser;
if("webkitSpeechRecognition"in window){
  recogniser=new webkitSpeechRecognition();
  recogniser.continuous=true;
  recogniser.lang="en-ZA";
  recogniser.onresult=e=>{
    let t="";
    for(let i=e.resultIndex;i<e.results.length;i++)
      t+=e.results[i][0].transcript;
    clinNotes.value+=t+" ";
  };
}
dictateBtn.onclick=()=>recogniser?recogniser.start():alert("Voice not supported");

// ================= SIGNATURE =================
const canvas=sigCanvas;
const ctx=canvas.getContext("2d");
let drawing=false;

canvas.onpointerdown=e=>{
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
};
canvas.onpointermove=e=>{
  if(!drawing)return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
};
canvas.onpointerup=()=>drawing=false;
canvas.onpointerleave=()=>drawing=false;

function clearSignature(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// ================= PRESCRIPTION ACTION =================
function preparePrescription(btn){
  if(btn.disabled) return;

  btn.disabled = true;
  btn.textContent = "Preparing…";

  const id = new URLSearchParams(location.search).get("id");
  if(!id){
    alert("Report ID missing — cannot prepare prescription.");
    btn.disabled = false;
    btn.textContent = "Prepare Prescription";
    return;
  }

  window.location.href =
    `/prescription/write?report_id=${encodeURIComponent(id)}`;
}

// ================= PRINT =================
function printReport(){
  /* UNCHANGED — DO NOT MODIFY */
}
</script>

</body>
</html>
