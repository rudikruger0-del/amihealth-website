<script type="module">

let REPORT_DATA = null;
let PDF_URL = null;

async function loadReport(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const data = await res.json();

  REPORT_DATA = data.report;
  const rpt = REPORT_DATA;

  document.getElementById("name").textContent = rpt.name ?? "—";
  document.getElementById("age").textContent = rpt.age ?? "—";
  document.getElementById("sex").textContent = rpt.sex ?? "—";
  document.getElementById("date").textContent =
    rpt.created_at ? new Date(rpt.created_at).toLocaleString() : "—";

  if (rpt.file_path){
    const p = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const pj = await p.json();
    if (pj.url){
      PDF_URL = pj.url;
      document.getElementById("pdfFrame").src = pj.url;
      document.getElementById("downloadOriginalBtn").href = pj.url;
    }
  }

  renderCBC(rpt.ai_results);
  renderAI(rpt.ai_results);
}

// =======================
// CBC RENDERING — FIXED
// =======================
function renderCBC(ai){
  const box = document.getElementById("cbcContent");
  const per = ai?.routes?.per_analyte || {};

  if (!Object.keys(per).length){
    box.innerHTML =
      "<div class='row'>⚠️ CBC not available — interpretation limited to chemistry only</div>";
    return;
  }

  let html = "";

  Object.entries(per).forEach(([key, d]) => {
    if (!["Hb","WBC","Platelets","MCV","RDW","Neutrophils","Lymphocytes"].includes(key)) {
      return;
    }

    const value = d.value ?? "—";
    const units = d.units ?? "";
    const sev = d.severity ?? "normal";

    let cls = "flag-normal";
    let label = sev.toUpperCase();

    if (sev === "critical" || sev === "severe") cls = "flag-high";
    else if (sev === "moderate" || sev === "mild") cls = "flag-low";

    html += `
      <div class="row cbc-row ${cls}">
        <span><b>${key}</b></span>
        <span>${value} ${units} — ${label}</span>
      </div>
    `;
  });

  box.innerHTML = html || "<div class='row'>No CBC values detected</div>";
}

// =======================
// AI INTERPRETATION — FIXED
// =======================
function renderAI(ai){
  const box = document.getElementById("aiContent");

  const summary = ai?.summary || {};
  const sev = summary.severity_text || "clinically stable";

  const sevColor =
    sev.includes("critical") ? "#b91c1c" :
    sev.includes("severe") ? "#f97316" :
    sev.includes("moderate") ? "#f59e0b" :
    "#10b981";

  let html = `
    <div class="severity-badge" style="background:${sevColor}">
      ${sev.toUpperCase()}
    </div>
    <div class="ai-section-title">Summary</div>
    <div class="row">${summary.summary || "—"}</div>
  `;

  if (summary.suggested_follow_up?.length){
    html += `<div class="ai-section-title">Suggested follow-up</div>` +
      summary.suggested_follow_up.map(s=>`<div class="row">• ${s}</div>`).join("");
  }

  box.innerHTML = html;
}

document.getElementById("printAiBtn").addEventListener("click", () => window.print());
loadReport();

</script>
