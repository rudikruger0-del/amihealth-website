<script>
async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.querySelector("#aiText").textContent = "Missing report ID.";
    return;
  }

  // 1️⃣ GET AI REPORT + METADATA
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const report = await res.json();

  if (!report || report.error) {
    document.querySelector("#aiText").textContent = "Unable to load report.";
    return;
  }

  // Extract
  const status = report.status;
  const ai_results = report.results;
  const file_path = report.pdf_path;

  // 2️⃣ GET SIGNED PDF URL
  const pdfRes = await fetch("/api/get-file-url", {
    method: "POST",
    body: JSON.stringify({ file_path })
  });

  const pdfJson = await pdfRes.json();
  const pdfUrl = pdfJson.url;

  document.querySelector("#pdfFrame").src = pdfUrl;

  // 3️⃣ LOAD PATIENT INFO (you store these in DB)
  document.querySelector("#patientInfo").innerHTML = `
      <b>Name:</b> ${ai_results.name || "-"}<br>
      <b>Age:</b> ${ai_results.age || "-"}<br>
      <b>Sex:</b> ${ai_results.sex || "-"}<br>
      <b>Date:</b> ${new Date(ai_results.created_at).toLocaleString()}
  `;

  // 4️⃣ CBC TABLE
  const cbc = ai_results.cbc || {};
  let rows = `<tr><th>Test</th><th>Value</th></tr>`;
  for (const key in cbc) {
    rows += `<tr><td>${key}</td><td>${cbc[key]}</td></tr>`;
  }
  document.querySelector("#cbcTable").innerHTML = rows;

  // 5️⃣ AI TEXT
  document.querySelector("#aiText").textContent =
    ai_results?.analysis_text || "No AI output.";
}

loadReport();
</script>
