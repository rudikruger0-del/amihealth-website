<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#96a0b8;
      --accent:#00e0b8;
    }

    body {
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:#02040e;
      color:#eaf6ff;
    }

    header {
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#050a16;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    header img { height:40px; }

    #backBtn {
      color:#00d4ff;
      text-decoration:none;
      font-size:14px;
    }

    #pdfBtn {
      padding:10px 18px;
      border-radius:999px;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
      font-weight:700;
      border:none;
      cursor:pointer;
    }

    .container {
      max-width:1200px;
      margin:20px auto;
      padding:0 20px;
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:20px;
    }

    .left-viewer {
      background:#000;
      border-radius:12px;
      overflow:hidden;
      height:85vh;
    }
    iframe { width:100%; height:100%; border:none;}

    .panel {
      background:var(--card);
      padding:20px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.07);
      margin-bottom:18px;
    }

    h2 {
      margin-top:0;
      font-size:20px;
      font-weight:700;
    }

    .row { margin:4px 0; font-size:14px; }

    .risk-badge {
      display:inline-block;
      padding:4px 10px;
      border-radius:6px;
      font-size:13px;
      font-weight:700;
      margin-bottom:10px;
    }

    .high { background:#ff4e6a33; color:#ff4e6a; }
    .moderate { background:#ffb74d33; color:#ffb74d; }
    .low { background:#00e0b833; color:#00e0b8; }

    .section-title {
      margin-top:14px;
      font-weight:600;
      opacity:0.9;
    }

    .disclaimer {
      margin-top:20px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
      padding:10px;
    }
  </style>
</head>

<body>

<header>
  <a id="backBtn" href="/dashboard.html">← Back</a>
  <img src="/logo.png"/>
  <button id="pdfBtn">Print / Download PDF</button>
</header>

<div class="container">
  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel" id="patientPanel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">Loading…</span></div>
      <div class="row"><b>Age:</b> <span id="age">-</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">-</span></div>
      <div class="row"><b>Date:</b> <span id="date">-</span></div>
    </div>

    <div class="panel" id="cbcPanel">
      <h2>CBC Results</h2>
      <div id="cbcContent">Loading…</div>
    </div>

    <div class="panel" id="aiPanel">
      <h2>AI Interpretation</h2>
      <div id="aiContent">Loading…</div>
    </div>

    <div class="disclaimer">
      This AI interpretation is assistive and not a medical diagnosis.  
      Always consult a licensed medical professional for clinical decisions.
    </div>

  </div>
</div>

<script>
/** ---------------------------------------------
 *  LOAD REPORT DATA
 * --------------------------------------------- */
async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const data = await res.json();

  if (!data.ok) {
    document.getElementById("aiContent").textContent = "Report not found.";
    return;
  }

  const rpt = data.report;
  window.__AMI_REPORT__ = rpt; // stored for printing

  document.getElementById("name").textContent = rpt.name || "Unknown";
  document.getElementById("age").textContent = rpt.age || "-";
  document.getElementById("sex").textContent = rpt.sex || "-";
  document.getElementById("date").textContent =
    new Date(rpt.created_at).toLocaleString();

  // Load PDF
  const pdfRes = await fetch(
    `/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`
  );
  const pdfJson = await pdfRes.json();
  document.getElementById("pdfFrame").src = pdfJson.url;

  // CBC
  const cbc = rpt.ai_results?.cbc || [];
  const cbcBox = document.getElementById("cbcContent");

  if (cbc.length === 0) {
    cbcBox.textContent = "No CBC data.";
  } else {
    cbcBox.innerHTML = cbc.map(c => `
      <div class="row">
        <b>${c.analyte}:</b> ${c.value} ${c.units}
        <span style="opacity:0.7">(ref: ${c.reference_low}–${c.reference_high})</span>
      </div>
    `).join("");
  }

  // AI Interpretation
  renderAI(rpt.ai_results);
}

function renderAI(ai) {
  const box = document.getElementById("aiContent");
  if (!ai) return (box.textContent = "No AI data.");

  const risk = ai.risk_assessment?.overall_risk || "low";
  const badgeClass =
    risk === "high" ? "high" : risk === "moderate" ? "moderate" : "low";

  box.innerHTML = `
    <div class="risk-badge ${badgeClass}">${risk.toUpperCase()} RISK</div>

    <div class="section-title">Summary</div>
    <div>${(ai.summary || []).join("<br>")}</div>

    <div class="section-title">Flagged Results</div>
    <div>${
      (ai.flagged_results || [])
        .map(f =>
          `<b>${f.analyte}</b>: ${f.value} (${f.status}) — Ref: ${f.reference_low}-${f.reference_high}`
        )
        .join("<br>") || "None"
    }</div>

    <div class="section-title">Recommendations</div>
    <div>${(ai.recommendations || []).join("<br>") || "None"}</div>
  `;
}

/** ---------------------------------------------
 *  PRINT CLEAN REPORT (WHITE PAGE)
 * --------------------------------------------- */
function printCleanReport() {
  const rpt = window.__AMI_REPORT__;
  if (!rpt) return alert("Report missing");

  const ai = rpt.ai_results || {};
  const cbc = ai.cbc || [];

  const win = window.open("", "_blank");

  win.document.write(`
    <html>
    <head>
      <title>AMI Medical Report</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 40px; color:#000; }
        .header { text-align:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px; }
        .header img { height:60px; }

        .section-title { font-size:18px; font-weight:bold; margin-top:25px; margin-bottom:8px; }
        .row { margin:4px 0; font-size:14px; }

        table { width:100%; border-collapse:collapse; margin-top:10px; margin-bottom:20px; }
        th, td { border:1px solid #666; padding:6px; font-size:14px; }

        .disclaimer { margin-top:40px; font-size:10px; text-align:center; color:#444; }
      </style>
    </head>

    <body>
      <div class="header">
        <img src="/logo.png" />
        <h2>AMI Health — Medical AI Report</h2>
      </div>

      <div class="section-title">Patient Information</div>
      <div class="row"><b>Name:</b> ${rpt.name}</div>
      <div class="row"><b>Age:</b> ${rpt.age}</div>
      <div class="row"><b>Sex:</b> ${rpt.sex}</div>
      <div class="row"><b>Date:</b> ${new Date(rpt.created_at).toLocaleString()}</div>

      <div class="section-title">CBC Results</div>
      <table>
        <tr><th>Analyte</th><th>Value</th><th>Units</th><th>Reference Range</th></tr>
        ${cbc.map(c => `
          <tr>
            <td>${c.analyte}</td>
            <td>${c.value}</td>
            <td>${c.units}</td>
            <td>${c.reference_low} – ${c.reference_high}</td>
          </tr>
        `).join("")}
      </table>

      <div class="section-title">AI Interpretation</div>
      <div class="row"><b>Risk Level:</b> ${ai.risk_assessment?.overall_risk || "low"}</div>

      <div class="section-title">Summary</div>
      <div>${(ai.summary || []).join("<br>")}</div>

      <div class="section-title">Flagged Results</div>
      <div>${
        (ai.flagged_results || [])
          .map(f => `${f.analyte}: ${f.value} (${f.status})`)
          .join("<br>") || "None"
      }</div>

      <div class="section-title">Recommendations</div>
      <div>${(ai.recommendations || []).join("<br>") || "None"}</div>

      <div class="disclaimer">
        This AI interpretation is assistive and not a medical diagnosis.<br>
        Always consult a licensed medical professional for clinical decisions.
      </div>
    </body>
    </html>
  `);

  win.document.close();
  win.focus();
  win.print();
}

document.getElementById("pdfBtn").onclick = printCleanReport;

loadReport();
</script>

</body>
</html>
