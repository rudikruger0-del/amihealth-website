<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root{
  --bg:#030414;
  --card:#0b1020;
  --muted:#96a0b8;
  --accent:#00e0b8;
  --white:#eaf6ff;
  --low:#f59e0b;
  --high:#b91c1c;
}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#02040e;
  color:var(--white);
}
.panel{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}
.row{font-size:14px;margin:4px 0}
.cbc-row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
}
.flag-high{color:var(--high);font-weight:700}
.flag-low{color:var(--low);font-weight:600}
.flag-normal{color:#fff}
.severity-badge{
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  margin-bottom:12px;
  color:#001821;
}
</style>
</head>

<body>

<div class="container">
  <div class="panel">
    <h2>CBC Results</h2>
    <div id="cbcContent"></div>
  </div>

  <div class="panel">
    <h2>AI Interpretation</h2>
    <div id="aiContent"></div>
  </div>
</div>

<script>
function renderCBC(ai){
  const box = document.getElementById("cbcContent");
  const per = ai?.routes?.per_analyte || {};

  if (!Object.keys(per).length){
    box.innerHTML =
      "⚠️ CBC not available — interpretation limited to chemistry only";
    return;
  }

  let html = "";
  for (const [key,d] of Object.entries(per)){
    const v = d.value ?? "—";
    const u = d.units ?? "";
    const sev = d.severity ?? "normal";

    let cls="flag-normal", label="NORMAL";
    if (sev==="critical"){cls="flag-high";label="CRITICAL";}
    else if (sev==="severe"){cls="flag-high";label="SEVERE";}
    else if (sev==="moderate"){cls="flag-low";label="MODERATE";}
    else if (sev==="mild"){cls="flag-low";label="MILD";}

    html += `
      <div class="cbc-row ${cls}">
        <span><b>${key}</b></span>
        <span>${v} ${u} — ${label}</span>
      </div>
    `;
  }
  box.innerHTML = html;
}

function renderAI(ai){
  const box = document.getElementById("aiContent");
  const r = ai.routes || {};
  const s = ai.summary || {};

  const sev = s.severity_text || r.overall_severity || "clinically stable";

  const color =
    sev.includes("critical") ? "#b91c1c" :
    sev.includes("severe") ? "#f97316" :
    sev.includes("moderate") ? "#f59e0b" :
    "#10b981";

  let html = `
    <div class="severity-badge" style="background:${color}">
      ${sev.toUpperCase()}
    </div>
    <div class="row">${s.summary || r.summary || "—"}</div>
  `;

  if (s.suggested_follow_up?.length){
    html += "<div class='row'><b>Suggested follow-up:</b></div>";
    s.suggested_follow_up.forEach(x=>{
      html += `<div class="row">• ${x}</div>`;
    });
  }

  box.innerHTML = html;
}
</script>

</body>
</html>
