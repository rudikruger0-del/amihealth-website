<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root {
  --card:#0b1020;
  --white:#eaf6ff;
  --low:#10b981;
  --moderate:#f59e0b;
  --high:#f97316;
  --critical:#dc2626;
}
body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#02040e;
  color:var(--white);
}
header {
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
button {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary {
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
}
.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer {
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,0.08);
}
iframe { width:100%; height:100%; border:none; }
.panel {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:18px;
}
h2 { margin:0 0 10px; font-size:20px; }
.row { margin:6px 0; font-size:14px; }
.cbc-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.06);
}
.flag-high { color:var(--high); font-weight:700; }
.flag-low { color:var(--moderate); font-weight:700; }
.severity-badge {
  display:inline-flex;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  color:#fff;
}
.severity-low { background:var(--low); }
.severity-moderate { background:var(--moderate); }
.severity-high { background:var(--high); }
.severity-critical { background:var(--critical); }
.section-title {
  margin-top:14px;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
}
.route-block {
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#050a18;
  border-left:4px solid #444;
}
.route-primary { border-left-color:#dc2626; }
.route-secondary { border-left-color:#f59e0b; }
ul { margin:6px 0 0 18px; padding:0; }
li { margin:4px 0; font-size:14px; }
</style>
</head>

<body>

<header>
  <button class="secondary" onclick="history.back()">← Back</button>
  <button class="primary" onclick="printAiOnly()">Print / Save AI Report</button>
</header>

<div class="container">
  <div class="left-viewer"><iframe id="pdfFrame"></iframe></div>

  <div>
    <div class="panel">
      <h2>Patient Info</h2>
      <div class="row"><b>Name:</b> <span id="name">—</span></div>
      <div class="row"><b>Age:</b> <span id="age">—</span></div>
      <div class="row"><b>Sex:</b> <span id="sex">—</span></div>
      <div class="row"><b>Date:</b> <span id="date">—</span></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>

<script type="module">
async function loadReport(){
  const id = new URLSearchParams(location.search).get("id");
  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const json = await res.json();

  const rpt = json.report || {};
  const ai = rpt.ai_results || {};
  const patient = ai.patient || {};

  document.getElementById("name").textContent = patient.name || rpt.name || "—";
  document.getElementById("age").textContent = patient.age ?? rpt.age ?? "—";

  function cleanSex(v){
    if (!v) return null;
    const s = String(v).toLowerCase();
    if (s === "unknown" || s === "u") return null;
    if (s.startsWith("m")) return "Male";
    if (s.startsWith("f")) return "Female";
    return v;
  }

  document.getElementById("sex").textContent =
    cleanSex(patient.sex) ||
    cleanSex(patient.gender) ||
    cleanSex(rpt.sex) ||
    cleanSex(rpt.gender) ||
    "Unknown";

  document.getElementById("date").textContent =
    rpt.created_at ? new Date(rpt.created_at).toLocaleString() : "—";

  if (rpt.file_path){
    const f = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj = await f.json();
    if (fj.url) document.getElementById("pdfFrame").src = fj.url;
  }

  renderCBC(ai);
  renderAI(ai);
}

function renderCBC(ai){
  const box = document.getElementById("cbcBox");
  const labs = ai._canonical_cbc || {};
  const keys = Object.keys(labs).filter(k => !k.startsWith("_"));

  if (!keys.length){
    box.innerHTML = "<div class='row'>No structured laboratory values available</div>";
    return;
  }

  box.innerHTML = keys.map(k=>{
    const d=labs[k]||{};
    const val=Number(d.value),lo=Number(d.reference_low),hi=Number(d.reference_high);
    let cls="",arrow="";
    if(!isNaN(val)){
      if(!isNaN(hi)&&val>hi){cls="flag-high";arrow=" ↑";}
      else if(!isNaN(lo)&&val<lo){cls="flag-low";arrow=" ↓";}
    }
    return `<div class="cbc-row ${cls}">
      <span><b>${k}</b></span>
      <span>${d.value ?? "—"} ${d.units ?? ""}${arrow}</span>
    </div>`;
  }).join("");
}

function renderAI(ai){
  const box=document.getElementById("aiBox");
  const sev=ai._severity?.severity||"low";
  const summary=ai.summary?.impression||"—";
  const routes=ai._routes||[];

  box.innerHTML=`
    <div class="severity-badge severity-${sev}">${sev.toUpperCase()}</div>
    <div class="section-title">Summary</div>
    <div class="row">${summary}</div>
    ${routes.length?`
      <div class="section-title">Clinical Reasoning & Routes</div>
      ${routes.map(r=>`
        <div class="route-block route-${r.priority||"secondary"}">
          <b>${r.pattern}</b><br/>
          ${r.route}
          ${r.next_steps?.length?`<ul>${r.next_steps.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}
        </div>`).join("")}
    `:""}
  `;
}

loadReport();

/* ============================
   PRINT — AI ONLY (FIXED)
   ============================ */
window.printAiOnly = function(){
  const aiBox = document.getElementById("aiBox");
  if (!aiBox) return alert("AI not loaded");

  const date = document.getElementById("date")?.textContent || "";
  const id = new URLSearchParams(location.search).get("id") || "";
  const verifyUrl = `https://amihealth.co.za/verify?id=${encodeURIComponent(id)}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(verifyUrl)}`;

  const win = window.open("", "_blank");
  win.document.write(`
<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>AMI — AI Clinical Interpretation</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:40px;color:#111;font-size:13px}
.header{display:flex;justify-content:space-between;border-bottom:2px solid #0ea5e9;padding-bottom:10px;margin-bottom:16px}
.header-left{display:flex;gap:12px;align-items:center}
.header-left img{height:34px}
.header-title{font-size:18px;font-weight:700}
.header-sub{font-size:11px;color:#555}
.footer{margin-top:30px;font-size:10px;color:#555;display:flex;justify-content:space-between}
.signature-line{width:260px;border-bottom:1px solid #000;margin-top:20px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="/logo.png"/>
    <div>
      <div class="header-title">AMI Health — AI Clinical Interpretation</div>
      <div class="header-sub">Artificial Medical Intelligence (Pty) Ltd</div>
    </div>
  </div>
  <div style="font-size:11px">${date}</div>
</div>

${aiBox.innerHTML}

<div style="margin-top:30px">
  <div class="signature-line"></div>
  <div>Doctor signature & stamp</div>
</div>

<div class="footer">
  <div>
    This AI-generated interpretation supports clinical judgement and does not replace
    a medical diagnosis. Final decisions remain the responsibility of a licensed medical professional.
  </div>
  <div style="text-align:right">
    <div>Verify</div>
    <img src="${qrUrl}"/>
  </div>
</div>

</body>
</html>
  `);

  win.document.close();
  win.focus();
  win.print();
};
</script>

</body>
</html>
