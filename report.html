<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Report Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body {
    margin:0;
    font-family:Inter, sans-serif;
    background:#02030f;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  header {
    padding:16px 24px;
    background:#050919;
    border-bottom:1px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  header a {
    color:#00d4ff;
    text-decoration:none;
    font-weight:600;
  }

  .wrapper {
    display:flex;
    flex:1;
    overflow:hidden;
  }

  /* Left PDF viewer */
  .left {
    flex:1;
    background:black;
    border-right:1px solid rgba(255,255,255,0.1);
  }

  #pdfFrame {
    width:100%;
    height:100%;
    border:none;
  }

  /* Right side */
  .right {
    width:40%;
    background:#0b1020;
    padding:20px;
    overflow-y:auto;
  }

  .section {
    background:#0f162d;
    padding:16px;
    border-radius:10px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,0.08);
  }

  h2, h3 { margin-top:0; }

  table {
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:14px;
  }

  th, td {
    padding:6px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    text-align:left;
  }

  .ai-text {
    white-space:pre-wrap;
    font-size:14px;
  }

  .printBtn {
    padding:10px 20px;
    border-radius:999px;
    border:none;
    background:linear-gradient(90deg,#00e0b8,#00b7ff);
    font-weight:700;
    cursor:pointer;
    color:#001821;
  }

  @media print {
    header, .left { display:none; }
    .right { width:100%; background:white; color:black; }
    .section { background:white; color:black; border:none; }
  }
</style>
</head>

<body>

<header>
  <a href="/dashboard.html">← Back</a>
  <button class="printBtn" onclick="window.print()">Print Report</button>
</header>

<div class="wrapper">
  <div class="left">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div class="right">

    <div class="section">
      <h2>Patient Info</h2>
      <div id="patientInfo">Loading…</div>
    </div>

    <div class="section">
      <h3>CBC Results</h3>
      <table id="cbcTable"></table>
    </div>

    <div class="section">
      <h3>AI Interpretation</h3>
      <div id="aiText" class="ai-text">Loading…</div>
    </div>

  </div>
</div>

<script>
async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.querySelector("#aiText").textContent = "Missing report ID.";
    return;
  }

  /* Fetch report */
  let res = await fetch(`/api/get-ai-report?id=${id}`);
  if (!res.ok) {
    document.querySelector("#aiText").textContent = "Error loading report.";
    return;
  }

  const data = await res.json();
  const rpt = data.results;

  if (!rpt) {
    document.querySelector("#aiText").textContent = "Report not found.";
    return;
  }

  /* Fetch signed PDF URL */
  let pdfRes = await fetch("/api/get-file-url", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ file_path: rpt.file_path })
  });

  const pdfJson = await pdfRes.json();
  if (pdfJson?.url) {
    document.querySelector("#pdfFrame").src = pdfJson.url;
  } else {
    alert("Failed to load PDF.");
  }

  /* Fill patient info */
  document.querySelector("#patientInfo").innerHTML = `
    <b>Name:</b> ${rpt.name || "-"}<br>
    <b>Age:</b> ${rpt.age || "-"}<br>
    <b>Sex:</b> ${rpt.sex || "-"}<br>
    <b>Date:</b> ${new Date(rpt.created_at).toLocaleString()}
  `;

  /* CBC table */
  const cbc = rpt.cbc_json || {};
  let rows = "<tr><th>Test</th><th>Value</th></tr>";
  for (const key in cbc) {
    rows += `<tr><td>${key}</td><td>${cbc[key]}</td></tr>`;
  }
  document.querySelector("#cbcTable").innerHTML = rows;

  /* AI text with logo + disclaimer */
  const amiLogo = `
    <div style="text-align:center;margin-bottom:12px;">
      <img src="/assets/ami-logo.png" style="width:140px;opacity:0.9;">
    </div>
  `;

  const disclaimer = `
    <hr style="opacity:0.3;margin:16px 0;">
    <p style="font-size:13px;opacity:0.7;">
      <b>Disclaimer:</b> AMI provides AI-assisted medical interpretation.
      This is <u>not a diagnosis</u>. Medical decisions must be confirmed
      by a licensed healthcare professional.
    </p>
  `;

  document.querySelector("#aiText").innerHTML =
    amiLogo +
    (typeof rpt.ai_results === "string"
     ? rpt.ai_results
     : JSON.stringify(rpt.ai_results, null, 2)) +
    disclaimer;
}

loadReport();
</script>

</body>
</html>
