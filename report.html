<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI Health — Clinical Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
:root{
  --bg:#02040e;
  --card:#0b1020;
  --white:#eaf6ff;
  --muted:#94a3b8;
  --accent:#00b7ff;
  --moderate:#f59e0b;
}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--white);
}
header{
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#050a16;
  border-bottom:1px solid rgba(255,255,255,.08);
}
button{
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{
  background:linear-gradient(90deg,#00e0b8,#00b7ff);
  color:#001821;
}
.secondary{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 20px 30px;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}
.left-viewer{
  background:#000;
  border-radius:12px;
  overflow:hidden;
  height:85vh;
  border:1px solid rgba(255,255,255,.08);
}
iframe{width:100%;height:100%;border:none}
.panel{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}
h2{margin:0 0 10px;font-size:18px}
.row{margin:6px 0;font-size:14px}
.severity{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  background:var(--moderate);
  margin-bottom:10px;
}
.ai-route{
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed rgba(255,255,255,.15);
}
.ai-route-title{
  font-weight:700;
  margin-bottom:6px;
}
.ai-route-steps{
  padding-left:18px;
  margin:0;
}
.cbc-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,.06);
}
.flag-high{color:#fb923c;font-weight:700}
.flag-low{color:#fbbf24;font-weight:700}
textarea{
  width:100%;
  min-height:90px;
  background:#050a18;
  color:var(--white);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
}
</style>
</head>

<body>

<header>
  <div><b>AMI Health</b> — Artificial Medical Intelligence</div>
  <div>
    <button class="secondary" onclick="history.back()">← Back</button>
    <button class="primary" onclick="printReport()">Print / Save Report</button>
  </div>
</header>

<div class="container">

  <div class="left-viewer">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div>

    <div class="panel">
      <h2>Patient Information</h2>
      <div class="row"><b>Name:</b> <span id="pName">—</span></div>
      <div class="row"><b>Age:</b> <span id="pAge">—</span></div>
      <div class="row"><b>Sex:</b> <span id="pSex">—</span></div>
      <div class="row"><b>Report Date:</b> <span id="pDate">—</span></div>
    </div>

    <div class="panel">
      <h2>AI Clinical Interpretation</h2>
      <div id="aiBox"></div>
    </div>

    <div class="panel">
      <h2>Laboratory Findings</h2>
      <div id="cbcBox"></div>
    </div>

  </div>
</div>

<script>
// ================= LOAD REPORT =================
async function loadReport(){
  const id=new URLSearchParams(location.search).get("id");
  const res=await fetch(`/api/get-ai-report?id=${id}`);
  const json=await res.json();
  const rpt=json.report||{};
  const ai=rpt.ai_results||{};
  const p=ai.patient||{};

  pName.textContent=p.name||rpt.name||"—";
  pAge.textContent=p.age??rpt.age??"—";
  pSex.textContent=p.sex||rpt.sex||"—";
  pDate.textContent=rpt.created_at?new Date(rpt.created_at).toLocaleString():"—";

  if(rpt.file_path){
    const f=await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
    const fj=await f.json();
    if(fj.url) pdfFrame.src=fj.url;
  }

  renderAI(ai);
  renderCBC(ai);
}
loadReport();

// ================= AI =================
function renderAI(ai){
  const sev=ai._severity?.severity||"MODERATE";
  const routes=Array.isArray(ai._routes)?ai._routes:[];

  let html=`
    <div class="severity">${sev}</div>
    <div class="row"><b>${ai._dominant_driver?.driver||""}</b></div>
    <div class="row">${ai.summary?.impression||""}</div>
  `;

  routes.forEach(r=>{
    html+=`
      <div class="ai-route">
        <div class="ai-route-title">${r.route}</div>
        <ul class="ai-route-steps">
          ${r.next_steps.map(s=>`<li>${s}</li>`).join("")}
        </ul>
      </div>
    `;
  });

  aiBox.innerHTML=html;
}

// ================= CBC =================
function renderCBC(ai){
  const labs=ai._canonical_cbc||{};
  cbcBox.innerHTML=Object.keys(labs).filter(k=>!k.startsWith("_")).map(k=>{
    const d=labs[k];
    let cls="";
    if(d.value>d.reference_high)cls="flag-high";
    if(d.value<d.reference_low)cls="flag-low";
    return `<div class="cbc-row ${cls}">
      <span><b>${k}</b></span>
      <span>${d.value} ${d.units||""}</span>
    </div>`;
  }).join("");
}

// ================= PRINT =================
function printReport(){
  const id=new URLSearchParams(location.search).get("id")||"—";
  const qr=`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent("https://amihealth.co.za/verify?id="+id)}`;

  const w=window.open("","_blank");
  w.document.write(`
<!doctype html><html><head><meta charset="utf-8"/>
<style>
body{font-family:Inter,Arial;margin:40px;color:#111}
.header{display:flex;justify-content:space-between;border-bottom:3px solid #00b7ff;padding-bottom:12px}
.brand{font-size:20px;font-weight:800}
.sub{font-size:11px;color:#444}
.section{margin-top:22px}
.section h3{font-size:14px;margin-bottom:8px;text-transform:uppercase}
.patient-box{background:#f5f7fb;padding:12px;border-radius:6px;font-size:13px}
.footer{margin-top:40px;font-size:10px;color:#555;display:flex;justify-content:space-between}
</style></head><body>

<div class="header">
  <div>
    <div class="brand">AMI Health — Artificial Medical Intelligence</div>
    <div class="sub">https://amihealth.co.za · info@amihealth.co.za · Tel: +27 81 026 7352</div>
  </div>
  <div class="sub">Report ID: ${id}</div>
</div>

<div class="section">
  <h3>Patient Information</h3>
  <div class="patient-box">
    <b>Name:</b> ${pName.textContent}<br/>
    <b>Age:</b> ${pAge.textContent} &nbsp; <b>Sex:</b> ${pSex.textContent}<br/>
    <b>Date:</b> ${pDate.textContent}
  </div>
</div>

<div class="section">
  <h3>AI Clinical Interpretation</h3>
  ${aiBox.innerHTML}
</div>

<div class="section">
  <h3>Laboratory Findings</h3>
  ${cbcBox.innerHTML}
</div>

<div class="footer">
  <div>
    <b>Medicolegal Notice:</b><br/>
    This report provides AI-assisted clinical prioritisation only.
    It does not constitute a diagnosis or treatment recommendation.
    Clinical judgement remains the responsibility of the treating clinician.
  </div>
  <div>
    <img src="${qr}"><br/>Verify report
  </div>
</div>

</body></html>
`);
  w.document.close();w.print();
}
</script>

</body>
</html>
