<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMI — Report Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root {
    --bg:#030414;
    --card:#0b1020;
    --muted:#98a0b3;
    --accent:#00e0b8;
    --danger:#ff4d4d;
    --warning:#ffb347;
    --success:#4dff91;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    font-family:Inter, system-ui, sans-serif;
    background:#02030f;
    color:#eaf6ff;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  header {
    padding:14px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#050919;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }

  header a {
    color:#00d4ff;
    text-decoration:none;
    font-weight:600;
  }

  .wrapper {
    display:flex;
    flex:1;
    overflow:hidden;
  }

  .left {
    flex:1;
    min-width:55%;
    background:#000;
    border-right:1px solid rgba(255,255,255,0.1);
  }

  #pdfFrame {
    width:100%;
    height:100%;
    border:none;
  }

  .right {
    width:45%;
    padding:20px;
    overflow-y:auto;
    background:#0b1020;
  }

  .section {
    background:#0f162d;
    padding:18px;
    border-radius:10px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,0.08);
  }

  h2, h3, h4 {
    margin:0 0 10px;
  }

  .badge {
    display:inline-block;
    padding:5px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
  }
  .risk-high { background:var(--danger); color:#000; }
  .risk-moderate { background:var(--warning); color:#000; }
  .risk-low { background:var(--success); color:#000; }

  .list {
    margin:6px 0 0 0;
    padding-left:18px;
  }

  .disclaimer {
    margin-top:22px;
    font-size:12px;
    color:#abb4c7;
    opacity:0.7;
  }

  .logo {
    width:160px;
    margin-bottom:15px;
  }

  @media print {
    header, .left { display:none !important; }
    .right { width:100%; background:white; color:black; }
    .section { background:white; border:1px solid #ccc; }
    .badge { color:black !important; }
  }
</style>
</head>

<body>

<header>
  <a href="/dashboard.html">← Back</a>
  <button class="printBtn" onclick="window.print()">Print / Download PDF</button>
</header>

<div class="wrapper">

  <div class="left">
    <iframe id="pdfFrame"></iframe>
  </div>

  <div class="right">

    <img src="/logo.png" class="logo" alt="AMI Health Logo">

    <div class="section">
      <h2>Patient Info</h2>
      <div id="patientInfo">Loading…</div>
    </div>

    <div class="section">
      <h3>Flagged Results</h3>
      <div id="flagged"></div>
    </div>

    <div class="section">
      <h3>AI Interpretation</h3>
      <div id="aiSummary"></div>
    </div>

    <div class="section">
      <h3>Recommendations</h3>
      <div id="recommend"></div>
    </div>

    <div class="section disclaimer">
      <b>Disclaimer:</b>  
      This automated analysis is not a medical diagnosis.  
      All medical decisions must be confirmed by a licensed healthcare professional.
    </div>

  </div>
</div>

<script>
async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const res = await fetch(`/api/get-ai-report?id=${id}`);
  const data = await res.json();
  if (!data) return;

  const rpt = data.report || data;
  const ai = rpt.ai_results ? JSON.parse(rpt.ai_results) : null;

  // PDF LOAD
  try {
    const pdfRes = await fetch("/api/get-file-url", {
      method: "POST",
      body: JSON.stringify({ file_path: rpt.file_path }),
    });
    const pdfJson = await pdfRes.json();
    document.querySelector("#pdfFrame").src = pdfJson.url;
  } catch {
    alert("Failed to load PDF");
  }

  // Patient info
  document.querySelector("#patientInfo").innerHTML = `
    <b>Name:</b> ${rpt.name || "-"}<br>
    <b>Age:</b> ${rpt.age || "-"}<br>
    <b>Sex:</b> ${rpt.sex || "-"}<br>
    <b>Date:</b> ${new Date(rpt.created_at).toLocaleString()}
  `;

  if (!ai || !ai.json) return;

  const j = ai.json;

  // Risk badge
  const risk = j.risk_assessment?.overall_risk || "low";
  const riskBadge = `<span class="badge risk-${risk}">${risk}</span>`;

  // Summary
  document.querySelector("#aiSummary").innerHTML = `
    <h4>Overall Risk: ${riskBadge}</h4>
    <h4>Summary</h4>
    <ul class="list">
      ${j.summary.map(s => `<li>${s}</li>`).join("")}
    </ul>

    <h4>Trend Summary</h4>
    <ul class="list">
      ${j.trend_summary.map(s => `<li>${s}</li>`).join("")}
    </ul>
  `;

  // Flagged results
  document.querySelector("#flagged").innerHTML =
    j.flagged_results.length
      ? j.flagged_results.map(f => `
        <div style="margin-bottom:10px">
          <b>${f.test}</b><br>
          Value: ${f.value} (Ref: ${f.reference_range})<br>
          Status: <span class="badge risk-${f.status}">${f.status}</span><br>
          Trend: ${f.trend} (${f.severity})
        </div>
      `).join("")
      : "No flagged abnormalities detected.";

  // Recommendations
  document.querySelector("#recommend").innerHTML = `
    <ul class="list">
      ${j.recommendations.follow_up_tests.map(t => `<li>${t}</li>`).join("")}
      ${j.recommendations.trend_based_actions.map(t => `<li>${t}</li>`).join("")}
      ${j.recommendations.clinical_actions.map(t => `<li>${t}</li>`).join("")}
    </ul>
    <p><b>Urgent care:</b> ${j.recommendations.when_to_seek_urgent_care}</p>
  `;
}

loadReport();
</script>
</body>
</html>
