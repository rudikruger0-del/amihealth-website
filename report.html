<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMI — Report</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
    }

    body {
      margin:0;
      background:var(--bg);
      font-family:Inter, system-ui, sans-serif;
      color:#eaf6ff;
    }

    header {
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#020614;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    header img { height:40px; }

    .btn {
      padding:10px 16px;
      border-radius:12px;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
      color:#001821;
      border:none;
      font-weight:700;
      cursor:pointer;
    }

    .wrapper {
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:22px;
      padding:22px;
    }

    .panel {
      background:var(--card);
      padding:20px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
    }

    h2 { margin-top:0; font-size:20px; }
    pre {
      background:#06101f;
      padding:14px;
      border-radius:10px;
      overflow:auto;
      font-size:13px;
      color:#b8e9ff;
    }

    iframe {
      width:100%;
      height:85vh;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;
      background:#000;
    }

    .disclaimer {
      margin-top:20px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
      padding-bottom:50px;
    }
  </style>
</head>

<body>

<header>
  <a href="/dashboard.html" style="color:#00e0b8;text-decoration:none;font-weight:700;">← Back</a>
  <img src="/logo.png" alt="AMI Logo">
  <button class="btn" id="printBtn">Print / Download PDF</button>
</header>

<div class="wrapper">

  <!-- LEFT: ORIGINAL REPORT -->
  <div>
    <iframe id="pdfFrame"></iframe>
  </div>

  <!-- RIGHT: AI DATA -->
  <div>

    <div class="panel">
      <h2>Patient Info</h2>
      <div id="patientInfo">Loading…</div>
    </div>

    <div class="panel">
      <h2>CBC Results</h2>
      <pre id="cbcBox">Loading…</pre>
    </div>

    <div class="panel">
      <h2>AI Interpretation</h2>
      <pre id="aiBox">Loading…</pre>
    </div>

    <div class="disclaimer">
      This AI interpretation is assistive and not a medical diagnosis.
      Always consult a licensed medical professional for clinical decisions.
    </div>

  </div>

</div>

<script>
async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.getElementById("aiBox").textContent = "Missing report ID.";
    return;
  }

  console.log("Requesting:", `/api/get-ai-report?id=${id}`);

  // Get AI + CBC + metadata
  const res = await fetch(`/api/get-ai-report?id=${encodeURIComponent(id)}`);
  const data = await res.json();

  console.log("API returned:", data);

  if (!data.ok) {
    document.getElementById("aiBox").textContent = "Report not found.";
    return;
  }

  const rpt = data.report;

  document.getElementById("patientInfo").innerHTML = `
    <b>Name:</b> ${rpt.name || "-"}<br>
    <b>Age:</b> ${rpt.age || "-"}<br>
    <b>Sex:</b> ${rpt.sex || "-"}<br>
    <b>Date:</b> ${new Date(rpt.created_at).toLocaleString()}
  `;

  // Load CBC
  document.getElementById("cbcBox").textContent =
    rpt.cbc_json ? JSON.stringify(rpt.cbc_json, null, 2) : "No CBC data.";

  // Load AI results
  document.getElementById("aiBox").textContent =
    rpt.ai_results ? JSON.stringify(rpt.ai_results, null, 2) : "No AI results.";

  // Load PDF
  const pdfReq = await fetch(`/api/get-file-url?path=${encodeURIComponent(rpt.file_path)}`);
  const pdfData = await pdfReq.json();

  if (pdfData.url) {
    document.getElementById("pdfFrame").src = pdfData.url;
  } else {
    document.getElementById("pdfFrame").src = "";
  }
}

document.getElementById("printBtn").onclick = () => {
  document.getElementById("pdfFrame").contentWindow.print();
};

loadReport();
</script>

</body>
</html>
