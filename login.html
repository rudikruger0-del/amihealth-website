<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMI Clinician Login</title>

  <style>
    :root {
      --bg:#030414;
      --card:#0b1020;
      --muted:#98a0b3;
      --accent:#00e0b8;
      --radius:12px;
    }

    body {
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto;
      background:linear-gradient(180deg,#020214 0%, #07102a 100%);
      color:#e6eef8;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      -webkit-font-smoothing:antialiased;
      padding:16px;
    }

    .card {
      background:rgba(255,255,255,0.03);
      padding:32px;
      border-radius:var(--radius);
      width:100%;
      max-width:420px;
      text-align:center;
      box-shadow:0 6px 30px rgba(0,0,0,0.3);
    }

    .logo {
      width:80px;
      margin-bottom:12px;
    }

    h1 {
      font-size:24px;
      margin:0 0 16px;
      font-weight:800;
      color:#fff;
    }

    label {
      display:block;
      margin-top:16px;
      text-align:left;
      font-size:14px;
      color:var(--muted);
      font-weight:600;
    }

    input {
      width:100%;
      margin-top:6px;
      padding:12px;
      border-radius:8px;
      border:none;
      background:#0f1529;
      color:#fff;
      font-size:15px;
    }

    button {
      margin-top:22px;
      width:100%;
      padding:14px;
      background:linear-gradient(90deg,var(--accent),#00b3ff);
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      color:#001319;
    }

    .help {
      margin-top:16px;
      font-size:14px;
      color:var(--muted);
    }

    .help a {
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="/logo.png" class="logo">
    <h1>AMI Clinician Portal</h1>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@hospital.co.za">

    <label>Password</label>
    <input type="password" id="password">

    <button id="loginBtn">Login</button>

    <div class="help">
      Need access? Contact <a href="mailto:info@amihealth.co.za">info@amihealth.co.za</a>
    </div>
  </div>

  <script src="./lib/supabaseClient.js"></script>
  <script src="./api/login.js"></script>
</body>
</html>
