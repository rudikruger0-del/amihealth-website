<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMI Clinician Login</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 40%),
                  rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      box-shadow: 0 18px 70px rgba(0,0,0,0.65);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }

    .logo-wrap {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: radial-gradient(circle at 30% 0, #00e0b8, #0070f3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
    }

    .logo-wrap img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 16px;
      background: #020214;
      padding: 6px;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 18px;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 40px rgba(0,179,255,0.5);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: left;
      min-height: 18px;
    }

    .help {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .help button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      padding: 0;
    }

    /* --- NEW DOCTOR ACCESS FORM (slide-up modal) --- */
    .modal {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: rgba(6,10,30,0.97);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 24px;
      box-shadow: 0 -12px 60px rgba(0,0,0,0.5);
      transition: bottom 0.4s ease;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal.open {
      bottom: 0;
    }

    .modal h2 {
      margin-top: 0;
      text-align: center;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 26px;
      float: right;
      cursor: pointer;
    }

    .submit-access {
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <!-- LOGIN CARD -->
  <div class="card">
    <div class="logo-wrap"><img src="logo.png" alt="AMI Logo"></div>
    <h1>Clinician Login</h1>
    <div class="subtitle">Secure AI-assisted blood report analysis for clinicians.</div>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@hospital.co.za" />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <button id="loginBtn">Login</button>

    <div class="status" id="loginStatus"></div>

    <div class="help">
      Need access?
      <button id="openRequestForm">Request Access (Doctors Only)</button>
    </div>
  </div>


  <!-- DOCTOR ACCESS REQUEST MODAL -->
  <div class="modal" id="requestModal">

    <button class="close-btn" id="closeModal">&times;</button>
    <h2>Doctor Access Request</h2>

    <label>Title</label>
    <select id="title">
      <option value="">Select</option>
      <option>Dr</option>
      <option>Prof</option>
      <option>Mr</option>
      <option>Ms</option>
      <option>Mrs</option>
      <option>Other</option>
    </select>

    <label>Name</label>
    <input id="firstName" type="text" placeholder="First name">

    <label>Surname</label>
    <input id="lastName" type="text" placeholder="Last name">

    <label>Email</label>
    <input id="docEmail" type="email" placeholder="doctor@clinic.co.za">

    <label>Practice / MP Number</label>
    <input id="mpNumber" type="text" placeholder="MP 0XXXXX">

    <label>Clinic Name</label>
    <input id="clinicName" type="text" placeholder="Clinic / Practice Name">

    <label>Clinic Address</label>
    <textarea id="clinicAddress" placeholder="Street, suburb, town, postal code"></textarea>

    <div class="status" id="reqStatus"></div>
    <button class="submit-access" id="submitRequest">Submit Request</button>

  </div>


  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const loginStatus = document.getElementById("loginStatus");
    const reqStatus = document.getElementById("reqStatus");

    function setStatus(el, msg, cls="info") {
      el.textContent = msg;
      el.style.color = cls === "ok" ? "#7ef7d3" :
                       cls === "err" ? "#ff8f9b" : "#98a0b3";
    }

    /* --- LOGIN LOGIC --- */
    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        setStatus(loginStatus, "Please enter both email and password.", "err");
        return;
      }

      setStatus(loginStatus, "Signing in…");

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) return setStatus(loginStatus
