<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMI Clinician Login</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      box-shadow: 0 18px 70px rgba(0,0,0,0.65);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }

    h1 {
      margin: 10px 0 6px;
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(0,224,184,0.35);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    .status.err { color: #ff8f9b; }

    .links {
      margin-top: 16px;
      font-size: 13px;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Clinician Login</h1>
    <div class="subtitle">Secure AI-assisted blood report analysis</div>

    <input type="email" id="email" placeholder="you@hospital.co.za" />
    <input type="password" id="password" placeholder="••••••••" />

    <button id="loginBtn">Login</button>

    <!-- ✅ REQUEST ACCESS BUTTON (RESTORED) -->
    <button
      class="secondary-btn"
      onclick="window.location.href='/doctor-register.html'"
    >
      Request Access (Doctors Only)
    </button>

    <div class="status" id="status"></div>

    <div class="links">
      <a href="/forgot-password.html">Forgot password?</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("status");
    const btn = document.getElementById("loginBtn");

    btn.onclick = async () => {
      status.textContent = "";
      status.className = "status";
      btn.disabled = true;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value.trim(),
      });

      if (error) {
        status.textContent = error.message;
        status.className = "status err";
        btn.disabled = false;
        return;
      }

      /* ==================================================
         🔗 LINK EMAIL-INGESTED REPORTS (FIRE & FORGET)
         - Never blocks login
         - Silent failure
         ================================================== */
      if (data?.session?.access_token) {
        supabase.functions
          .invoke("link_reports_on_login", {
            headers: {
              Authorization: `Bearer ${data.session.access_token}`,
            },
          })
          .catch(() => {});
      }

      // ✅ Existing behaviour preserved
      window.location.href = "/dashboard.html";
    };
  </script>
</body>
</html>
