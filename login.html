<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMI Clinician Login</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 40%),
                  rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      box-shadow: 0 18px 70px rgba(0,0,0,0.65);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }

    .logo-wrap {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: radial-gradient(circle at 30% 0, #00e0b8, #0070f3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
    }

    .logo-wrap img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 16px;
      background: #020214;
      padding: 6px;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 18px;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: rgba(0,224,184,0.7);
      box-shadow: 0 0 0 1px rgba(0,224,184,0.4);
      background: #06091c;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 40px rgba(0,179,255,0.5);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: left;
      min-height: 18px;
    }

    .status.ok     { color: #7ef7d3; }
    .status.err    { color: #ff8f9b; }
    .status.info   { color: #98a0b3; }

    .help {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .help a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo-wrap">
      <img src="logo.png" alt="AMI Logo" />
    </div>

    <h1>Clinician Login</h1>
    <div class="subtitle">Secure AI-assisted blood report analysis for clinicians.</div>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@hospital.co.za" />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <button id="loginBtn">Login</button>
    <div class="status" id="loginStatus"></div>

    <div class="help">
      Need access? Email <a href="mailto:info@amihealth.co.za">info@amihealth.co.za</a>
    </div>
  </div>

  <!-- ONLY ONE LOGIN SCRIPT — CLEAN -->
  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("password");
    const btn = document.getElementById("loginBtn");
    const statusEl = document.getElementById("loginStatus");

    function setStatus(msg, type="info") {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    async function signIn() {
      const email = emailInput.value.trim();
      const password = passInput.value.trim();

      if (!email || !password) {
        setStatus("Please enter both email and password.", "err");
        return;
      }

      btn.disabled = true;
      setStatus("Signing in…", "info");

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      if (error) {
        setStatus("Login failed: " + error.message, "err");
        btn.disabled = false;
        return;
      }

      if (!data.session) {
        setStatus("No session returned from Supabase.", "err");
        btn.disabled = false;
        return;
      }

      setStatus("Login successful. Redirecting…", "ok");
      window.location.href = "/dashboard.html";
    }

    btn.addEventListener("click", signIn);
    emailInput.addEventListener("keydown", e => e.key==="Enter" && signIn());
    passInput.addEventListener("keydown", e => e.key==="Enter" && signIn());
  </script>

</body>
</html>
