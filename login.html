<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinician Login — AMI</title>

  <style>
    body {
      margin:0;
      font-family:Inter,system-ui;
      background:#020214;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
    }
    .card {
      background:#0b1020cc;
      padding:32px;
      border-radius:12px;
      width:400px;
      text-align:center;
    }
    input {
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:8px;
      background:#111829;
      color:white;
    }
    button {
      margin-top:24px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,#00e0b8,#00b3ff);
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      color:#001319;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Clinician Login</h1>

  <input id="email" type="email" placeholder="you@hospital.co.za">
  <input id="password" type="password" placeholder="••••••••">

  <button id="loginBtn">Login</button>
</div>

<script type="module">
  import { supabase } from "./lib/supabaseClient.js";

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      alert("Enter email + password");
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    window.location.href = "/dashboard.html";
  };
</script>

</body>
</html>
