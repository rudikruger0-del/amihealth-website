<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMI Clinician Login</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 40%),
                  rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      box-shadow: 0 18px 70px rgba(0,0,0,0.65);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }

    .logo-wrap {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: radial-gradient(circle at 30% 0, #00e0b8, #0070f3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
    }

    .logo-wrap img {
      width: 64px;
      height: 64px;
      background: #020214;
      border-radius: 16px;
      padding: 6px;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .forgot {
      margin-top: 12px;
      font-size: 13px;
      color: var(--accent-2);
      cursor: pointer;
    }

    .request-btn {
      margin-top: 18px;
      padding: 10px;
      font-size: 14px;
      color: var(--accent);
      border: 1px solid var(--accent);
      background: transparent;
      border-radius: 999px;
      cursor: pointer;
      width: 100%;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="logo.png" alt="AMI Logo" />
    </div>

    <h1>Clinician Login</h1>
    <div class="subtitle">Secure AI-assisted blood report analysis for clinicians.</div>

    <label>Email</label>
    <input type="email" id="email" />

    <label>Password</label>
    <input type="password" id="password" />

    <button id="loginBtn">Login</button>
    <div class="forgot" id="forgotPass">Forgot Password?</div>
    <div class="status" id="loginStatus"></div>

    <button class="request-btn" id="requestAccessBtn">Request Access (Doctors Only)</button>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const statusEl = document.getElementById("loginStatus");

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function linkReports(session) {
      if (!session?.access_token) return;
      await fetch(
        "https://tbyttsfztuudyqbrkonm.functions.supabase.co/link_reports_on_login",
        {
          headers: {
            Authorization: `Bearer ${session.access_token}`,
          },
        }
      );
    }

    // ✅ AUTO-LOGIN FIX
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await linkReports(session);
        window.location.href = "/dashboard.html";
      }
    })();

    async function signIn() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) return setStatus("Missing email or password");

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return setStatus(error.message);

      await linkReports(data.session);
      window.location.href = "/dashboard.html";
    }

    document.getElementById("loginBtn").addEventListener("click", signIn);
    document.getElementById("requestAccessBtn").onclick = () =>
      window.location.href = "/doctor-register.html";
  </script>
</body>
</html>
