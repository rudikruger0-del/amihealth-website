<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMI Admin – Doctor Approvals</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #050818;
      color: #e6eef8;
      padding: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .sub {
      color: #9ca3af;
      margin-bottom: 20px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0b1020;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      text-align: left;
    }

    th {
      background: #101736;
      font-weight: 600;
      color: #9ca3af;
    }

    button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-approve {
      background: #00e0b8;
      color: #001319;
    }

    .btn-reject {
      background: #f97373;
      color: #111827;
      margin-left: 6px;
    }

    .btn-reset {
      background: #60a5fa;
      color: #0f172a;
      margin-left: 6px;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    .status.ok { color:#7ef7d3; }
    .status.err { color:#ff8f9b; }
  </style>
</head>

<body>
  <h1>Doctor Access Approvals</h1>
  <div class="sub">
    Only visible to admin. Approve, reject, or reset password for doctors.
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Practice #</th>
        <th>Clinic</th>
        <th>Requested</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="6">Loading…</td></tr>
    </tbody>
  </table>

  <div class="status" id="status"></div>

  <script type="module" src="/admin.js"></script>

</body>
</html>
