<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMI Admin – Doctor Approvals</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #050818;
      color: #e6eef8;
      padding: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .sub {
      color: #9ca3af;
      margin-bottom: 20px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0b1020;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      text-align: left;
    }

    th {
      background: #101736;
      font-weight: 600;
      color: #9ca3af;
    }

    tr:last-child td {
      border-bottom: none;
    }

    button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-approve {
      background: #00e0b8;
      color: #001319;
    }

    .btn-reject {
      background: #f97373;
      color: #111827;
      margin-left: 6px;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    .status.ok { color:#7ef7d3; }
    .status.err { color:#ff8f9b; }
  </style>
</head>

<body>
  <h1>Doctor Access Approvals</h1>
  <div class="sub">
    Only visible to admin. Approve a doctor to create their AMI login account.
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Practice #</th>
        <th>Clinic</th>
        <th>Requested</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="6">Loading…</td></tr>
    </tbody>
  </table>

  <div class="status" id="status"></div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const ADMIN_EMAIL = "rudikruger708@icloud.com"; // 🔁 change this

    const statusEl = document.getElementById("status");
    const rowsEl = document.getElementById("rows");

    function setStatus(msg, type="info") {
      statusEl.textContent = msg;
      statusEl.className = "status " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
    }

    // Auth guard – only you
    let accessToken = null;

    async function requireAdmin() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session) {
        alert("Please log in first.");
        window.location.href = "/login.html";
        return null;
      }

      if (session.user.email !== ADMIN_EMAIL) {
        alert("Access denied.");
        window.location.href = "/login.html";
        return null;
      }

      accessToken = session.access_token;
      return session;
    }

    async function loadPending() {
      setStatus("Loading pending doctors…");
      rowsEl.innerHTML = `<tr><td colspan="6">Loading…</td></tr>`;

      const res = await fetch("/api/admin-get-pending", {
        headers: {
          Authorization: "Bearer " + accessToken,
        },
      });

      if (!res.ok) {
        setStatus("Failed to load pending doctors.", "err");
        rowsEl.innerHTML = `<tr><td colspan="6">Error.</td></tr>`;
        return;
      }

      const json = await res.json();
      const list = json.pending || [];

      if (!list.length) {
        rowsEl.innerHTML = `<tr><td colspan="6">No pending requests.</td></tr>`;
        setStatus("No pending doctors.");
        return;
      }

      rowsEl.innerHTML = "";
      list.forEach(doc => {
        const tr = document.createElement("tr");
        const created = doc.created_at ? new Date(doc.created_at).toLocaleString() : "-";

        tr.innerHTML = `
          <td>${doc.full_name || "-"}</td>
          <td>${doc.email || "-"}</td>
          <td>${doc.practice_number || "-"}</td>
          <td>${doc.clinic_name || "-"}</td>
          <td>${created}</td>
          <td>
            <button class="btn-approve" data-id="${doc.id}">Approve</button>
            <button class="btn-reject" data-id="${doc.id}">Reject</button>
          </td>
        `;

        rowsEl.appendChild(tr);
      });

      attachRowHandlers();
      setStatus("Loaded.");
    }

    function attachRowHandlers() {
      document.querySelectorAll(".btn-approve").forEach(btn => {
        btn.onclick = () => approveDoctor(btn.dataset.id);
      });
      document.querySelectorAll(".btn-reject").forEach(btn => {
        btn.onclick = () => rejectDoctor(btn.dataset.id);
      });
    }

    async function approveDoctor(id) {
      if (!confirm("Approve this doctor and create a login account?")) return;

      setStatus("Approving doctor…");
      const res = await fetch("/api/admin-approve-doctor", {
        method: "POST",
        headers: {
          "Content-Type":"application/json",
          Authorization: "Bearer " + accessToken,
        },
        body: JSON.stringify({ id }),
      });

      const json = await res.json();
      if (!res.ok || !json.ok) {
        setStatus("Approve failed: " + (json.error || "Unknown error"), "err");
        return;
      }

      // You can see the temp password in console if needed
      console.log("New doctor login:", json);
      setStatus("Doctor approved. A temporary password was generated.", "ok");
      loadPending();
    }

    async function rejectDoctor(id) {
      if (!confirm("Reject this doctor request?")) return;

      setStatus("Rejecting doctor…");
      const res = await fetch("/api/admin-reject-doctor", {
        method: "POST",
        headers: {
          "Content-Type":"application/json",
          Authorization: "Bearer " + accessToken,
        },
        body: JSON.stringify({ id }),
      });

      const json = await res.json();
      if (!res.ok || !json.ok) {
        setStatus("Reject failed: " + (json.error || "Unknown error"), "err");
        return;
      }

      setStatus("Doctor rejected.", "ok");
      loadPending();
    }

    // Init
    (async () => {
      const session = await requireAdmin();
      if (!session) return;
      loadPending();
    })();
  </script>

</body>
</html>
