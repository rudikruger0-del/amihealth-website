<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AMI Health — Write Prescription</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    :root {
      --bg:#02040e;
      --card:#0b1020;
      --muted:#94a3b8;
      --text:#eaf6ff;
      --accent:#00b7ff;
      --danger:#fda4af;
      --danger-bg:rgba(244,63,94,.12);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Inter,system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    header {
      padding:16px 24px;
      background:#050a16;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }

    .page {
      max-width:1100px;
      margin:20px auto;
      padding:0 20px 24px;
      display:grid;
      grid-template-columns:320px 1fr;
      gap:20px;
    }

    .panel {
      background:var(--card);
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px;
      padding:18px;
    }

    .patient-row {
      margin:10px 0;
      font-size:14px;
      color:var(--muted);
    }

    .patient-row b {
      color:var(--text);
      display:block;
      font-size:12px;
      margin-bottom:2px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .editor-wrap {
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    textarea {
      width:100%;
      min-height:58vh;
      resize:vertical;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:#050a18;
      color:var(--text);
      padding:16px;
      line-height:1.6;
      font-size:16px;
      outline:none;
    }

    textarea:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 2px rgba(0,183,255,.25);
    }

    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    button {
      border:none;
      border-radius:999px;
      cursor:pointer;
      padding:10px 16px;
      font-weight:600;
      color:#001821;
      background:linear-gradient(90deg,#00e0b8,#00b7ff);
    }

    button.secondary {
      color:var(--text);
      background:transparent;
      border:1px solid rgba(255,255,255,.3);
    }

    button:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .error {
      display:none;
      background:var(--danger-bg);
      border:1px solid rgba(244,63,94,.55);
      color:var(--danger);
      border-radius:10px;
      padding:10px 12px;
      font-size:14px;
    }

    .viewer {
      display:none;
      margin-top:14px;
      height:72vh;
      border:1px solid rgba(255,255,255,.1);
      border-radius:12px;
      overflow:hidden;
      background:#000;
    }

    iframe { width:100%; height:100%; border:none; }

    .status {
      font-size:13px;
      color:var(--muted);
    }

    @media (max-width: 900px) {
      .page { grid-template-columns:1fr; }
      textarea { min-height:45vh; }
    }
  </style>
</head>
<body>
  <header>
    <div><b>AMI Health</b> — Prescription Editor</div>
    <button class="secondary" onclick="history.back()">← Back</button>
  </header>

  <main class="page">
    <section class="panel">
      <h2>Patient Context</h2>
      <div class="patient-row"><b>Report ID</b><span id="reportId">—</span></div>
      <div class="patient-row"><b>Patient Name</b><span id="patientName">—</span></div>
      <div class="patient-row"><b>Date of Birth</b><span id="patientDob">—</span></div>
      <div class="patient-row"><b>Patient ID</b><span id="patientId">—</span></div>
      <div class="patient-row"><b>Report Date</b><span id="reportDate">—</span></div>
    </section>

    <section class="panel editor-wrap">
      <h2>Prescription Content</h2>
      <div class="status">Write or dictate free-text prescription instructions. Dictation appends to your existing notes.</div>
      <div class="error" id="errorBox"></div>
      <textarea id="prescriptionText" placeholder="Type prescription details, dosage instructions, and clinical notes here..."></textarea>

      <div class="actions">
        <button type="button" class="secondary" id="dictationBtn">🎙 Start Dictation</button>
        <button type="button" class="secondary" id="clearBtn">Clear Dictation</button>
        <button type="button" id="submitBtn">Finalize &amp; Sign</button>
      </div>

      <div class="viewer" id="pdfViewer">
        <iframe id="pdfFrame" title="Prescription PDF"></iframe>
      </div>
    </section>
  </main>

  <script>
    const reportId = new URLSearchParams(location.search).get("report_id");
    const prescriptionText = document.getElementById("prescriptionText");
    const dictationBtn = document.getElementById("dictationBtn");
    const clearBtn = document.getElementById("clearBtn");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");
    const viewer = document.getElementById("pdfViewer");
    const pdfFrame = document.getElementById("pdfFrame");

    document.getElementById("reportId").textContent = reportId || "—";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognizer = SpeechRecognition ? new SpeechRecognition() : null;
    let isDictating = false;

    if (recognizer) {
      recognizer.continuous = true;
      recognizer.interimResults = false;
      recognizer.lang = "en-US";

      recognizer.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          transcript += event.results[i][0].transcript;
        }
        if (transcript.trim()) {
          prescriptionText.value += `${prescriptionText.value.trim() ? " " : ""}${transcript.trim()}`;
        }
      };

      recognizer.onend = () => {
        if (isDictating) {
          recognizer.start();
        }
      };
    } else {
      dictationBtn.disabled = true;
      dictationBtn.textContent = "Dictation Unavailable";
    }

    dictationBtn.addEventListener("click", () => {
      hideError();
      if (!recognizer) {
        showError("Voice dictation is not supported in this browser.");
        return;
      }

      if (isDictating) {
        isDictating = false;
        recognizer.stop();
        dictationBtn.textContent = "🎙 Start Dictation";
        return;
      }

      try {
        isDictating = true;
        recognizer.start();
        dictationBtn.textContent = "⏹ Stop Dictation";
      } catch (error) {
        showError("Could not start dictation. Please allow microphone access and try again.");
      }
    });

    clearBtn.addEventListener("click", () => {
      prescriptionText.value = "";
      hideError();
    });

    submitBtn.addEventListener("click", submitPrescription);

    async function submitPrescription() {
      hideError();

      if (!reportId) {
        showError("Missing report ID. Open this page from a report and try again.");
        return;
      }

      const content = prescriptionText.value.trim();
      if (!content) {
        showError("Please add prescription text before finalizing.");
        return;
      }

      const token = getAuthToken();
      if (!token) {
        showError("You are not logged in. Please sign in again.");
        return;
      }

      setSubmitting(true);

      try {
        let result;

        if (isCodexPreviewMode()) {
          result = buildPreviewMockResponse();
        } else {
          const response = await fetch("/api/prescription/submit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              report_id: reportId,
              prescription_text: content
            })
          });

          const contentType = response.headers.get("content-type") || "";
          if (!contentType.toLowerCase().includes("application/json")) {
            throw new Error(
              "Prescription service is unavailable in this environment. Please retry in deployed app."
            );
          }

          result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not finalize and sign prescription.");
          }
        }

        if (!result.signed_pdf_url) {
          showError("Prescription PDF URL missing from response.");
          return;
        }

        pdfFrame.src = result.signed_pdf_url;
        viewer.style.display = "block";
      } catch (error) {
        showError(error.message || "Unexpected error. Please try again.");
      } finally {
        setSubmitting(false);
      }
    }

    function isCodexPreviewMode() {
      const host = (window.location.hostname || "").toLowerCase();
      const search = new URLSearchParams(window.location.search);

      if (search.get("preview_mock") === "1") return true;
      return host.includes("codex");
    }

    function buildPreviewMockResponse() {
      return {
        signed_pdf_url:
          "data:application/pdf;base64,JVBERi0xLjQKJcTl8uXrp/Og0MTGCjEgMCBvYmoKPDwKL1R5cGUgL0NhdGFsb2cKL1BhZ2VzIDIgMCBSCj4+CmVuZG9iagoyIDAgb2JqCjw8Ci9UeXBlIC9QYWdlcwovS2lkcyBbMyAwIFJdCi9Db3VudCAxCj4+CmVuZG9iagozIDAgb2JqCjw8Ci9UeXBlIC9QYWdlCi9QYXJlbnQgMiAwIFIKL01lZGlhQm94IFswIDAgNTk1IDg0Ml0KL0NvbnRlbnRzIDQgMCBSCi9SZXNvdXJjZXMgPDwKPj4KPj4KZW5kb2JqCjQgMCBvYmoKPDwKL0xlbmd0aCA3Mgo+PgpzdHJlYW0KQlQKL0YxIDI0IFRmCjcyIDc2MCBUZAooUHJldmlldyBNb2NrIFByZXNjcmlwdGlvbiBQREYpIFRqCkVUCmVuZHN0cmVhbQplbmRvYmoKeHJlZgowIDUKMDAwMDAwMDAwMCA2NTUzNSBmIAowMDAwMDAwMDEwIDAwMDAwIG4gCjAwMDAwMDAwNjAgMDAwMDAgbiAKMDAwMDAwMDExNyAwMDAwMCBuIAowMDAwMDAwMjExIDAwMDAwIG4gCnRyYWlsZXIKPDwKL1Jvb3QgMSAwIFIKL1NpemUgNQo+PgpzdGFydHhyZWYKMzAzCiUlRU9G"
      };
    }

    function getAuthToken() {
      const authKey = Object.keys(localStorage)
        .find((key) => key.startsWith("sb-") && key.endsWith("-auth-token"));

      if (!authKey) return null;
      return JSON.parse(localStorage.getItem(authKey) || "null")?.access_token || null;
    }

    async function loadPatientContext() {
      if (!reportId) {
        showError("Missing report_id in URL.");
        return;
      }

      try {
        const response = await fetch(`/api/get-ai-report?id=${encodeURIComponent(reportId)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to load patient context.");
        }

        const report = data.report || {};
        const patient = report.ai_results?.patient || {};

        document.getElementById("patientName").textContent = patient.name || report.name || "—";
        document.getElementById("patientDob").textContent = patient.dob || patient.date_of_birth || report.dob || "—";
        document.getElementById("patientId").textContent = patient.patient_id || report.patient_id || reportId;
        document.getElementById("reportDate").textContent = report.created_at
          ? new Date(report.created_at).toLocaleString()
          : "—";
      } catch (error) {
        showError(error.message || "Unable to load patient information.");
      }
    }

    function setSubmitting(loading) {
      submitBtn.disabled = loading;
      dictationBtn.disabled = loading || !recognizer;
      clearBtn.disabled = loading;
      submitBtn.textContent = loading ? "Finalizing…" : "Finalize & Sign";
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    loadPatientContext();
  </script>
</body>
</html>
