<!DOCTYPE html>
<html>
<head>
  <title>Upload Prescription Template</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body style="background:#0b0f1a; color:white; font-family:Arial;">

  <div style="max-width:400px; margin:100px auto; background:#111827; padding:30px; border-radius:12px;">
    <h2>Upload Prescription Template</h2>

    <input type="file" id="fileInput" accept="application/pdf" />
    <br/><br/>

    <button onclick="uploadTemplate()" style="padding:10px 20px; background:#2563eb; color:white; border:none; border-radius:8px;">
      Upload Template
    </button>

    <p id="message" style="margin-top:20px; color:#f87171;"></p>
  </div>

<script>
async function uploadTemplate() {
  const fileInput = document.getElementById("fileInput");
  const message = document.getElementById("message");

  if (!fileInput.files.length) {
    message.innerText = "Please select a PDF file.";
    return;
  }

  const file = fileInput.files[0];

  const session = JSON.parse(localStorage.getItem("supabase.auth.token"));

  if (!session || !session.currentSession) {
    message.innerText = "Not authenticated.";
    return;
  }

  const token = session.currentSession.access_token;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/api/upload-prescription-template", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token
      },
      body: formData
    });

    const data = await res.json();

    if (!res.ok) {
      message.innerText = data.error || "Upload failed.";
    } else {
      message.style.color = "#4ade80";
      message.innerText = "Template uploaded successfully.";
    }

  } catch (err) {
    message.innerText = "Upload error.";
  }
}
</script>

</body>
</html>
