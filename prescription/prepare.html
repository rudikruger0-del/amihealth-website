<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AMI Health — Prepare Prescription</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <style>
    body{
      margin:0;
      font-family:Inter,system-ui,sans-serif;
      background:#02040e;
      color:#eaf6ff;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      padding:16px 24px;
      background:#050a16;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      background:#0b1020;
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px;
      padding:28px;
      max-width:520px;
      width:100%;
      text-align:center;
    }

    h1{font-size:20px;margin-bottom:10px}
    p{font-size:14px;color:#94a3b8}

    .muted{font-size:12px;margin-top:12px;color:#94a3b8}

    .viewer{
      width:100%;
      height:100%;
      display:none;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      background:#000;
    }

    .error{
      color:#fca5a5;
      font-size:14px;
      margin-top:14px;
    }
  </style>
</head>

<body>

<header>
  <div><b>AMI Health</b> — Prescription Preparation</div>
</header>

<div class="container" id="loadingCard">
  <div class="card">
    <h1>Prepare Prescription</h1>
    <p>
      Loading doctor’s prescription template<br/>
      and patient details…
    </p>
    <div class="muted">
      Report ID:
      <span id="reportId">—</span>
    </div>
    <div class="error" id="errorBox" style="display:none"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <iframe id="pdfFrame"></iframe>
</div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const reportId = params.get("report_id");

  document.getElementById("reportId").textContent = reportId || "—";

  if (!reportId) {
    showError("Missing report_id in URL.");
    return;
  }

  // --------------------------------
  // Get auth token (existing pattern)
  // --------------------------------
  const authKey = Object.keys(localStorage)
    .find(k => k.startsWith("sb-") && k.endsWith("-auth-token"));

  if (!authKey) {
    showError("You are not logged in.");
    return;
  }

  const token = JSON.parse(localStorage.getItem(authKey))?.access_token;
  if (!token) {
    showError("Authentication token missing.");
    return;
  }

  try {
    const res = await fetch("/api/generate-prescription-draft", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ report_id: reportId })
    });

    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt || "Failed to generate prescription draft");
    }

    const data = await res.json();
    const draftPath = data?.prescription_draft_path;

    if (!draftPath) {
      throw new Error("Prescription draft path missing in response.");
    }

    clearError();

    // -----------------------
    // Show prescription PDF
    // -----------------------
    document.getElementById("loadingCard").style.display = "none";
    document.getElementById("viewer").style.display = "block";
    document.getElementById("pdfFrame").src = draftPath;

  } catch (e) {
    showError(e.message || "Unexpected error");
  }

  function showError(msg){
    const box = document.getElementById("errorBox");
    box.textContent = msg;
    box.style.display = "block";
  }

  function clearError(){
    const box = document.getElementById("errorBox");
    box.textContent = "";
    box.style.display = "none";
  }
})();
</script>

</body>
</html>
