<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – AMI Health</title>

  <style>
    :root {
      --bg: #030414;
      --card: #0b1020;
      --muted: #98a0b3;
      --accent: #00e0b8;
      --accent-2: #00b3ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1230 0, #020214 55%, #02010c 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(0, 224, 184, 0.07), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 179, 255, 0.07), transparent 40%),
                  rgba(6, 10, 30, 0.96);
      padding: 40px 36px 30px;
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,30,0.95);
      color: #fff;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001319;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 40px rgba(0,179,255,0.5);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .status.ok { color: #7ef7d3; }
    .status.err { color: #ff8f9b; }
    .status.info { color: #98a0b3; }

    a.back {
      margin-top: 20px;
      display: inline-block;
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Forgot Password</h1>
    <p>Enter your email and MP number to continue.</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@clinic.co.za" />

    <label>MP Number</label>
    <input type="text" id="mp" placeholder="MP1234567" />

    <button id="nextBtn">Next</button>

    <div class="status" id="status"></div>

    <a href="/login.html" class="back">← Back to Login</a>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("nextBtn");
    const emailInput = document.getElementById("email");
    const mpInput = document.getElementById("mp");

    function setStatus(msg, type="info") {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    btn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const mp = mpInput.value.trim();

      if (!email || !mp) {
        setStatus("Please enter both fields.", "err");
        return;
      }

      btn.disabled = true;
      setStatus("Checking details…", "info");

      const { data, error } = await supabase
        .from("doctors")
        .select("id")
        .eq("email", email)
        .eq("mp_number", mp)
        .single();

      if (error || !data) {
        setStatus("No matching doctor found.", "err");
        btn.disabled = false;
        return;
      }

      // Verified — redirect to password reset
      window.location.href = `/reset-password.html?uid=${data.id}`;
    });
  </script>

</body>
</html>
